- id: p005
  s:
    '01': Gli Eccellentissimi Signori Capi dell'Eccelso Consiglio de' X infrascritti, havuta fede dalli Signori Reformatori del Studio di Padova per relatione delli due a questo deputati, cioè dal Reverendo Padre Inquisitor, e dal Circospetto Secretario del Senato Gio. Maraviglia, con giuramento, come nel libro intitolato \capsemph{sydereus nuncius}, etc. di D. Galileo Galilei non si trova alcuna cosa contraria alla Santa Fede Cattolica, Prencipi, e buoni costumi, e che è degno di stampa, concedono licenza, che possi esser stampato in questa Città.
