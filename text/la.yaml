- id: p043
  s:
    '01': 'Die vicesima secunda, hora 2, consimilis fuit stellarum dispositio: ⟦|⟧'
    '02': a stella orientali ad Iovem minutorum primorum 5 fuit intervallum, a Iove ad occidentaliorem min. 7.
    '03': Duae vero occidentales intermediae distabant ad invicem min. 0, sec. 40; propinquior vero Iovi aberat ab illo min. 1.
    '04': 'Ipsae mediae stellulae minores erant extremis: fuerunt vero secundum eandem rectam lineam iuxta zodiaci longitudinem extensae, nisi quod trium occidentalium media paululum in austrum deflectebat.'
    '05': 'Sed, hora noctis sexta, in hac constitutione visae sunt: ⟦|⟧'
