- id: p068
  s:
    '01': 'Die 18, hora 1, tres aderant stellae, quarum duae occidentales, orientalis vero una: ⟦|⟧'
    '02': 'distabat orientalis a Iove min. 3, occidentalis proxima min. 2; occidentalior reliqua aberat a media min. 8: omnes fuerunt in eadem recta ad unguem, et eiusdem fere magnitudinis.'
    '03': 'At, hora 2, stellae viciniores paribus a Iove aberant interstitiis: occidua enim aberat ipsa quoque min. 3.'
    '04': 'Sed, hora 6, quarta stellula visa est inter orientaliorem et Iovem, in tali configuratione: orientalior distabat a sequenti min. 3, sequens a ⟦26r⟧ Iove min. 1, sec. 50, Iuppiter ab occidentali sequenti min. 3, haec vero ab occidentaliori min. 7: ⟦|⟧'
    '05': 'erant fere aequales; orientalis tantum Iovi proxima reliquis erat paulo minor: erantque in eadem recta eclipticae parallela.'
- id: p069
  s:
    '01': Die 19, hora 0, min. 40, stellae duae solummodo occiduae a Iove conspectae fuerunt, satis magnae, et in eadem recta cum Iove ad unguem, ac secundum eclipticae ductum dispositae. ⟦|⟧
    '02': Propinquior a Iove distabat min. 7, haec vero ab occidentaliori min. 6.
- id: p070
  s:
    '01': Die 20, nubilosum fuit caelum.
- id: p071
  s:
    '01': 'Die 21, hora 1, min. 30, stellulae tres satis exiguae cernebantur in hac constitutione: ⟦|⟧'
    '02': 'orientalis aberat a Iove min. 2, Iuppiter ab occidentali sequente min. 3, haec vero ab occidentaliori min. 7: erant ad unguem in eadem recta eclipticae parallela.'
- id: p072
  s:
    '01': 'Die 25, hora 1, min. 30 (nam superioribus tribus noctibus caelum fuit nubibus obductum), tres apparuerunt stellae: ⟦|⟧'
    '02': 'orientales duae, quarum distantiae inter se et a Iove ⟦26v⟧ aequales fuerunt, ac min. 4; occidentalis una aberat a Iove min. 2: erant in eadem recta ad unguem, secundum eclipticae ductum.'
  notes:
