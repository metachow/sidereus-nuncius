- id: p073
  s:
    '01': 'Die 26, hora 0, min. 30, binae tantum aderant stellae: ⟦|⟧'
    '02': 'orientalis una, distans a Iove min. 10; occidentalis altera, distans min. 6: orientalis erat aliquanto minor occidentali.'
    '03': 'Sed hora 5, tres visae sunt stellae: ⟦|⟧'
    '04': praeter enim duas iam adnotatas, tertia ex occidente prope Iovem, admodum exigua, cernebatur, quae prius sub Iove latitabat, distabatque ab eo min. 1; orientalis vero remotior, quam antea, videbatur, distans nempe a Iove min. 11.
    '05': 'Hac nocte primum Iovis et adiacentium planetarum progressum, secundum zodiaci longitudinem, facta relatione ad fixam quandam, observare placuit: spectabatur enim fixa stella orientem versus, distans a planeta orientali min. 11, et paululum in austrum deflectebat, in hunc qui sequitur modum:'
- id: p074
  s:
    '01': 'Die 27, hora 1, min. 4, apparebant stellae in tali configuratione: orientalior distabat a Iove min. 10, sequens, Iovi proxima, min. 0, sec. 30; occidentalis sequens aberat ⟦27r⟧ min. 2, sec. 30; ab hac occidentalior distabat min. 1. ⟦|⟧'
    '02': Viciniores Iovi exiguae apparebant, praesertim orientalis; extremae vero erant admodum conspicuae, in primis vero occidua; rectamque lineam secundum eclipticae ductum designabant ad unguem.
    '03': Horum planetarum progressus versus ortum ex collatione ad praedictam fixam manifeste cernebatur; ipsi enim Iuppiter cum adstantibus planetis vicinior erat, ut in apposita figura videre licet.
    '04': Sed hora 5, stella orientalis Iovi proxima aberat ab eo min. 1.
- id: p075
  s:
    '01': 'Die 28, hora 1, duae tantum stellae videbantur; orientalis, distans a Iove min. 9; occidentalis vero, min. 2: erant satis conspicuae et in eadem recta: ad quam lineam fixa perpendiculariter incidebat in planetam orientalem, veluti in figura: ⟦|⟧'
    '02': 'sed, hora 5, tertia stellula, ex oriente distans a Iove min. 2, conspecta est in eiusmodi constitutione:'
- id: p076
  s:
    '01': Die 1 Martii, hora 0, min. 40, quattuor stellae orientales
- id: p077
  s:
    '01': 'Die 2, hora 0, min. 40, tres adstabant planetae, orientales duo, unus vero occiduus, in tali configuratione: ⟦|⟧'
    '02': 'Aberat orientalior a Iove min. 7, ab hoc distabat sequens min. 0, sec. 30; occidentalis vero elongabatur a Iove min. 2: erant extremi lucidiores ac maiores reliquo, qui admodum exiguus apparebat.'
    '03': Orientalior a recta linea, per reliquos et Iovem ducta, paululum in boream videbatur elatus.
    '04': Fixa iam adnotata ab occidentali planeta min. 8 distabat, secundum perpendicularem ab ipso planeta ductam super lineam rectam per planetas omnes extensam; veluti apposita figura demonstrat.
- id: p078
  s:
    '01': Hasce Iovis et adiacentium planetarum ad fixam collationes ⟦28r⟧ apponere placuit, ut ex illis eorundem planetarum progressus, tum secundum longitudinem, tum etiam secundum latitudinem, cum motibus, qui ex tabulis hauriuntur, ad unguem congruere, quilibet intellegere possit. ⟦28v⟧ offert stellas, dum omnes simul cum Iove, 12 annorum spatio, magnum circa Solem permeant orbem.
    '02': Praetereundum tandem non est, quanam ratione contingat, ut Medicea Sidera, dum angustissimas circa Iovem rotationes absolvunt, semetipsis interdum plusquam duplo maiora videantur.
    '03': Causam in vaporibus terrenis minime quaerere possumus; apparent enim aucta, seu minuta, dum Iovis et propinquarum fixarum moles nil immutatae cernuntur.
    '04': 'Accedere autem illos, adeoque a Terra elongari, circa suae conversionis perigaeum, aut apogaeum, ut tantae mutationis causam nanciscantur, omnino inopinabile videtur: nam arta circularis latio id nulla ratione praestare valet; ovalis vero motus (qui in hoc casu rectus fere esset) et inopinabilis, et iis quae apparent nulla ratione consonus, esse videtur.'
    '05': Quod hac in re succurrit, lubens profero, ac recte philosophantium iudicio censuraeque exhibeo.
    '06': 'Constat, terrestrium vaporum obiectu Solem Lunamque maiores, sed fixas atque planetas minores, apparere: hinc luminaria prope horizontem maiora, stellae vero, minores ac plerumque inconspicuae, imminuuntur etiam magis, si iidem vapores lumine fuerint perfusi; idcirco stellae interdiu ac intra crepuscula admodum exiles apparent; Luna non item, ut supra quoque monuimus.'
    '07': 'Constat insuper, non modo Tellurem, sed etiam Lunam, suum habere vaporosum orbem circumfusum, tum ex his quae supra diximus, tum maxime ex iis, quae fusius in nostro systemate dicentur: at idem quoque de reliquis planetis ferre iudicium congrue possumus; adeo ut etiam circa Iovem densiorem reliquo aethere ponere orbem, inopinabile minime videatur; circa quem, instar Lunae circa elementorum sphaeram, planetae \capsemph{medicei} circumducantur, atque huius orbis obiectu, dum apogaei fuerint, minores, dum vero perigaei, per eiusdem orbis ablationem, seu attenuationem, maiores, appareant.'
    08: Ulterius progredi temporis angustia inhibet; plura de his brevi candidus lector exspectet.
  notes:
    1: '% 1610: auriuntur'
