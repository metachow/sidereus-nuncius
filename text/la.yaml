    '07': 'Tres vero occidentales, et a Iove et ad invicem, aequaliter dirimebantur, erantque intercapedines singulae min. 1, sec. 20 proxime: ⟦21r⟧'
    08: et stella Iovi vicinior reliquis duabus sequentibus minor apparebat; omnesque in eadem recta exquisite dispositae videbantur.
  notes:
