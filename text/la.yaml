- id: p001
  s:
    '01': \woodinitial{P}{raeclarum} sane atque humanitatis plenum eorum fuit institutum, qui excellentium virtute virorum res praeclare gestas ab invidia tutari, eorumque immortalitate digna nomina ab oblivione atque interitu vindicare, conati sunt.
    '02': Hinc ad memoriam posteritatis proditae imagines, vel marmore insculptae, vel ex aere fictae; hinc positae statuae, tam pedestres, quam equestres; hinc columnarum atque pyramidum, ut inquit ille, sumptus ad sidera ducti; hinc denique urbes aedificatae, eorumque insignitae nominibus, quos grata posteritas aeternitati commendandos existimavit.
    '03': Eiusmodi est enim humanae mentis conditio, ut nisi assiduis rerum simulacris in eam extrinsecus irrumpentibus pulsetur, omnis ex illa recordatio facile effluat.
- id: p002
  s:
    '01': Verum alii firmiora ac diuturniora spectantes, aeternum summorum virorum praeconium non saxis ac metallis, ⟦3r⟧ virtutes tuas in omne tempus loquantur ac celebrent.
    '02': En igitur quattuor sidera tuo inclito nomini reservata, neque illa de gregario ac minus insigni inerrantium numero, sed ex illustri vagantium ordine; quae quidem disparibus inter se motibus circum Iovis stellam ceterarum nobilissimam, tamquam germana eius progenies, cursus suos orbesque conficiunt celeritate mirabili, interea dum unanimi concordia circa mundi centrum, circa Solem nempe ipsum, omnia simul duodecimo quoque anno magnas convolutiones absolvunt.
    '03': Ut autem inclito Celsitudinis tuae nomini prae ceteris novos hosce planetas destinarem, ipsemet siderum Opifex perspicuis argumentis me admonere visus est.
    '04': Etenim, quemadmodum hae stellae, tamquam Iove digna proles, numquam ab illius latere, nisi exiguo intervallo, discedunt; ita quis ignorat clementiam, animi mansuetudinem, morum suavitatem, regii sanguinis splendorem, in actionibus maiestatem, auctoritatis et imperii in alios amplitudinem, quae quidem omnia in tua Celsitudine sibi domicilium ac sedem collocarunt, quis, inquam, ignorat, haec omnia ex benignissimo Iovis astro, secundum Deum omnium bonorum fontem, emanare?
    '05': Iuppiter, Iuppiter, inquam, a primo Celsitudinis tuae ortu, turbidos horizontis vapores iam transgressus, mediumque caeli cardinem occupans, orientalemque angulum sua regia illustrans, felicissimum partum ex sublimi illo throno prospexit, omnemque splendorem atque amplitudinem suam in purissimum aerem profudit, ut universam ⟦3v⟧ illam vim ac potestatem tenerum corpusculum una cum animo, nobilioribus ornamentis iam a Deo decorato, primo spiritu hauriret.
    '06': Verum, quid ego probabilibus utor argumentationibus, cum id necessaria propemodum ratione concludere ac demonstrare queam?
    '07': Placuit Deo Optimo Maximo, ut a Serenissimis parentibus tuis non indignus existimarer, qui Celsitudini tuae in tradendis mathematicis disciplinis operam navarem; quod quidem praestiti quattuor superioribus annis proxime elapsis, eo anni tempore, quo a severioribus studiis otium esse consuevit.
    08: Quocirca cum mihi divinitus plane contigerit, ut Celsitudini tuae inservirem, atque ideo incredibilis clementiae ac benignitatis tuae radios propius exceperim, quid mirum si animus meus adeo incaluit, ut nihil aliud propemodum dies noctesque meditetur, quam ut ego, qui non solum animo, sed etiam ipso ortu ac natura, sub tua dominatione sum, tuae gloriae cupidissimus et quam gratissimus erga te esse cognoscar?
    09: Quae cum ita sint, cum, te auspice, \capsemph{Cosme} Serenissime, has stellas superioribus astronomis omnibus incognitas exploraverim, optimo iure eas augustissimo prosapiae tuae nomine insignire decrevi.
    '10': Quod si illas primus indagavi, quis me iure reprehendat, si iisdem quoque nomen imposuero, ac \capsemph{medicea sidera} appellaro? sperans fore, ut tantum dignitatis ex hac appellatione iis sideribus accedat, quantum alia ceteris heroibus attulerunt.
    '11': Nam, ut taceam de Serenissimis tuis maioribus, quorum gloriam sempiternam omnium ⟦4r⟧ historiarum monumenta testantur, sola tua virtus, Maxime Heros, illis astris impertiri potest nominis immortalitatem.
    '12': Cui enim dubium esse potest, quin, quam tui exspectationem felicissimis imperii auspiciis concitasti, quamvis summam, eam non solum sustineas ac tuearis, verum etiam longo intervallo superaturus sis? ut cum alios tui similes viceris, tecum nihilominus ipse certes, ac te ipso ac magnitudine tua in dies maior evadas.
  notes:
    2: '% 1610: MEDICAEA SYDERA'
- id: p003
  s:
    '01': Suscipe itaque, Clementissime Princeps, hanc tibi ab astris reservatam gentiliciam gloriam, et illis divinis bonis, quae non tam a stellis, quam a stellarum Opifice ac Moderatore Deo, tibi deferuntur, quam diutissime fruere.
