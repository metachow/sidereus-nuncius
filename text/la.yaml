  s:
    '01': 'Die decima septima, hora 1, duae aderant stellae: ⟦|⟧'
    '02': 'orientalis una, a Iove distans min. 3, occidentalis altera, distans min. 10: haec erat aliquanto minor orientali.'
    '03': Sed, hora 6, orientalis proximior erat Iovi, distabat nempe min. 0, sec. 50; occidentalis vero remotior fuit, scilicet min. 12.
