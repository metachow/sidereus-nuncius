- id: p044
  s:
    '01': 'Die vicesima tertia, hora 0, min. 40 ab occasu, in hunc ferme modum stellarum constitutio se habuit: ⟦|⟧'
    '02': 'erant tres stellae cum Iove in recta linea secundum zodiaci longitudinem, veluti semper fuerunt: orientales erant duae, una vero occidentalis.'
    '03': 'Orientalior aberat a sequenti min. 7, haec vero a Iove min. 2, sec. 40, Iuppiter ab occidentali min. 3, sec. 20: erantque omnes magnitudine fere aequales.'
    '04': 'Sed, hora quinta, duae stellae, quae prius Iovi erant proximae, amplius non cernebantur, sub Iove, ut arbitror, latitantes; fuitque talis aspectus:'
- id: p045
  s:
    '01': 'Die vicesima quarta, tres stellae, orientales omnes, visae sunt, ac fere in eadem cum Iove recta linea: ⟦|⟧'
    '02': media enim modice in austrum deflectebat.
    '03': 'Iovi propinquior distabat ab eo min. 2, sequens ab hac min. 0, sec. 30, ab hac vero aberat orientalior min. 9: erantque omnes admodum splendidae.'
    '04': 'Hora vero sexta, duae ⟦21v⟧ solummodo sese offerebant stellae in hoc positu: nempe cum Iove in eadem recta linea ad unguem, a quo elongabatur propinquior min. 3, altera vero ab hac min. 8: in unam, ni fallor, coierant duae mediae prius observatae stellulae.'
- id: p046
  s:
    '01': 'Die vicesima quinta, hora 1, min. 40, ita se habebat constitutio: ⟦|⟧'
    '02': 'aderant enim duae tantum stellae ex orientali plaga, eaeque satis magnae: orientalior a media distabat min. 5, media vero a Iove min. 6.'
- id: p047
  s:
    '01': 'Die vicesima sexta, hora 0, min. 40, stellarum coordinatio eiusmodi fuit: ⟦|⟧'
    '02': 'spectabantur enim stellae tres, quarum duae orientales, tertia occidentalis a Iove: haec ab eo min. 5 aberat, media vero orientalis ab eodem distabat min. 5, sec. 20; orientalior vero a media min. 6: in eadem recta constitutae, et eiusdem magnitudinis erant.'
    '03': 'Hora deinde quinta, constitutio fere eadem fuit; in hoc tantum discrepans, quod prope Iovem quarta stellula ex oriente emergebat, ceteris minor, a Iove tunc remota min. 30, sed paululum a recta linea versus boream attollebatur, ut apposita figura demonstrat:'
- id: p048
  s:
    '01': 'Die vicesima septima, hora 1 ab occasu, unica tantum ⟦22r⟧ stellula conspiciebatur, eaque orientalis, secundum hanc constitutionem: ⟦|⟧'
    '02': eratque admodum exigua, et a Iove remota min. 7.
- id: p049
  s:
    '01': Die vicesima octava et vicesima nona, ob nubium interpositionem nihil observare licuit.
- id: p050
  s:
    '01': 'Die tricesima, hora prima noctis, tali pacto constituta spectabantur sidera: ⟦|⟧'
    '02': 'unum aderat orientale, a Iove distans min. 2, sec. 30, duo vero ex occidente, quorum Iovi propinquius aberat ab eo min. 3, reliquum ab hoc min. 1: extremorum et Iovis positus in eadem recta linea fuit, at media stella paululum in boream attollebatur: occidentalior fuit reliquis minor.'
  notes:
    1: '% 1610: reliquuum'
- id: p051
  s:
    '01': 'Die ultima, hora secunda, visae sunt orientales stellae duae, una vero occidua: ⟦|⟧'
    '02': 'Orientalium media a Iove aberat min. 2, sec. 20; orientalior vero ab ipsa media min. 0, sec. 30; occidentalis distabat a Iove min. 10: erant in eadem recta linea proxime, orientalis tantum Iovi vicinior modicum quiddam in septentrionem elevabatur.'
    '03': Hora vero quarta, duae orientales viciniores ⟦22v⟧ ad invicem adhuc erant; aberant enim solummodo sec. 20.
    '04': Apparuit in hisce observationibus occidentalis stella satis exigua.
  notes:
    0: '% 维基文库录文误作 Stellaeie；1610 作 Stellae'
- id: p052
  s:
    '01': 'Die Februarii prima, hora noctis secunda, consimilis fuit constitutio: ⟦|⟧'
    '02': 'Distabat orientalior stella a Iove min. 6, occidentalis vero 8; ex parte orientali stella quaedam, admodum exigua, a Iove distabat minutis secundis 20: rectam ad unguem designabant lineam.'
- id: p053
  s:
    '01': 'Die secunda, iuxta hunc ordinem visae sunt stellae: ⟦|⟧'
    '02': 'Una tantum orientalis a Iove distabat min. 6; Iuppiter ab occidentali viciniori aberat min. 4; inter hanc et occidentaliorem min. 8 fuit intercapedo: erant in eadem recta ad unguem, et eiusdem fere magnitudinis.'
    '03': 'Sed, hora septima, quattuor aderant stellae: ⟦|⟧'
    '04': inter quas Iuppiter mediam occupabat sedem.
    '05': 'Harum stellarum orientalior distabat a sequenti min. 4, haec a Iove min. 1, sec. 40: Iuppiter ab occidentali sibi viciniori aberat min. 6, haec vero ab occidentaliori min. 8: erantque pariter omnes in eadem recta linea, secundum zodiaci longitudinem extensa.'
- id: p054
  s:
    '01': 'Die tertia, hora septima, in hac serie dispositae fuerunt stellae: orientalis a Iove distabat min. 1, sec. 30, occidentalis ⟦23r⟧ proxima min. 2: ab hac vero elongabatur occidentalior altera min. 10: erant praecise in eadem recta, et magnitudinis aequalis.'
- id: p055
  s:
    '01': 'Die quarta, hora secunda, circa Iovem quattuor stabant stellae, orientales duae, ac duae occidentales, in eadem ad unguem recta linea dispositae, ut in proxima figura: ⟦|⟧'
    '02': Orientalior distabat a sequenti min. 3, haec vero a Iove aberat min. 0, sec. 40, Iuppiter a proxima occidentali min. 4, haec ab occidentaliori min. 6.
    '03': Magnitudine erant fere aequales; proximior Iovi reliquis paulo minor apparebat.
    '04': Hora autem septima, orientales stellae distabant tantum min. 0, sec. 30. ⟦|⟧
    '05': 'Iuppiter ab orientali viciniori aberat min. 2, ab occidentali vero sequente min. 4, haec vero ab occidentaliori distabat min. 3: erantque aequales omnes, et in eadem recta secundum eclipticam extensa.'
- id: p056
  s:
    '01': Die quinta, caelum fuit nubilosum.
- id: p057
  s:
    '01': 'Die sexta, duae solummodo apparuerunt stellae, medium ⟦23v⟧ Iovem intercipientes, ut in figura apposita spectatur: orientalis a Iove distabat min. 2, occidentalis vero min. 3: erant in eadem recta cum Iove, et magnitudine pares.'
- id: p058
  s:
    '01': 'Die septima, duae adstabant stellae, a Iove orientales ambae, in hunc dispositae modum: ⟦|⟧'
    '02': intercapedines inter ipsas et Iovem erant aequales, unius nempe minuti primi; ac per ipsas et centrum Iovis recta linea incedebat.
- id: p059
  s:
    '01': 'Die octava, hora prima, aderant tres stellae orientales omnes, ut in descriptione: ⟦|⟧'
    '02': Iovi proxima, exigua satis, distabat ab eo min. 1, sec. 20; media vero ab hac min. 4, eratque satis magna; orientalior, admodum exigua, ab hac distabat min. 0, sec. 20.
    '03': 'Anceps eram, numquid Iovi proxima una tantum, an duae forent stellulae; videbatur enim interdum huic alia adesse versus ortum, mirum in modum exigua, et ab illa seiuncta per min. 0, sec. 10 tantum: fuerunt omnes in eadem recta linea secundum zodiaci ductum extensae.'
    '04': 'Hora vero tertia, stella Iovi proxima illum fere tangebat; distabat enim ab eo min. 0, sec. 10 tantum: reliquae vero a Iove remotiores factae fuerunt; aberat enim media a Iove min. 6.'
    '05': Tandem, hora quarta, quae prius Iovi proxima erat, cum eo iuncta, non cernebatur amplius.
  notes:
    1: '% 1610: aliam; mirum immodum; aberant'
- id: p060
  s:
    '01': 'Die nona, hora 0, min. 30, adstabant Iovi stellae duae ⟦24r⟧ orientales, et una occidentalis, in tali dispositione: ⟦|⟧'
    '02': Orientalior, quae satis exigua erat, a sequenti distabat min. 4; media, maior, a Iove aberat min. 7; Iuppiter ab occidentali, quae parva erat, distabat min. 4.
  notes:
    0: '% Favaro: m. 30'
- id: p061
  s:
    '01': 'Die decima, hora prima, min. 30, stellulae binae, admodum exiguae, orientales ambae, in tali dispositione visae sunt: ⟦|⟧'
    '02': remotior distabat a Iove min. 10, vicinior vero min. 0, sec. 20; erantque in eadem recta.
    '03': 'Hora autem quarta, stella Iovi proxima amplius non apparebat: altera quoque adeo imminuta videbatur, ut vix cerni posset, licet aer praeclarus esset; et a Iove remotior, quam antea, erat; distabat siquidem min. 12.'
- id: p062
  s:
    '01': Die undecima, hora prima, aderant ab oriente stellae duae, et una ab occasu. ⟦|⟧
    '02': 'Distabat occidentalis a Iove min. 4; orientalis vicinior aberat pariter a Iove min. 4; orientalior vero ab hac distabat min. 8: erant satis perspicuae, et in eadem recta.'
    '03': 'Sed hora tertia, stella quarta, Iovi proxima, ab oriente visa est, reliquis ⟦24v⟧ minor, a Iove dissita per min. 0, sec. 30, et a recta linea per reliquas stellas protracta, modicum in aquilonem deflectens: splendidissimae erant omnes, ac valde conspicuae.'
    '04': 'Hora vero quinta cum dimidia, iam stella orientalis, Iovi proxima, ab illo remotior facta, medium inter ipsum et stellam orientaliorem, sibi propinquam, obtinebat locum; erantque omnes in eadem recta linea ad unguem, et eiusdem magnitudinis, ut in apposita descriptione videre licet:'
- id: p063
  s:
    '01': Die duodecima, hora 0, min. 40, stellae binae ab ortu, binae pariter ab occasu, adstabant. ⟦|⟧
    '02': Orientalis remotior a Iove distabat min. 10, longinquior vero occidentalis aberat min. 8, erantque ambae satis conspicuae; reliquae duae Iovi erant vicinissimae, et admodum exiguae, praesertim orientalis, quae a Iove distabat min. 0, sec. 40; occidentalis vero, min. 1.
    '03': Hora vero quarta, stellula, quae Iovi erat proxima ex oriente, amplius non apparebat.
- id: p064
  s:
    '01': Die decima tertia, hora 0, min. 30, duae stellae apparebant ab ortu, duae insuper ab occasu. ⟦|⟧
    '02': Orientalis ac Iovi vicinior, satis perspicua, distabat ab eo min. 2; ab hac orientalior, minus apparens, aberat min. 4.
    '03': Ex occidentalibus, ⟦25r⟧ remotior a Iove, conspicua valde, ab eo dirimebatur min. 4; inter hanc et Iovem intercidebat stellula exigua ac occidentaliori stellae vicinior, cum ab ea non magis abesset min. 0, sec. 30.
    '04': Erant omnes in eadem recta secundum eclipticae longitudinem ad unguem.
  notes:
    0: '% 1610: decimatertia'
- id: p065
  s:
    '01': 'Die decima quinta (nam decima quarta caelum nubibus fuit obductum), hora prima, talis fuit astrorum positus: ⟦|⟧'
    '02': 'tres nempe erant orientales stellae, nulla vero cernebatur occidentalis: orientalis Iovi proxima distabat ab eo min. 0, sec. 50; sequens ab hac aberat min. 0, sec. 20, ab hac vero orientalior min. 2; eratque reliquis maior; viciniores enim Iovi erant admodum exiguae.'
    '03': Sed, hora proxime quinta, ex stellis Iovi proximis una tantum cernebatur, a Iove distans min. 0, sec. 30; orientalioris vero elongatio a Iove adaucta erat; fuit enim tunc min. 4. ⟦|⟧
    '04': At, hora sexta, praeter duas, ut modo dictum est, ab oriente constitutas, una versus occasum cernebatur stellula, admodum exigua, a Iove remota min. 2.
  notes:
    0: '% 1610: decimaquinta, decimaquarta'
- id: p066
  s:
    '01': 'Die decima sexta, hora sexta, in tali constitutione steterunt: stella nempe orientalis a Iove min. 7 aberat, ⟦25v⟧ Iuppiter a sequenti occidua min. 5, haec vero a reliqua occidentaliori min. 3: erant omnes eiusdem proxime magnitudinis, satis conspicuae, et in eadem recta linea exquisite secundum zodiaci ductum.'
  notes:
    0: '% 1610: decimasexta'
