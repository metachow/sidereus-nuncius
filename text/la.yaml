    '05': 'Tandem, hora septima, tres ex occidente visae fuerunt stellulae: ⟦|⟧'
    '06': 'Iovi proxima aberat ab eo min. 0, sec. 20; inter hanc et occidentaliorem intervallum erat minutorum secundorum 40: inter has vero alia spectabatur paululum ad meridiem deflectens, ⟦20v⟧ ab occidentaliori non pluribus decem secundis remota.'
- id: p042
  s:
    '01': 'Die vicesima prima, hora 0, min. 30, aderant ex oriente stellulae tres, aequaliter inter se et a Iove distantes: ⟦|⟧'
    '02': interstitia vero, secundum existimationem, 50 secundorum minutorum fuere.
    '03': Aderat quoque stella ex occidente, a Iove distans min. 4.
    '04': Orientalis Iovi proxima erat omnium minima; reliquae vero aliquanto maiores, atque inter se proxime aequales.
  notes:
