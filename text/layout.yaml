- file: f14v
  folio: 14v
  items:
  - pair: f14v.1
    la:
    - raw: |-
        \noindent reliqua lunaris globi aspectui nostro exposita relinquatur; tunc luce non exigua hanc quoque Lunae plagam, licet solari lumine destitutam, splendere deprehendet, idque potissimum, si iam nocturnus horror ob Solis absentiam increverit; in campo enim obscuriori eadem lux clarior apparet. % 1610: orror
        Compertum insuper est, hanc secundam (ut ita dicam) Lunae claritatem maiorem esse, quo ipsa minus a Sole distiterit: per elongationem enim ab eo remittitur magis magisque, adeo ut post primam quadraturam, et ante secundam, debilis et admodum incerta comperiatur, licet in obscuriori caelo spectetur; cum tamen in sextili et minori elongatione, quamvis inter crepuscula, mirum in modum fulgeat; fulgeat, inquam, adeo, ut ope exacti perspicilli magnae maculae in ipsa distinguantur. Hic mirabilis fulgor non modicam philosophantibus intulit admirationem; pro cuius causa afferenda alii alia in medium protulerunt. Quidam enim proprium esse ac naturalem ipsiusmet Lunae splendorem dixerunt; alii, a Venere illi esse impertitum; alii, a stellis omnibus; alii, a Sole, qui radiis suis profundam Lunae soliditatem permeet. Verum huiuscemodi prolata exiguo labore coarguuntur, ac falsitatis evincuntur. Si enim aut proprium esset aut a stellis collatum eiusmodi lumen, illud maxime in eclipsibus retineret ostenderetque, cum in obscurissimo caelo destituatur; quod tamen adversatur experientiae: fulgor enim, qui in deliquiis apparet in Luna, longe minor est, subrufus ac quasi aeneus; hic vero clarior et candidior. Est insuper ille mutabilis ac loco mobilis; vagatur enim per Lunae faciem, adeo ut pars illa, quae peripheriae circuli umbrae terrestris propinquior est, clarior, reliqua vero obscurior, semper spectetur: ex quo omni procul dubio id accidere intellegimus, ex radiorum solarium
- file: f15r
  folio: 15r
  items:
  - pair: f15r.1
    la:
    - raw: |-
        \noindent vicinitate tangentium crassiorem quandam regionem, quae Lunam orbiculariter ambit; ex quo contactu aurora quaedam in vicinas Lunae plagas effunditur, non secus ac in terris, tum mane, tum vesperi, crepusculinum spargitur lumen: qua de re fusius in libro \textit{De systemate mundi} pertractabimus. % 1610: de Sistemate mundi
        Asserere autem a Venere impertitam eiusmodi lucem, puerile adeo est, ut responsione sit indignum. Quis enim adeo inscius erit, ut non intellegat, circa coniunctionem et intra sextilem aspectum partem Lunae Soli aversam, ut a Venere spectetur, omnino esse impossibile? Esse autem ex Sole, qui suo lumine profundam Lunae soliditatem penetret atque perfundat, pariter est inopinabile: numquam enim imminueretur, cum semper hemisphaerium Lunae a Sole sit illustratum, tempore lunarium eclipsium excepto; diminuitur tamen dum Luna ad quadraturam properat, et omnino etiam hebetatur, dum quadraturam superaverit. % 1610: quadratum
        Cum itaque eiusmodi secundarius fulgor nec Lunae sit congenitus atque proprius, nec a stellis ullis nec a Sole mutuatus, cumque iam in mundi vastitate corpus aliud supersit nullum, nisi sola Tellus, quid, quaeso, opinandum? quid proferendum? numquid a Terra ipsum lunare corpus, aut quidpiam aliud opacum atque tenebrosum lumine perfundi? quid mirum? maxime: aequa grataque permutatione rependit Tellus parem illuminationem ipsi Lunae, qualem et ipsa a Luna in profundioribus noctis tenebris toto fere tempore recipit. Rem clarius aperiamus. Luna in coniunctionibus, cum medium inter Solem et Terram obtinet locum, solaribus radiis in superiori suo hemisphaerio Terrae averso perfunditur; hemisphaerium vero inferius, quo Terram aspicit, tenebris est obductum; nullatenus igitur terrestrem superficiem illustrat. Luna, paulatim a Sole digressa, iam iam aliqua ex parte in hemisphaerio inferiori ad nos vergente illuminatur, albicantia cornua, subtilia tamen, ad nos convertit, et leviter Terram illustrat: crescit in Luna
