  - pair: f28r.2
    la:
    - raw: |-
        Hae sunt observationes quattuor Mediceorum planetarum, recens ac primo a me repertorum, ex quibus, quamvis illorum periodos numeris colligere nondum detur, licet saltem quaedam animadversione digna pronunciare. Ac primo, cum Iovem consimilibus interstitiis modo consequantur, modo praeeant, ab eoque tum versus ortum, tum in occasum angustissimis tantum divaricationibus elongentur, eundemque retrogradum pariter atque directum concomitentur, quin circa illum suas conficiant conversiones, interea dum circa mundi centrum omnes una duodecennales periodos absolvunt, nemini dubium esse potest. % 1610: duo decẽnales
        Convertuntur insuper in circulis inaequalibus: quod manifeste colligitur ex eo, quia in maioribus a Iove digressionibus numquam binos planetas iunctos videre licuit; cum tamen prope Iovem duo, tres et interdum omnes simul constipati reperti sint. Deprehenditur insuper, velociores esse conversiones planetarum angustiores circa Iovem circulos describentium: propinquiores enim Iovi stellae saepius spectantur orientales, cum pridie ex occasu apparuerint, et e contra: at planeta, maximum permeans orbem, accurate praeadnotatas reversiones perpendenti, restitutiones semimenstruas habere videtur. Eximium praeterea praeclarumque habemus argumentum pro scrupulo ab illis demendo, qui in systemate Copernicano conversionem planetarum circa Solem aequo animo ferentes, adeo perturbantur ab unius Lunae circa Terram latione, interea dum ambo annuum orbem circa Solem absolvunt, ut hanc universi constitutionem, tamquam impossibilem, evertendam esse arbitrentur: nunc enim, nedum planetam unum circa alium convertibilem habemus, dum ambo magnum circa Solem perlustrant orbem, verum quattuor circa Iovem, instar Lunae circa Tellurem, sensus nobis vagantes
