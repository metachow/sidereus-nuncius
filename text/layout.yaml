- file: f16r
  folio: 16r
  items:
  - pair: f16r.1
    la:
    - seg: p023:2
  - pair: f16r.2
    la:
    - raw: |-
        Diximus hucusque de observationibus circa lunare corpus habitis; nunc de stellis fixis ea, quae hactenus a nobis inspecta fuerunt, breviter in medium adferamus. % 1610: actenus
        Ac primo illud animadversione dignum est, quod scilicet stellae, tam fixae, quam errabundae, dum adhibito perspicillo spectantur, nequaquam magnitudine augeri videntur iuxta proportionem eandem, secundum quam obiecta reliqua, et ipsamet quoque Luna, acquirunt incrementa: verum in stellis talis auctio longe minor apparet; adeo ut perspicillum, quod reliqua obiecta secundum centuplam, gratia exempli, rationem multiplicare potens erit, vix secundum quadruplam aut quintuplam stellas multiplices reddere credas. Ratio autem huius est, quod scilicet astra, dum libera ac naturali oculorum acie spectantur, non secundum suam simplicem nudamque, ut ita dicam, magnitudinem sese nobis offerunt, sed fulgoribus quibusdam irradiata, micantibusque radiis crinita, idque potissimum cum iam increverit nox; ex quo longe maiores videntur, quam si ascititiis illis crinibus essent exuta: angulus enim visorius, non a primario stellae corpusculo, sed a late circumfuso splendore, terminatur. % 1610: ascitiis
        Hoc apertissime intellegas licet ex
