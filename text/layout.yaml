- file: f11r
  folio: 11r
  items:
  - pair: f11r.1
    la:
    - raw: |-
        Unum quoque oblivioni minime tradam, quod non nisi aliqua cum admiratione adnotavi: medium quasi Lunae locum a cavitate quadam occupatum esse reliquis omnibus maiori, ac figura perfectae rotunditatis; hanc prope quadraturas ambas conspexi, eandemque in secundis supra positis figuris quantum licuit imitatus sum: eundem, quoad obumbrationem et illuminationem, facit aspectum, ac faceret in terris regio consimilis Bohemiae, si montibus altissimis, inque peripheriam perfecti circuli dispositis, occluderetur undique; in Luna enim adeo elatis iugis vallatur, ut extrema ora tenebrosae Lunae parti contermina, Solis lumine perfusa spectetur, priusquam lucis umbraeque terminus ad mediam ipsius figurae diametrum pertingat. % 1610: extrema hora
        De more autem reliquarum macularum, umbrosa illius pars Solem respicit, luminosa vero versus tenebras Lunae constituitur; quod tertio libenter observandum admoneo, tamquam firmissimum argumentum asperitatum inaequalitatumque per totam Lunae clariorem plagam dispersarum: quarum quidem macularum semper nigriores sunt illae, quae confinio luminis et tenebrarum conterminae sunt, remotiores vero tum minores, tum obscurae minus apparent; ita ut tandem, cum Luna in oppositione totum impleverit orbem, modico admodumque tenui discrimine cavitatum opacitas ab eminentiarum candore discrepet.
    - seg: p018:0
