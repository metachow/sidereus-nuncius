  - pair: f02v.1
    mode: i
    la:
    - raw: |-
        \noindent sed Musarum custodiae et incorruptis litterarum monumentis consecrarunt. At quid ego ista commemoro? quasi vero humana solertia, his contenta regionibus, ulterius progredi non sit ausa; attamen longius illa prospiciens, cum optime intellegeret omnia humana monumenta vi, tempestate ac vetustate tandem interire, incorruptiora signa excogitavit, in quae tempus edax atque invidiosa vetustas nullum sibi ius vindicaret. % 1610: in qua
        In caelum itaque migrans, clarissimorum siderum notis sempiternis illis orbibus eorum nomina consignavit, qui ob egregia ac prope divina facinora digni habiti sunt, qui una cum astris aevo sempiterno fruerentur. Quam ob rem non prius Iovis, Martis, Mercurii, Herculis ceterorumque heroum, quorum nominibus stellae appellantur, fama obscurabitur, quam ipsorum siderum splendor exstinguatur. Hoc autem humanae sagacitatis inventum, cum primis nobile ac mirandum, multorum iam saeculorum intervallo exolevit, priscis heroibus lucidas illas sedes occupantibus ac suo quasi iure tenentibus: in quorum coetum frustra pietas Augusti Iulium Caesarem cooptare conata est; nam cum stellam suo tempore exortam, ex iis quas Graeci cometas, nostri crinitas vocant, Iulium sidus nuncupari voluisset, brevi illa evanescens, tantae cupiditatis spem delusit. % 1610: coaptare
        Atqui longe veriora ac feliciora, Princeps Serenissime, Celsitudini tuae possumus augurari; nam vix dum in terris immortalia animi tui decora fulgere coeperunt, cum in caelis lucida sidera sese offerunt, quae tamquam linguae praestantissimas
