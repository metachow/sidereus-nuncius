        \coordinate (D) at ({-0.5543*\R},\R);   % EA produced meets the tangent at D
        \coordinate (G) at ({0.42*\R},\R);
        \draw[line width=0.6pt] (D) -- (G) (C) -- (F) (E) -- (D);
        \node[above, inner sep=2pt] at (D) {D};
        \node[above, inner sep=2pt] at (C) {C};
        \node[above, inner sep=2pt] at (G) {G};
        \node[below left, inner sep=1pt] at (A) {A};
        \node[right, inner sep=2pt] at (E) {E};
        \node[below right, inner sep=1pt] at (F) {F};
      \end{tikzpicture}}
