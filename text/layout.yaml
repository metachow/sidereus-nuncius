# Pages of the 1610 edition in order: page style and the items on each page.
# pair: one Latin block (segments of la.yaml paragraphs, "p012:1" = 2nd segment of p012)
#       aligned with one translation block; fig / tex: raw LaTeX.
- file: f01r
  folio: 1r
  nohead: true
  items:
  - pair: f01r.1
    la:
    - raw: |-
        {\centering
         \dispcaps[25][14]{Sidereus}\\[2pt]
         \dispcaps[17][16]{Nuncius}\\[3pt]
         \dispcaps[9.5][8]{magna, longeque admirabilia}\\
         {\small Spectacula pandens, suspiciendaque proponens\\ unicuique, praesertim vero}\\[1pt]
         \lital{\addfontfeatures{LetterSpace=6}PHILOSOPHIS}, \lital{atque} \lital{\addfontfeatures{LetterSpace=6}ASTRONOMIS}, \lital{quae a}\\[3pt]
         \dispcaps[17][2]{Galileo Galileo}\\[1pt]
         \dispcaps[11.5][4]{Patricio Florentino}\\ % 1610: PATRITIO
         {\small Patavini gymnasii publico mathematico}\\[2pt]
         \dispcaps[12][10]{Perspicilli}\\[1pt]
         {\small\litsw{Nuper a se reperti beneficio sunt observata in}
          \lital{\addfontfeatures{LetterSpace=4}LUNAE FACIE, FIXIS INNUMERIS, LACTEO CIRCULO, STELLIS NEBULOSIS,}\\
          \litsw{Apprime vero in}}\\[1pt]
         \dispcaps[12][10]{Quattuor planetis}\\[1pt]
         {\small Circa \capsemph{Iovis} stellam disparibus intervallis atque periodis, celeritate mirabili circumvolutis; quos, nemini in hanc usque diem cognitos, novissime auctor deprehendit primus; atque}\\[3pt] % 1610: Author
         \dispcaps[17][2]{Medicea Sidera}\\[1pt]
         \dispcaps[9.5][8]{nuncupandos decrevit.}\par}
  - fig: |-
      % Title page. The type hierarchy follows the 1610 page line by line:
      % display capitals in four sizes, italic lines with swash capitals, roman lines.
      \spanfig{\vspace{2mm}\includegraphics[width=0.5\textwidth]{figures/orn_device}}
  - pair: f01r.2
    la:
    - raw: |-
        {\centering \capsemph{Venetiis}, apud Thomam Baglionum. \capsemph{MDCX}.\\[-2pt]
         \rule{0.85\linewidth}{0.5pt}\\[1pt]
         \lital{Superiorum permissu, et privilegio.}\par}
