- file: f09r
  folio: 9r
  items:
  - pair: f09r.1
    la:
    - raw: |-
        \noindent exiguae lucere coeperunt; donec, Luna iam occasum versus tendente, trigona illa figura, extensa et amplior iam facta, cum reliqua luminosa parte nectebatur, ac instar ingentis promontorii, a tribus iam commemoratis lucidis verticibus adhuc obsessa, in tenebrosum sinum erumpebat. In extremis quoque cornibus, tam superiori quam inferiori, splendida quaedam puncta, et omnino a reliquo lumine disiuncta, emergebant, veluti in eadem figura depictum cernitur. Eratque magna obscurarum macularum vis in utroque cornu, maxime autem in inferiori: quarum maiores et obscuriores apparent, quae termino lucis et tenebrarum viciniores sunt; remotiores vero obscurae minus ac magis dilutae. Semper tamen, ut supra quoque meminimus, nigricans ipsius maculae pars irradiationis solaris locum respicit, splendidior vero limbus nigricantem maculam in parte Soli aversa, et Lunae tenebrosam plagam respiciente, circumdat. Haec lunaris superficies, qua maculis, instar pavonis caudae caeruleis oculis, distinguitur, % 1610: Pavonis cauda
        vitreis illis vasculis redditur consimilis, quae adhuc calentia in frigidam immissa, perfractam undosamque superficiem acquirunt, ex quo a vulgo glaciales cyathi nuncupantur. % 1610: Glaciales Ciati nuncunpantur; Favaro (Wikisource): glaciales Gyathi
        Verum magnae eiusdem Lunae maculae consimili modo interruptae atque lacunis et eminentiis confertae minime cernuntur, sed magis aequabiles et uniformes; solummodo enim clarioribus nonnullis areolis hac illac scatent; adeo ut, si quis veterem Pythagoreorum sententiam exsuscitare velit, Lunam scilicet esse quasi Tellurem alteram, eius pars lucidior terrenam superficiem, obscurior vero aqueam, magis congrue repraesentet: mihi autem dubium fuit numquam, terrestris globi a longe conspecti atque a radiis solaribus perfusi, terream superficiem clariorem, obscuriorem vero aqueam, sese in conspectum
- file: f09v
  folio: 9v
  items:
  - pair: f09v.1
    la:
    - raw: |-
        \noindent daturam. Depressiores insuper in Luna cernuntur magnae maculae, quam clariores plagae; in illa enim, tam crescente quam decrescente, semper in lucis tenebrarumque confinio prominent hinc inde circa ipsas magnas maculas contermini partis lucidioris, veluti in describendis figuris observavimus: % 1610: prominente
        neque depressiores tantummodo sunt dictarum macularum termini, sed aequabiliores, nec rugis aut asperitatibus interrupti. Lucidior vero pars maxime prope maculas eminet; adeo ut, et ante quadraturam primam, et in ipsa ferme secunda, circa maculam quandam, superiorem, borealem nempe, Lunae plagam occupantem, valde attollantur, tam supra illam quam infra, ingentes quaedam eminentiae, veluti appositae prae se ferunt delineationes.
  - fig: |-
      % 扫描 0022：月面铜版画（上弦前后的月亮：右侧亮、左侧暗）。明暗交界线曲折不平；上部有亮点伸入暗部，交界线中部和下部可见凸出的亮块；交界线下部有一个大圆形环形山（即 f11r 所说居月面中部的大圆形洼地）；亮部中有大斑。图中无字母。
