  - fig: |-
      % 扫描 0028：几何示意图（月球周围的水汽球层）。实线圆为月球本体 ABC：A 在左端，B 在下端，C 在右端；外面大致同心的虚线圆为水汽球层 DEG：D 在左，紧贴 A 外侧，E 在左下、靠近 B，G 在右，紧贴 C 外侧。眼睛位于左方远处的 F；直线 FDA 水平，穿过薄薄一层水汽到达 A；直线 FEB 斜向右下，斜穿较厚的水汽层，在 B 处（月球下缘偏左）几乎与月面相切。两条线均为实线，自 F 发出。
      \spanfig{\begin{tikzpicture}[x=1mm, y=1mm, font=\small]
        % lunar body ABC (solid) and vaporous orb DEG (dotted); eye at F
        \def\r{19.7}\def\R{23.5}
        \draw[line width=0.6pt] (0,0) circle (\r);
        \draw[line width=0.5pt, dash pattern=on 1.1pt off 1.3pt, name path=orb] (0.6,0) circle (\R);
        \coordinate (F) at (-79,0);
        \coordinate (A) at (-\r,0);
        \coordinate (D) at (-\R+0.6,0);
        \coordinate (B) at (-104.4:\r);   % tangent point from F, as in the 1610 figure
        \path[name path=fb] (F) -- (B);
        \path[name intersections={of=orb and fb, by=E}];
        \draw[line width=0.6pt] (F) -- (A) (F) -- (B);
        \node[left, inner sep=2pt] at (F) {F};
        \node[above left, inner sep=1pt] at (D) {D};
        \node[above right, inner sep=1pt] at (A) {A};
        \node[below right, inner sep=1.5pt] at (B) {B};
        \node[below left, inner sep=1.5pt] at (E) {E};
        \node[left, inner sep=1.5pt] at (\r,0) {C};
        \node[right, inner sep=1.5pt] at (\R+0.6,0) {G};
      \end{tikzpicture}}
