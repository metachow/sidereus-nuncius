  - pair: f12v.1
    la:
    - raw: |-
        \noindent idem planum videntur extensi, quamvis inter fluctus maxima voraginum et lacunarum sit frequentia, adeoque profundarum, ut sublimium navigiorum non modo carinae, verum etiam puppes, mali ac vela inter illas abscondantur. Quia igitur in ipsa Luna et circa eius perimetrum multiplex est eminentiarum et cavitatum coordinatio, et oculus e longinquo spectans in eodem fere plano cum verticibus illarum locatur; nemini mirum esse debet, quod radio visorio illos abradenti, secundum aequabilem lineam minimeque anfractuosam sese offerant. Huic rationi altera subnecti potest: quod nempe circa lunare corpus est, veluti circa Terram, orbis quidam densioris substantiae reliquo aethere, qui Solis irradiationem concipere atque reflectere valet, quamvis tanta non sit opacitate praeditus, ut visui (praesertim dum illuminatus non fuerit) transitum inhibere valeat. Orbis iste a radiis solaribus illuminatus lunare corpus sub maioris sphaerae speciem reddit repraesentatque; % 1610: Orbis istae
        essetque potis aciem nostram terminare, quominus ad Lunae soliditatem pertingeret, si crassities eius foret profundior: atque profundior quidem est circa Lunae peripheriam; profundior, inquam, non absolute, sed ad radios nostros, oblique illum secantes, relatus: ac proinde visum nostrum inhibere potest, ac praesertim luminosus exsistens, Lunaeque peripheriam Soli expositam obtegere. Quod clarius in apposita figura intellegitur, in qua lunare corpus ABC
  - fig: |-
      % 扫描 0028：几何示意图（月球周围的水汽球层）。实线圆为月球本体 ABC：A 在左端，B 在下端，C 在右端；外面大致同心的虚线圆为水汽球层 DEG：D 在左，紧贴 A 外侧，E 在左下、靠近 B，G 在右，紧贴 C 外侧。眼睛位于左方远处的 F；直线 FDA 水平，穿过薄薄一层水汽到达 A；直线 FEB 斜向右下，斜穿较厚的水汽层，在 B 处（月球下缘偏左）几乎与月面相切。两条线均为实线，自 F 发出。
      \spanfig{\begin{tikzpicture}[x=1mm, y=1mm, font=\small]
        % lunar body ABC (solid) and vaporous orb DEG (dotted); eye at F
        \def\r{19.7}\def\R{23.5}
        \draw[line width=0.6pt] (0,0) circle (\r);
        \draw[line width=0.5pt, dash pattern=on 1.1pt off 1.3pt, name path=orb] (0.6,0) circle (\R);
        \coordinate (F) at (-79,0);
        \coordinate (A) at (-\r,0);
        \coordinate (D) at (-\R+0.6,0);
        \coordinate (B) at (-104.4:\r);   % tangent point from F, as in the 1610 figure
        \path[name path=fb] (F) -- (B);
        \path[name intersections={of=orb and fb, by=E}];
        \draw[line width=0.6pt] (F) -- (A) (F) -- (B);
        \node[left, inner sep=2pt] at (F) {F};
        \node[above left, inner sep=1pt] at (D) {D};
        \node[above right, inner sep=1pt] at (A) {A};
        \node[below right, inner sep=1.5pt] at (B) {B};
        \node[below left, inner sep=1.5pt] at (E) {E};
        \node[left, inner sep=1.5pt] at (\r,0) {C};
        \node[right, inner sep=1.5pt] at (\R+0.6,0) {G};
      \end{tikzpicture}}
- file: f13r
  folio: 13r
  items:
  - pair: f13r.1
    la:
    - raw: |-
        \noindent ab orbe vaporoso circumdatur DEG; oculus vero ex F ad partes intermedias Lunae, ut ad A, pertingit per vapores DA minus profundos: at versus extremam oram, profundiorum copia vaporum EB aspectum nostrum suo termino praecludit. % 1610: extremam horam
        Signum huius est, quod pars Lunae lumine perfusa amplioris circumferentiae apparet, quam reliquum orbis tenebrosi: atque hanc eandem causam quispiam forte rationabilem existimabit, cur maiores Lunae maculae nulla ex parte ad extremum usque ambitum protendi conspiciantur, cum tamen opinabile sit nonnullas etiam circa illum reperiri; inconspicuas tamen esse credibile videtur ex eo, quod sub profundiori ac lucidiori vaporum copia abscondantur.
  - pair: f13r.2
    la:
    - seg: p020:0
    - seg: p021:0
