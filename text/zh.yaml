f05r.2: \zhwoodinitial{zai}这篇短小的论著中，我把一些伟大的事物呈献给每一位探究自然的人，供他们观看和思考。我说它们伟大，一是因为事物本身的卓越，二是因为它们亘古未闻的新奇，三是因为那件仪器：正是借助它，这些事物才呈现在我们的感官面前。
f05r.3: 在自古至今凭肉眼所能看见的众多恒星之外，再添上数不清的别的星，让它们清清楚楚地展现在人们眼前——这些星以前从未有人见过，数目超过原先熟知的旧星十倍以上——这当然是件大事。
f05r.4: 而最美妙、看来也最赏心悦目的，莫过于观看月球的形体：它离我们将近六十个地球半径，\footnote{初版作“六十个地球直径”（\textit{diametros}），Favaro 本校改为“半径”（\textit{semidiametros}），与月地实际距离相合；伽利略的手稿也作 \textit{diametros}，当是笔误。下文[6v]“两个地球直径”一处，初版与 Favaro 本都作 \textit{diametros}。}我们却能看得这样近，
f05v.1: \noindent 仿佛它只隔着两个这样的半径；于是，同一个月球，其直径看上去大了将近三十倍，表面积大了九百倍，体积大了约两万七千倍，胜过单凭肉眼观看之时。由此，任何人都能凭感官的确证认识到：月球表面绝不光滑平整，而是粗糙不平；它就像地球表面一样，处处布满巨大的隆起、深深的坑穴和曲折的沟壑。
f05v.2: 此外，平息了关于银河——亦即“乳白色的环带”——的争论，使它的本质不仅显露于理智，更显露于感官，这看来绝非小事。不仅如此，迄今每一位天文学家都称为“星云状星”的那些星，\footnote{指肉眼看去像一团模糊光斑的天体。伽利略用望远镜看出，其中许多是聚集在一起的小星（详见下文）。}我们要把它们的实质明白地指出来，并证明它与人们一向所相信的大不相同，这将是一件令人愉快、也极其美妙的事。
f05v.3: 然而，远远超出一切惊奇、并且首先促使我们向所有天文学家和哲学家发出通告的，是这样一件事：我们发现了四颗行星，在我们之前，无人知晓、也无人观察过它们。它们环绕着已知星中一颗显著的星，各有其周期，就像金星和水星环绕太阳那样；它们时而走在它前面，时而跟在它后面，但从不越出一定的界限离开它。这一切都是在几天之前，借助我在神恩的启迪下构想出来的望远镜发现和观察到的。
f05v.4: 或许今后借助类似的仪器，我或别人还会日复一日地发现别的、更为卓越的事物。关于这种仪器的形制和构造，以及我想到它的缘由，
f06r.1: \noindent 我先简要地谈一谈，然后再叙述我所做观测的经过。
f06r.2: \zhinitial[2]{\CJKfamily{zhsemi}大}约十个月前，有消息传到我们耳中，说某个尼德兰人制成了一种望远镜，借助它，可见的物体虽然离观看者的眼睛很远，也能看得清清楚楚，宛如近在眼前。关于这种确实令人惊叹的效果，还流传着若干试验的说法，有人相信，也有人不信。几天之后，一位法国贵族雅克·巴多维尔从巴黎写信给我，证实了这件事。\footnote{巴多维尔（Jacques Badovere，又作 Giacomo Badoer）据他本人一六〇七年写的证明，约一五九八年曾寄住在伽利略帕多瓦的家中，随他学习数学。Lutetia 是巴黎的拉丁古名。}这终于促使我全力以赴，去探究其中的原理，并设想种种办法，好让自己也能发明一种同样的仪器。不久以后，我凭借折射的理论做到了这一点。我先给自己做了一根铅管，在它两端装上两块玻璃镜片，两块都是一面平的，另一面则一块凸成球面，一块凹进。然后我把眼睛凑近凹的那块，看到的物体相当大，也相当近：它们比单凭肉眼看时近了三倍，大了九倍。\footnote{伽利略说的“近若干倍”指线度放大率，“大若干倍”指面积放大率：近三倍，面积便大九倍。下文的“大六十多倍”约合线度八倍，“大近一千倍”约合线度三十多倍。}后来我又为自己精心制作了一架更精确的，它呈现的物体要大六十多倍。最后，我不惜任何辛劳和花费，终于为自己造出了一架极其出色的仪器，用它看到的东西几乎大了一千倍，比单凭天然视力观看时近了三十多倍。这种仪器无论在陆上还是海上，有多少、多大的用处，完全无须一一列举。不过我撇开地上的事物，转而探究天上的景象。我首先观看月球，它看起来那样近，仿佛它离我们只有不到两个地球直径那么远。
f06v.1: \noindent 此后，我又怀着难以置信的欣喜，多次观察了恒星和行星。看到这些星多得惊人，我便开始设想一种能测量它们之间间隔的方法，最终找到了。凡是想从事此类观测的人，都应事先了解这一点。首先，必须为自己准备一架极其精良的望远镜，它要能把物体呈现得明亮、清晰、毫无朦胧，并且至少要放大四百倍，\footnote{这里的“倍数”同样指面积（见[6r]脚注）：放大四百倍，即线度放大二十倍。}因为那样它就能把物体拉近二十倍。仪器若达不到这个程度，那么我们在天上看到的、以及下文将要列举的一切，都将无从得见。为了不费力气就能确知仪器的放大倍数，可以用纸剪出两个圆或两个正方形，其中一个是另一个的四百倍大，也就是说，较大者的直径是另一个直径的二十倍。然后把两者一同钉在同一面墙上，从远处同时观看：一只眼睛凑在望远镜上看较小的那个，另一只眼睛不借助仪器看较大的那个。两眼同时睁开，这很容易同时做到。这时，如果仪器按所要求的比例放大了物体，两个图形看起来就会一样大。仪器既已备妥，接下来便要探求测量间距的方法。这可以借助如下手段做到。为便于理解，设镜筒为 ABCD，观察者的眼睛位于 E。若筒中未装镜片，光线将沿直线 ECF、EDG 射向物体 FG；
f07r.1: \noindent 装上镜片之后，光线则沿折射后的直线 ECH、EDI 行进。光线由此被收拢：原先畅通无阻地射向整个物体 FG 的光线，如今只能涵盖其中的 HI 一段。
f07r.2: |-
  \noindent 再求出距离 EH 与线段 HI 之比，借助正弦表即可算出物体 HI 在眼中所张之角的大小，我们会发现它仅有若干角分。倘若在镜片 CD 上配几片薄金属片，有的开较大的孔，有的开较小的孔，视需要时而覆上这一片，时而覆上那一片，便能随意得到张角各异、所含角分或多或少的视野。借助这一办法，彼此相距若干角分的星体之间的间隔，就能方便地测出，误差不超过一两角分。不过眼下，这样略略点到、浅尝辄止也就够了；这台仪器的完整理论，我们将另找机会公之于众。现在，让我们回顾最近两个月里所做的观测，并召唤一切渴慕真正哲学的人，来共同开启这些确实伟大的思考。

  首先，让我们谈谈月球朝向我们的那一面。
f07v.1: \noindent 为便于理解，我把它分为两部分：较亮的部分和较暗的部分。较亮的部分似乎环绕并铺满整个半球；较暗的部分则像一片云，沾染了月面，使之斑驳。这些暗斑颜色灰暗、面积颇大，人人都看得见，历代的人也都见过；因此我们称之为“大斑”或“古斑”，以区别于另一类斑点。后者面积较小，却分布得极为稠密，洒满整个月面，尤其是较亮的部分；在我们之前，从未有人观察到它们。经过一再反复的观察，我们得出如下结论，并确信无疑：月球表面并不像一大批哲学家对月球及其他天体所设想的那样，光滑平整、是极其精确的球面；恰恰相反，它高低不平、粗糙，布满洼坑与隆起，与地球表面并无二致，地球表面也处处因山脊与深谷而起伏分明。我们据以得出这些结论的现象如下。
f07v.2: 在合朔后的第四或第五天，月亮以明亮的弯角出现在我们面前时，分隔暗部与亮部的界线并不像在一个完美的球体上那样，沿一条椭圆线平滑延伸，而是一条不平整、粗糙且极为曲折的线，如附图所示。许多明亮的凸出部分越过明暗交界，伸进暗部；反过来，一些暗色的小块也侵入亮区。不仅如此，还有大量细小的黑斑，与黑暗部分完全隔开，几乎洒满已被阳光照亮的整个区域，唯有大斑、古斑所在的部分除外。
f08r.1: \noindent 我们还注意到，上述小斑无一例外都有这样一个共同点：它们暗的一侧总是朝向太阳所在的方向，而在背向太阳的一侧，则镶着较亮的边缘，宛如一圈被照得发亮的山脊。日出前后，我们在地球上看到的景象与此完全相同：山谷尚未被阳光照到，而对面、在背向太阳一侧环绕着山谷的群山，却已光芒闪耀。正如地面上洼地的阴影随着太阳升高而缩短，月面上的这些斑点也随着亮部的增长而失去黑暗。
f08v.1: 然而，月球上不仅明暗交界处显得参差曲折；更令人惊奇的是，在月球的暗部之内还出现了许多明亮的尖点，它们与受光区域完全分开、互不相连，而且离它有不小的距离。过了一段时间，它们的大小和亮度逐渐增加；两三个小时以后，便与此时已经扩大的其余亮部连成一片。与此同时，又有一个接一个的亮点仿佛萌芽一般，在暗部各处被点亮、增大，最后也与那片更加扩展了的明亮表面连接起来。同一幅图向我们展示了这方面的例子。在地球上，日出之前，平原还笼罩在阴影里的时候，最高的山峰之巅不就已被太阳的光线照亮了吗？不久之后，这些山中部较宽阔的部分也被照亮，光照不就扩大了吗？最后，太阳升起，平原和丘陵上的光照不就连成一片了吗？不过，月球上这类高地与洼地的差别，似乎在各方面都远远超过地面的崎岖，下文我们将加以证明。这里我也不想略而不提我在月亮趋近上弦时观察到的一件值得注意的事；上面同一幅图也画出了它的样子。有一个巨大的暗色凹湾伸入亮部，位置靠近下方的弯角。我对这个凹湾观察了很久，看到它通体黑暗；终于，大约两小时后，在凹陷中部稍下方，有一个明亮的峰顶开始冒出来。它逐渐增大，呈现出三角形，而且仍与明亮的月面完全隔开、互相分离。不久，在它周围又有三个小尖点开始发亮；
f09r.1: \noindent 直到月亮渐向西方沉落时，那个三角形已经伸展扩大，与其余的亮部连接起来，周围仍有前面提到的三个明亮峰顶簇拥着，像一座巨大的海岬一样突入暗湾之中。在上下两个弯角的尖端，也冒出一些明亮的光点，与其余亮部完全分离，正如同一幅图中所描绘的那样。两个弯角中都有大量暗斑，下方的弯角中尤其多；其中靠近明暗交界线的显得较大、较暗，离得较远的则不那么暗，颜色也较淡。不过，正如上文也提到过的，斑点暗的一侧总是朝向阳光照来的方向，而较亮的边缘则在背向太阳、朝向月球暗部的那一侧环绕着暗斑。月面上布满这样的斑点，宛如孔雀尾羽上的蓝色眼斑，使它看上去酷似那种玻璃小杯：玻璃杯趁热浸入冷水，表面便会碎裂成波纹状，因此俗称“冰杯”。\footnote{原文 glaciales cyathi，直译“冰杯”：把灼热的玻璃器浸入冷水，使表面布满冰裂纹，是十六世纪威尼斯玻璃工匠的一种工艺（冰裂玻璃）。}然而，月球上的大斑却看不到类似的断裂，也不见布满洼坑和隆起，而是较为平整、均匀，只在各处点缀着一些较亮的小块区域。因此，假如有人想复兴毕达哥拉斯学派的古老见解，认为月球仿佛是另一个地球，那么，说它较亮的部分代表陆地表面、较暗的部分代表水面，会更为贴切。而我从来没有怀疑过：从远处望去、沐浴在阳光中的地球，陆地表面会显得较亮，水面则显得较暗。
f09v.1: \noindent 此外，月球上的大斑看上去比较亮的区域要低。因为无论月亮渐盈还是渐亏，在明暗交界处，大斑周围总有较亮部分的边缘在各处凸出，正如我们在绘制这些图时所注意到的。而且，这些斑点的边缘不仅较低，也较为平整，没有被褶皱或崎岖所打断。较亮的部分则在紧挨斑点处最为高耸；以至于在上弦之前，以及差不多恰在下弦之时，在占据月球上方即北方区域的某个斑点周围，其上下两侧都有一些巨大的高地高高隆起，如附图所示。
f10r.1: 下弦之前，同一个斑点看上去被一些更黑的边缘所环绕。这些边缘就像极高的山脊，背向太阳的一侧显得较暗，朝向太阳的一侧则较亮。洼地的情形恰恰相反：背向太阳的一侧显得明亮，位于太阳那一侧的部分则黑暗而有阴影。随后，亮面缩小，当上述斑点刚刚几乎全被黑暗笼罩时，较亮的山脊便高高地探入黑暗之中。下面两幅图显示了这两种景象。
f11r.1: |-
  还有一件事我也绝不会忘记记下，我注意到它时颇感惊奇：差不多在月球正中的位置，有一个洼地，比其他所有洼地都大，形状是完美的圆形。我在上弦和下弦前后都看到了它，并在上面的第二组图中尽可能地把它描摹了出来。\footnote{“上面的第二组图”应指 [9v] 和 [10r] 的两幅月面图（第一组是 [8r] 的一幅）。两图分别画上弦前后和下弦前后的月亮，正合“在上下弦前后都看到”；这个大圆形洼地在两图中都位于明暗交界线旁。[10v] 下图中也能看到它。}就明暗而言，它的样子就像地球上一个类似波希米亚\footnote{波希米亚：今捷克西部，是一片四周为山脉所环绕的盆地。}的地区，假如四面八方都被排列成正圆的极高山脉所封闭，会呈现出的样子。因为在月球上，环绕它的山脊如此高耸，以致在明暗交界线到达这个圆形的中间直径之前，与月球暗部相邻的最外侧边缘就已经沐浴在阳光中了。与其他斑点一样，它有阴影的部分朝向太阳，明亮的部分则位于朝向月球暗部的一侧。我乐于第三次提请大家注意这一点，因为它是遍布月球整个较亮区域的崎岖与不平的最有力证据。在这些斑点之中，与明暗交界相邻的总是更黑；离得较远的则显得既较小，又不那么暗；以至于最后，当月亮与太阳相对、盈满整个圆面时，洼地的暗与高地的白之间只有极其细微的差别。

  以上我们所叙述的情况，都是在月球较亮的区域中观察到的。在大斑中，却看不到洼地与高地的那种差别；而在较亮的部分，我们不得不认定有这种差别，因为太阳光线从多种方位照向月球，随着照射方式一再改变，那里的形状也随之变化。不过，大斑中确实也有一些稍暗的小块区域，正如我们在图中所标示的；
f11v.1: |-
  \noindent 然而它们的样子始终不变，暗度既不加深，也不减弱；只是随着太阳光线照到它们身上时倾斜得多些或少些，它们有时显得稍暗一点，有时显得稍亮一点，差别极其细微。此外，它们与斑点中相邻的部分以一种柔和的过渡相连，边界彼此交融、混而难分。占据月球较亮表面的那些斑点则不然：它们就像陡峭的崖壁，布满嶙峋有棱角的岩石，阴影与亮光对比强烈，界线分明，如同用线划开。此外，在这些大斑之中还可以看到一些小块区域，有的较亮，有的甚至非常明亮。但无论是这些亮区，还是较暗的区域，样子始终相同，形状、亮度、暗度都毫无变化。由此可以确定无疑：它们之所以显现出来，是因为各部分本身确实不同，而不仅仅是因为同样一些部分的形状高低不平，使阴影随太阳照射的不同而以不同方式移动。后一种情形倒恰好适用于占据月球较亮部分的其他较小斑点：它们日复一日地变换、增大、缩小、消失，因为它们只是由高地的阴影所产生的。

  然而我感觉到，许多人在这里会产生很大的疑问，陷入严重的困难，以致不得不怀疑这个已经阐明、并为如此多现象所证实的结论。因为，如果月球表面那个更明亮地反射阳光的部分布满了曲折，也就是无数的隆起和洼坑，那么为什么在渐盈的月亮上朝向西方的外缘圆周，在渐亏的月亮上东侧的另一半圆周，以及在满月时整个圆周，看上去都不是参差、粗糙、曲折的，而是精确地浑圆，如同用圆规画出，没有被任何隆起或洼坑所侵蚀呢？
f12r.1: \noindent 这一点尤其令人困惑，因为整条边缘全都由月球较亮的物质构成，而我们说过，这种物质处处都是隆起和洼坑；大斑没有一个一直延伸到最外的边缘，它们全都聚集在远离圆周的地方。这个现象引起了如此严重的疑问；对此我提出两个原因，因而也就对这一疑问提出两种解答。第一，如果月球上的隆起和洼地只沿着唯一一个圆周，即界定我们所见半球的那个圆周排列，那么月亮的确可能、甚至必然会像一个齿轮那样呈现在我们面前，也就是说，它的轮廓会凹凸起伏、参差曲折。但是，如果高地并非只有一列、沿唯一一个圆周排列，而是有许许多多列山脉，连同其间的洼坑与曲折，环绕月球的最外缘层层排列，而且不仅分布在可见的半球上，也分布在背面的半球上（不过是在两个半球的分界附近），那么从远处眺望的眼睛就根本无法分辨出高地与洼地的差别。因为排列在同一圆周、即同一列中的山峦之间的空隙，会被其他各列中的高地挡住而隐藏起来；如果观看者的眼睛与上述高地的峰顶位于同一直线上，就更是如此。同样，在地球上，如果眺望者身在远方，又与群山处于同样的高度，那么众多连绵密集的山脉的山脊看上去就仿佛排列在一个平面上。同样，波涛汹涌的大海上，高耸的浪峰看上去也仿佛在同一个平面上延展，
f12v.1: \noindent 尽管浪涛之间的深涡与凹陷极多，而且深到不仅高大船只的龙骨，连船尾、桅杆和船帆都会隐没其间。因此，既然在月球本身上以及沿它的周缘，高地与洼地层层叠叠地排列，而从远处观看的眼睛又差不多与它们的峰顶位于同一平面上，那么，当视线贴着这些峰顶掠过时，它们呈现为一条平整、毫无曲折的线，就没有人应当感到奇怪了。在这一理由之外，还可以补充另一个理由：月球周围，正如地球周围一样，有一个球层，其物质比其余的以太更为浓密，能够接受并反射太阳的光照，但其不透明的程度又不足以阻挡视线通过（尤其是在它未被照亮的时候）。这个球层被阳光照亮时，便使月球本体显得像一个更大的球体；倘若它的厚度更深，就足以截住我们的视线，使之达不到月球的实体。而在月球周缘处，它的厚度确实更深——我说更深，并非就绝对而言，而是相对于斜穿过它的我们的视线而言。因此，它能够阻挡我们的视线，尤其是在它本身发亮的时候，能够遮住月球受阳光照射的周缘。这一点从附图中可以看得更清楚。图中，月球本体 ABC 被水汽球层 DEG 所环绕。
f13r.1: \noindent 眼睛从 F 望向月球的中间部分，例如 A 时，穿过的是较浅的水汽 DA；而望向最外缘时，较深的大量水汽 EB 便以其边界挡住了我们的视线。这一点的一个迹象是：月球受光的部分看上去比其余黑暗部分的圆周更大。或许有人还会认为，正是这同一个原因，可以合理地解释为什么月球上较大的斑点在任何一侧都看不到延伸到最外缘：虽然可以推想，在边缘附近也有一些大斑，但看来可以相信，它们之所以看不见，是因为隐藏在更深、更亮的大量水汽之下。
f13r.2: |-
  由以上阐明的种种现象，我认为已经足够清楚：月球较亮的表面处处布满了隆起和洼坑。剩下要谈的是它们的大小，并证明地球上的崎岖远比月球上的小——我说“小”，即使就绝对意义而言也是如此，而不仅仅是相对于各自球体的大小而言。这一点可以清楚地说明如下。

  我曾多次观察到，在月球与太阳处于各种不同相对位置时，月球暗部之内有一些峰顶被照亮，尽管它们离明暗交界线相当远。我把它们的距离与月球的整个直径相比较，发现这一间隔有时超过直径的二十分之一。以此为前提，设想一个月球，其大圆为 CAF，圆心为 E，直径为 CF；CF 与地球直径之比为二比七。又因为根据较精确的观测，地球直径为七千意大利里，\footnote{意大利里（miglio）：当时意大利各地长短不一，约合一点五至一点七千米。月球直径与地球直径之比，按现代数值约为三比十一，伽利略取的二比七与之相当接近。}所以 CF 为两千里，
f13v.1: \noindent CE 为一千里；而整个 CF 的二十分之一为一百里。现在设 CF 为把月球亮部与暗部分开的大圆的直径（因为太阳离月球极远，这个圆与大圆的差别觉察不出来），设 A 离点 C 的距离为该直径的二十分之一；作半径 EA，将它延长，与代表照射光线的切线 GCD 相交于点 D。
f13v.2: \noindent 于是，以 CE 为一千计，弧 CA 或直线 CD 为一百；DC 与 CE 的平方和为一百零一万，DE 的平方与之相等。因此，整个 ED 将大于一千零四，AD 则大于四（仍以 CE 为一千计）。\footnote{即由勾股定理，$\mathrm{DE}=\sqrt{1000^2+100^2}\approx 1004.99$，故 $\mathrm{AD}=\mathrm{DE}-\mathrm{EA}\approx 4.99$，伽利略只取其下限“大于四”。}所以，月球上的高度 AD——它标示着某个高耸直达太阳光线 GCD、并与明暗交界处 C 相距 CD 的峰顶——超过四意大利里。
f14r.1: \noindent 然而地球上没有哪一座山的垂直高度能接近一意大利里。所以显而易见，月球上的高地比地球上的山更高。
f14r.2: 我想借此机会，为月球上另一种值得惊叹的现象说明原因。这一现象并不是我们新近才看到的，早在多年以前就已观察到，并曾向几位亲近的朋友和学生展示、讲解，从成因上加以阐明；不过，借助望远镜观察它变得更容易，也更明显，所以我认为把它放在这里并无不妥，尤其是因为这样能更清楚地显出月球与地球之间的亲缘和相似。
f14r.3: 当月亮在合朔之前或之后离太阳不远时，呈现在我们眼前的，不只是它饰有明亮弯角的那一部分球体；还有一圈纤细而微亮的边缘，似乎描出了暗部（即背向太阳的部分）的轮廓，把它同天宇较暗的背景分隔开来。\footnote{这里讲的是“地照”（又称灰光）：新月前后，月面上未被阳光直接照到的部分仍隐约可见。伽利略在下文论证它来自地球反射的阳光。}但如果我们更仔细地察看，就会发现：不仅暗部的最外缘闪着一种朦胧的光，整个月面，也就是尚未感受到太阳光辉的那一面，都泛着一层白光，而且并不微弱。只是乍看之下，似乎只有一道细细的边缘在发亮，因为与它相邻的天空较暗；其余的表面反而显得更暗，因为明亮的弯角紧挨着它，晃得我们目力昏花。然而，如果有人选择这样一个位置，让屋顶、烟囱或别的什么障碍物（位于视线与月亮之间，但离眼睛很远）恰好把发亮的弯角本身遮住，
f14v.1: \noindent 而让月球其余的部分仍留在视野之中，那么他就会发现，月球的这一区域虽然得不到阳光，也闪耀着不弱的光；在太阳离去、夜色已浓的时候尤其如此，因为同样的光在较暗的背景上显得更亮。此外，人们还确知，月亮的这种第二光辉（姑且这样称呼）离太阳越近就越强：随着它与太阳的距角增大，这光辉便越来越弱，以至于在第一次方照之后、第二次方照之前，即使在较暗的天空中观看，它也显得微弱而模糊；而在六分方位及更小的距角上，即使是在暮色之中，它也亮得出奇——我是说，亮到借助一架精良的望远镜就能在上面分辨出大斑。\footnote{方照（quadratura）指月亮与太阳相距九十度，即上弦和下弦；六分方位（sextilis）指二者相距六十度。}这奇妙的光辉曾令研究哲学的人大为惊讶，为了说明它的成因，各人提出了不同的说法。有人说，这是月球本身固有的、天然的光；有人说，是金星赋予它的；有人说，是所有星辰赋予的；还有人说，是太阳赋予的，太阳的光线穿透了月球深厚的实体。然而这些说法不费什么力气就能驳倒，证明为假。因为，倘若这种光是月球自身的，或是群星所赋予的，那么在月食时，月球处于极暗的天空中，它就最应当保持并显示出这种光；可是这与经验相悖：月食时月面上出现的光要弱得多，略带红色，近乎铜色，而这种光却更亮、更白。况且月食时的那种光是可变的，位置也会移动：它在月面上游移，总是靠近地影圆周的那一部分较亮，其余部分较暗。由此我们毫无疑问地认识到，这是因为太阳光线贴近并触及环绕月球的某个较稠密的区域。
f15r.1: \noindent 由于这种接触，某种曙光便洒向月球邻近的区域，正如在地球上，早晚都有晨昏的微光洒下一样。关于这一点，我们将在《论宇宙体系》一书中更详尽地讨论。\footnote{伽利略预告的这部著作始终没有以此名出版；关于地球反照月球的论述，后来见于他一六三二年的《关于托勒密和哥白尼两大世界体系的对话》。}至于说这种光是金星赋予的，那就幼稚得不值一驳了。谁会无知到不明白：在合朔前后、在六分方位以内，月球背向太阳的那一部分根本不可能被金星看到？说这光来自太阳，是太阳用它的光穿透并浸透了月球深厚的实体，同样不可思议。因为那样的话，这光就永远不会减弱：除了月食的时候，月球总有一个半球被太阳照亮；然而，月亮趋近方照时，这光却在减弱，过了方照以后，更是完全黯淡下去。既然这种次生的光辉既不是月球天生固有的，也不是从任何星辰或太阳那里借来的，而在广大的宇宙中，剩下的天体只有地球，那么请问，该作何设想？该作何论断？莫非月球本身，或者别的什么不透明的暗物体，是被地球照亮的？这有什么奇怪呢？正是如此：地球以公平而可喜的交换，回报给月球同样的照明，正如它自己在深夜的黑暗中几乎一直从月球那里得到照明一样。让我们把这件事讲得更清楚些。合朔时，月球位于太阳和地球之间，它背向地球的上半球沐浴在阳光里，朝向地球的下半球则笼罩在黑暗中，因此丝毫照不亮地面。月球渐渐离开太阳，它朝向我们的下半球便有一部分被照亮，于是把发白的弯角（虽然还很细）转向我们，微微照亮地球。月亮渐近方照时，月面所受的太阳照明不断增长；
f15v.1: \noindent 地面上这种光的反射也随之增强；月面上的光亮继续扩展，超过了半圆，我们的夜晚也更加明亮。最后，月球朝向地球的整个面庞，被对面的太阳以最灿烂的光辉照耀，地面也处处沐浴在月光之中，一片光明。此后，渐亏的月亮射向我们的光线越来越弱，地球受到的照明也越来越弱；月亮趋近合朔，漆黑的夜便笼罩大地。就这样，月光以这样的周期交替，每月给我们时而较明、时而较暗的照明；而地球则以对等的恩惠作为回报。因为当月亮在合朔前后位于太阳之下时，它所面对的，是地球上朝向太阳、被强烈的光线照亮的那个半球的整个表面，并接受从那里反射来的光；因此，借助这种反射，月球的下半球虽然得不到阳光，看上去却相当明亮。同一个月亮，在离太阳一个象限时，只能看到地球受照半球的一半，即西边的一半，因为东边的另一半已被黑夜笼罩；于是月球本身受地球照射也就不那么明亮，它那次生的光在我们看来也就较为微弱。如果让月亮处在与太阳相冲的位置，它所面对的，将是居于二者之间的地球那完全黑暗、沉浸在夜色中的半球；因此，如果这次相冲恰好造成月食，月球就既得不到太阳的照射，也得不到地球的照射，完全接受不到任何照明。在它与地球和太阳的其他各种相对位置上，它从地球反射得到的光有多有少，取决于它所面对的地球受照半球部分是大是小。因为这两个天体之间始终保持着这样的规律：地球被月球照得最亮的时候，正是月球反过来被地球照得最弱的时候，反之亦然。
f16r.1: \noindent 关于这个问题，此处就说这么几句吧，更详尽的论述留待我们的《宇宙体系》。在那里，我们将用许多论证和实验，向那些叫嚷着要把地球逐出群星之舞的人表明：地球对太阳光的反射极为强烈。他们这样主张，主要是因为地球既无运动，也无光亮。我们将证明，并用无数自然的理由来确证：地球是一颗游星，它的光辉胜过月亮，而不是宇宙间污秽与渣滓汇聚的阴沟。
f16r.2: 以上，我们讲述了对月球所做的观测；现在，让我们简要介绍迄今为止我们在恒星方面所见到的情况。首先值得注意的是：用望远镜观看时，无论恒星还是行星，其大小都远不是按照其他物体乃至月球本身增大的同一比例而增大的；星体的这种增大要小得多。所以，一架能把其他物体放大（比方说）一百倍的望远镜，你会觉得它几乎只能把星放大四五倍。其原因在于：用不借助仪器的天然目力观看时，星体并不是以它们单纯的、可以说是赤裸的大小呈现在我们面前，而是被某种光芒所环绕，披着闪烁的光线，犹如披着头发，夜色已深时尤其如此；因此它们看上去比去掉这些外加的“头发”时要大得多，因为视角并不是由星体本身那小小的主体，而是由四周弥漫开来的光辉所界定的。从下面这件事，你可以看得再清楚不过：
f16v.1: \noindent 日落时，在初起的暮色中露面的星，即使是一等星，也显得非常小；金星本身如果在正午前后出现在我们眼前，看上去也极其微小，几乎还比不上一颗最低星等的小星。其他物体，包括月球本身，情形就不同了：无论在正午的日光下还是在深沉的黑暗中观看，月亮看上去总是一样大。可见，星体在深沉的黑暗中是披着“长发”被看到的，而白昼的光能把这些“头发”剃去；不仅日光能做到，就连夹在星体与观者眼睛之间的一片薄云也能做到；黑色的纱幕和有色的玻璃也有同样的效果，只要用它们遮挡、隔在中间，星体四周弥漫的光芒就会离它而去。望远镜同样能起到这个作用：它先除去星体外加的、偶然的光芒，然后再放大它们单纯的小球体（如果它们确实是球形的话），因此星体看上去被放大的倍数较小。一颗五等或六等的小星，通过望远镜看去，就像一颗一等星。
f16v.2: 行星和恒星在外观上的区别，似乎也值得一提。行星呈现出的小球体正圆而轮廓分明，像一个个通体被照亮的小月亮，看上去是圆的；恒星却完全看不到圆形的边界，而像是一团团向四周放射光芒、剧烈闪烁的光辉。用望远镜观看时，恒星的形状与肉眼所见相同，只是大得多，以至于一颗五等或六等的小星，看起来竟与“犬星”——所有恒星中最大的一颗——不相上下。\footnote{“犬星”（Canis）即天狼星（大犬座 α），全天最亮的恒星。}
f16ar.1: \noindent 而在六等星以下，你还能通过望远镜看到一大群别的星，都是肉眼看不见的，数目之多简直令人难以置信：你可以分辨出另外六个以上的星等。其中较大的那些，我们可以称为七等星，或者“不可见星中的一等星”；借助望远镜看去，它们比肉眼所见的二等星还要大、还要亮。为了让你对它们几乎难以想象的稠密程度有一两个见证，我决定附上两个星群的图，好让你以它们为例来推断其余。在第一幅中，我本来打算画出整个猎户座；但星的数量庞大，时间却很紧迫，我不堪重负，只好把这项工作推迟到以后的机会。因为在那些原有的星周围，在一两度的范围之内，散布着五百多颗星。因此，在早已记录在案的腰带上的三颗星和佩剑上的六颗星之外，我们添上了它们近旁新近看到的八十颗星，并尽可能精确地保持了它们之间的间距。为便于区分，那些已知的或者说古已有之的星，我们画得较大，并用双线勾出轮廓；其他不显眼的星则画得较小，只用单线标出。星与星之间的大小差别，我们也尽可能地保留了。在第二个例子中，我们画出了金牛座中称为\zhemph{昴星团}的六颗星（我说六颗，是因为第七颗几乎从来看不见），它们挤在天空中一块极为狭小的范围之内；在它们近旁另有四十多颗看不见的星，其中没有一颗与上述六颗中最近的一颗相距超过半度左右。这些星我们只标出了三十六颗，并像在猎户座中那样，保留了它们的间距、大小以及新旧星的区别。
