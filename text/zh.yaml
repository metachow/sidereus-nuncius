  % line by line as the Latin: the two capital lines in SemiBold Song, the rest in Kai
  \zhital{载述并阐明}\\[1pt]
  \zhdisp[12]{新近所做的观测}\\[1pt]
  \zhital{这些观测借助新望远镜，对象是月面、银河与星云状星、无数恒星，以及迄今从未有人见过、被命名为}\\[1pt]
  \zhdisp[12]{美第奇星}\\[1pt]
