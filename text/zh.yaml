  {\centering \zhemph{猎户座}腰带与佩剑星群\par}
f16br.1: '{\centering \zhemph{昴星团}\par}'
f16br.2: 我们观察到的第三件事，是\zhemph{银河}本身的本质，或者说它的物质。借助望远镜，人们能如此真切地看清它，以至于许多世纪以来折磨着哲学家们的一切争论，都凭亲眼所见的确凿证据得到了裁决，我们也从冗长的口舌之争中解脱出来。原来\zhemph{银河}不是别的，正是无数星辰成团密布而形成的集合：无论把望远镜对准它的哪一个区域，立刻就有一大群星映入眼帘，其中许多相当大，十分显眼；而那些小星的数目，则完全无从探究。
f16br.3: 再者，不仅在\zhemph{银河}中可以看到那种乳白色的光辉，像一片发白的云；天空中还零星散布着许多颜色与之相似的小片区域，发出微光。如果把望远镜转向其中任何一片，你都会碰到一群密集的星。
f16bv.1: |-
  \noindent 更有甚者（这会更让你惊奇），迄今为止被每一位天文学家称为\zhemph{星云状}的那些星，\footnote{托勒密以来的星表把肉眼看去呈模糊光斑的几个天体记作“星云状星”（stellae nebulosae）。}其实是一群群以奇妙方式密集分布的小星。其中每一颗都因为太小，或者说离我们极其遥远，而逃过了我们的目力，但它们的光线交融在一起，便产生了那种白光；这种白光以前一直被当作天空中较稠密的部分，能够反射星光或阳光。我们观察了其中几处，想附上其中两处的星群图。

  在第一幅中，你看到的是称为猎户头部\zhemph{星云}的那一团，我们在其中数出了二十一颗星。\footnote{伽利略所说的“猎户头部星云”是猎户座头部 λ 星（觜宿一）一带的星群，即今天的疏散星团 Collinder~69，并非今天所说的猎户座大星云（M42）。}

  第二幅包含称为\zhemph{鬼星团}（蜂巢星团）的那团\zhemph{星云}。它并不只是一颗星，而是四十多颗小星的集合：除了两颗“驴星”之外，\footnote{鬼星团即疏散星团 M44。“驴星”（Aselli）指它近旁的巨蟹座 γ、δ 两星，中国古称鬼宿三、鬼宿四。}我们标出了三十六颗，排列如下。
f17r.1: 关于月球、恒星和银河，迄今观察到的情况，我们已简要叙述过了。剩下的，也是本书中看来最为重要的事，就是揭示并公布四颗\zhemph{行星}：自开天辟地直到今天，从未有人见过它们。我们要讲述发现和观察它们的经过、它们的位置，以及最近两个月里对它们的运动与变化所做的观测；并召集所有天文学家，致力于探求和确定它们的周期，因为时间紧迫，这一点我们至今未能做到。不过我们要再次提醒他们：若不想徒劳无功，从事这样的观测就需要一架极其精良的望远镜，即本文开头所描述的那种。
f17r.2: 于是，在本年即一六一〇年的一月七日，当晚入夜后的第一个小时，\footnote{伽利略用的是当时意大利通行的计时法：一天从日落时起算，“入夜后第一个小时”即日落后的第一个小时。一六一〇年一月初的帕多瓦，日落约在下午五时前后。}我正用望远镜观看天上的星辰，木星进入了视野。由于这时我已为自己造好一架相当出色的仪器（此前因另一架仪器性能太弱，一直未能见到），我发现木星旁边有三颗小星，虽然很小，却十分明亮。我起初以为它们属于恒星之列，但它们仍引起了我几分惊奇，因为它们看上去排列在一条精确的直线上，与黄道平行，而且比其他同等大小的星更为明亮。它们彼此之间以及与木星的相对位置如下：
f17v.1: \noindent 即东侧有两颗星，西侧有一颗。最东边的那颗和西边的那颗看起来比余下的一颗略大。我当时丝毫不关心它们与木星之间的距离，因为正如前面所说，我以为它们是恒星。然而到了一月八日，不知受什么命运指引，我再次进行同样的观察，却发现了截然不同的布局：三颗小星全都在木星西侧，彼此之间以及与木星之间都比前一晚更近，相互间隔相等，如附图所示。
f17v.2: |-
  \noindent 此时，我虽然丝毫没有想到这些星彼此会相互靠近，却开始感到困惑：前一天木星还位于其中两颗星的西边，如今怎么会跑到上述所有恒星的东边去呢？我因此担心，木星也许与天文推算相反，正在顺行，\footnote{按当时的星表推算，木星此时正处于逆行阶段，即在恒星背景上自东向西移动。若木星反常地顺行（自西向东），它就会显得“超到”那几颗星的东边。}从而凭自身的运动超到了那几颗星的前面。于是我怀着极大的期待等候下一个夜晚，然而希望落空了：天空四处为云层所遮蔽。

  到了一月十日，这些星相对于木星的位置是这样的：
f17v.3: \noindent 只有两颗，而且都在东侧；我推测第三颗藏在了木星后面。它们和先前一样，与木星位于同一条直线上，恰好沿黄道经度的方向排列。看到这一情形，我明白此类变化绝不能归之于木星；而且我确知所见的始终是同样这几颗星（因为沿黄道经度方向很大的范围内，前后都没有其他星）。于是我的疑惑转为惊奇，并认识到表观上的变化不在木星，而在我注意到的这几颗星本身。因此我认为，此后必须更加细心、更加严谨地观察。
f18r.1: 于是在一月十一日，我看到了这样的布局：
f18r.2: |-
  \noindent 即只有两颗星，都在东侧；中间那颗与木星的距离，是它与最东那颗之间距离的三倍；最东那颗几乎比另一颗大一倍，尽管前一晚两者看起来大小几乎相同。因此我确定，并毫无疑问地断定：天上有三颗星在环绕木星游行，正如金星和水星环绕太阳一样。后来经过多次观察，这一点终于变得比正午的阳光还要明白；而且环绕木星运行的游星不是三颗，而是四颗。它们的位置变化，此后观察得更为精确，将在下文叙述。我还借助望远镜，用前面说明的方法测量了它们之间的间距；此外，我也记下了观测的时刻，尤其是同一夜多次观测的时候。因为这些行星的公转极为迅速，往往连逐小时的差异也能察觉。

  于是在一月十二日，当晚入夜后的第一个小时，我看到这些星的排列如下：
f18v.1: |-
  \noindent 东边那颗星比西边那颗大，不过两颗都十分醒目而明亮；两者与木星的距离都是两角分。到第三个小时，又开始出现第三颗小星，此前完全没有看到；它在东侧几乎贴着木星，而且非常小。所有这些星都位于同一条直线上，沿黄道经度方向排列。

  一月十三日，我第一次看到了四颗小星，它们与木星的相对位置如下：
f18v.2: |-
  \noindent 西侧三颗，东侧一颗。它们排成的线近乎笔直，因为西侧三颗中居中的那颗稍稍偏离直线，偏向北方。最东边那颗距木星两角分；其余各星彼此之间以及与木星之间的间隔，每段都只有一角分。这些星看上去大小相同，虽然都很小，却极为明亮，远比同等大小的恒星耀眼。

  一月十四日，天空阴云密布。

  一月十五日，入夜后第三个小时，四颗星与木星的相对位置如下图所示：
f18v.3: \noindent 全都在西侧，几乎排在同一条直线上，因为从木星数起的第三颗略微向北抬起。
f19r.1: \noindent 离木星最近的那颗是所有星中最小的，其余几颗依次越来越大。木星与随后三颗星依次之间的间隔全都相等，都是两角分；而最西边那颗与它相邻的那颗相距四角分。它们非常明亮，毫不闪烁；无论此前还是此后，它们看起来一直是这样。然而到了第七个小时，只剩下三颗星，与木星的相对位置如下：
f19r.2: |-
  \noindent 它们恰好位于同一条直线上。离木星较近的那颗非常小，距木星三角分；第二颗距它一角分；第三颗距第二颗四角分三十角秒。又过了一个小时，中间两颗小星靠得更近了，相距不过三十角秒。

  一月十六日，入夜后第一个小时，我们看到三颗星，排列次序如下：
f19r.3: |-
  \noindent 其中两颗把木星夹在中间，一东一西，各距木星四十角秒；第三颗在西侧，距木星八角分。靠近木星的两颗看起来并不比远处那颗大，但更明亮。

  一月十七日，日落后零时三十分，布局如下：
f19r.4: \noindent 东侧只有一颗星，
f19v.1: \noindent 距木星三角分；西侧同样只有一颗，距木星十一角分。东边那颗看起来比西边那颗大一倍；除这两颗外再没有别的星。然而过了四个小时，也就是将近第五个小时，东侧开始冒出第三颗星；我认为它此前是与先前那颗合在一起的。其位置如下：
f19v.2: |-
  \noindent 中间那颗星离东边那颗极近，与它只相距二十角秒，并且稍稍向南偏离了穿过两端的星和木星的那条直线。

  一月十八日，日落后零时二十分，景象如下：
f19v.3: |-
  \noindent 东边那颗星比西边那颗大，距木星八角分；西边那颗距木星十角分。

  一月十九日，入夜后第二个小时，星的排列如下：
f19v.4: \noindent 即三颗星与木星恰好排在一条直线上：东侧一颗，距木星六角分；木星与西侧第一颗之间相隔五角分；这一颗又与更西边那颗相距四角分。当时我拿不准，东边那颗星与木星之间是否还夹着一颗小星，它离木星极近，几乎碰到了木星。但到第五个小时，我清楚地看到它
f20r.1: \noindent 已经精确地占据了木星与东边那颗星正中间的位置，于是构形如下：
f20r.2: |-
  \noindent 此外，这颗最后看到的星非常小；然而到第六个小时，它的大小已与其余几颗几乎相等。

  一月二十日，一时十五分，看到的布局与此相似：
f20r.3: \noindent 有三颗小星，小得几乎难以察觉；它们与木星之间以及彼此之间的距离都不超过一角分。我无法确定西侧的小星是两颗还是三颗。到第六个小时前后，它们的排列如下：
f20r.4: \noindent 即东边那颗与木星的距离比先前大了一倍，达到两角分；西侧居中的那颗距木星四十角秒，距更西边那颗二十角秒。最后，到第七个小时，西侧出现了三颗小星：
f20r.5: \noindent 离木星最近的那颗距木星二十角秒，它与最西边那颗之间相隔四十角秒；在这两颗之间还能看到另一颗，略微向南偏离，
f20v.1: |-
  \noindent 与最西边那颗相距不超过十角秒。

  一月二十一日，零时三十分，东侧有三颗小星，彼此之间以及与木星之间的距离都相等：
f20v.2: |-
  \noindent 据估计，这些间隔都是五十角秒。西侧也有一颗星，距木星四角分。东侧离木星最近的那颗是所有星中最小的，其余几颗则稍大一些，彼此大小也相近。

  一月二十二日，二时，星的分布与此相似：
f20v.3: \noindent 从东边那颗星到木星的间隔是五角分，从木星到最西边那颗是七角分。西侧夹在中间的两颗彼此相距四十角秒，其中离木星较近的那颗距木星一角分。中间这两颗小星比两端的星小。它们沿黄道经度方向排在同一条直线上，只是西侧三颗星中居中的那颗略微向南偏离。而到了入夜后第六个小时，看到的布局是这样的：
f20v.4: \noindent 东边那颗非常小，与木星的距离和先前一样，是五角分。西侧三颗星与木星之间以及彼此之间的间隔都相等，每段大约一角分二十角秒；
f21r.1: |-
  \noindent 离木星较近的那颗看起来比后面两颗小；所有星看上去都精确地排在同一条直线上。

  一月二十三日，日落后零时四十分，星的布局大致如下：
f21r.2: \noindent 三颗星与木星沿黄道经度方向排在一条直线上，正如它们一贯的那样：东侧两颗，西侧一颗。最东边那颗距下一颗七角分，这颗距木星两角分四十角秒，木星距西边那颗三角分二十角秒；它们的大小几乎都相同。但到第五个小时，先前离木星最近的两颗已经看不见了，我认为是藏到了木星后面。当时的景象如下：
f21r.3: 一月二十四日，看到三颗星，全都在东侧，并且与木星几乎在同一条直线上：
f21r.4: \noindent 因为中间那颗稍稍向南偏离。离木星较近的那颗距木星两角分，下一颗距它三十角秒，最东边那颗又距这颗九角分；它们全都非常明亮。而到第六个小时，只看到两颗星，位置如下：\footnote{按下文，此时有两颗星：近的一颗距木星三角分，另一颗再远八角分。初版图中却只印了一颗星，与文字不符。本版照初版排图。}
f21v.1: |-
  \noindent 即它们与木星恰好在同一条直线上，较近的那颗距木星三角分，另一颗距这颗八角分。如果我没有弄错，先前看到的中间两颗小星已经合而为一了。

  一月二十五日，一时四十分，布局是这样的：
f21v.2: |-
  \noindent 只有两颗星，在东侧，而且相当大：最东边那颗距中间那颗五角分，中间那颗距木星六角分。

  一月二十六日，零时四十分，星的排列是这样的：
f21v.3: \noindent 可以看到三颗星，其中两颗在东侧，第三颗在木星西侧：这颗距木星五角分，东侧中间那颗距木星五角分二十角秒，最东边那颗距中间那颗六角分；它们在同一条直线上，大小也相同。随后在第五个小时，布局几乎没变，只有一点不同：在木星附近的东侧冒出了第四颗小星，比其余几颗小，当时距木星三十角分，\footnote{原文如此（min.\ 30）。从插图看，这颗星紧挨着木星，应为三十角秒。}但稍稍偏离那条直线，向北抬起，如附图所示：
f21v.4: 一月二十七日，日落后一时，只看到一颗小星，
f22r.1: \noindent 位于东侧，布局如下：
f22r.2: |-
  \noindent 它非常小，距木星七角分。

  一月二十八日和二十九日，因为云层遮挡，什么也没能观测到。

  一月三十日，入夜后第一个小时，看到这些星的排列如下：
f22r.3: |-
  \noindent 东侧一颗，距木星两角分三十角秒；西侧两颗，其中离木星较近的那颗距木星三角分，另一颗距它一角分。两端的星与木星位于同一条直线上，但中间那颗星稍稍向北抬起。最西边那颗比其余的小。

  一月的最后一天，第二个小时，看到东侧有两颗星，西侧有一颗：
f22r.4: \noindent 东侧两颗中居中的那颗距木星两角分二十角秒，最东边那颗距这颗三十角秒；西边那颗距木星十角分。它们大致在同一条直线上，只有离木星较近的那颗东侧星稍稍向北偏高。而到了第四个小时，东侧两颗星彼此更靠近了：
f22v.1: |-
  \noindent 它们相距只有二十角秒。在这几次观测中，西边那颗星显得相当小。

  二月一日，入夜后第二个小时，布局与此相似：
f22v.2: |-
  \noindent 最东边那颗星距木星六角分，西边那颗距木星八角分；在东侧还有一颗非常小的星，距木星二十角秒。它们恰好排成一条直线。

  二月二日，看到这些星按如下次序排列：
f22v.3: \noindent 东侧只有一颗，距木星六角分；木星距西侧较近的那颗四角分；这颗与更西边那颗之间相隔八角分。它们恰好在同一条直线上，大小也几乎相同。但到第七个小时，出现了四颗星：
f22v.4: |-
  \noindent 木星位于它们中间。这些星中最东边那颗距下一颗四角分，这颗距木星一角分四十角秒；木星距西侧离它较近的那颗六角分，这颗又距更西边那颗八角分。它们同样全都沿黄道经度方向排在同一条直线上。

  二月三日，第七个小时，这些星排成如下的序列：东边那颗距木星一角分三十角秒，
f23r.1: |-
  \noindent 西侧最近的那颗距木星两角分，更西边的另一颗又距这颗十角分。它们严格地位于同一条直线上，大小也相等。

  二月四日，第二个小时，木星周围有四颗星，东侧两颗，西侧两颗，恰好排在同一条直线上，如下图所示：
f23r.2: \noindent 最东边那颗距下一颗三角分，这颗距木星四十角秒；木星距西侧最近的那颗四角分，这颗距更西边那颗六角分。它们大小几乎相同，只是离木星最近的那颗看起来比其余的略小一些。而到了第七个小时，东侧两颗星彼此只相距三十角秒。
f23r.3: |-
  \noindent 木星距东侧较近的那颗两角分，距西侧随后那颗四角分，这颗又距更西边那颗三角分。它们大小全都相同，并且沿黄道排在同一条直线上。

  二月五日，天空多云。

  二月六日，只出现了两颗星，把木星夹在中间，如附图所示：
f23v.1: |-
  \noindent 东边那颗距木星两角分，西边那颗距木星三角分；它们与木星在同一条直线上，大小相等。

  二月七日，有两颗星伴在木星旁边，都在东侧，排列如下：
f23v.2: |-
  \noindent 它们彼此之间以及与木星之间的间隔相等，都是一角分；并且有一条直线穿过它们和木星的中心。

  二月八日，第一个小时，有三颗星，全都在东侧，如图所示：
f23v.3: |-
  \noindent 离木星最近的那颗相当小，距木星一角分二十角秒；中间那颗距这颗四角分，相当大；最东边那颗非常小，距中间那颗二十角秒。我拿不准离木星最近的是一颗还是两颗小星，因为有时它东边似乎还有另一颗，小得出奇，与它只相隔十角秒。所有这些星都沿黄道带的走向排在同一条直线上。而到第三个小时，离木星最近的那颗几乎碰到了木星，因为它距木星只有十角秒；其余几颗则离木星更远了，中间那颗此时距木星六角分。最后，到第四个小时，先前离木星最近的那颗已与木星合在一起，再也看不见了。

  二月九日，零时三十分，木星旁有两颗星在东侧，一颗在西侧，排列如下：
f24r.1: '% 本页开头半句所属的二月九日一句，按规范整句译在 f23v'
f24r.2: \noindent 最东的那颗相当小，与下一颗相距四角分；中间那颗较大，距木星七角分；木星与西侧那颗小星相距四角分。
f24r.3: 二月十日，一时三十分，看到两颗极小的星，都在东侧，排列如下：
f24r.4: \noindent 较远的一颗距木星十角分，较近的一颗距木星二十角秒；两者位于同一直线上。到了第四个小时，离木星最近的那颗已经看不见了；另一颗也变得十分微小，几乎难以辨认，尽管当时空气非常清朗；它离木星也比先前远了，距离达十二角分。
f24r.5: 二月十一日，第一个小时，东侧有两颗星，西侧有一颗。
f24r.6: \noindent 西侧那颗距木星四角分；东侧较近的那颗距木星同样是四角分；更东的那颗与它相距八角分。这几颗星都相当清晰，位于同一直线上。但到了第三个小时，在东侧紧靠木星处看到了第四颗星，比其余几颗都小；
f24v.1: \noindent 它距木星三十角秒，并且稍向北偏离穿过其余各星所引的直线。所有的星都极为明亮，十分显眼。到了五时半，东侧离木星最近的那颗已离木星远了一些，正处在木星与它近旁那颗更东的星之间的中点；所有的星都精确地位于同一直线上，大小也相同，如附图所示。
f24v.2: 二月十二日，零时四十分，东侧有两颗星，西侧也有两颗。
f24v.3: |-
  \noindent 东侧较远的那颗距木星十角分，西侧较远的那颗距木星八角分，这两颗都相当显眼；另外两颗离木星非常近，而且极小，尤其是东侧那颗，它距木星四十角秒；西侧那颗则距木星一角分。到了第四个小时，东侧离木星最近的那颗小星已经看不见了。

  二月十三日，零时三十分，东侧出现两颗星，西侧也有两颗。
f24v.4: \noindent 东侧离木星较近的那颗相当清晰，距木星两角分；比它更东的那颗不太显眼，与它相距四角分。西侧的两颗中，离木星较远的那颗非常显眼，与木星相距四角分；
f25r.1: \noindent 在它与木星之间有一颗小星，离西边那颗较近，与它相距不超过三十角秒。所有的星都精确地沿黄道经度方向位于同一直线上。
f25r.2: 二月十五日（十四日天空被云遮蔽），第一个小时，诸星的位置如下：
f25r.3: \noindent 东侧有三颗星，西侧则一颗也看不到。东侧离木星最近的那颗距木星五十角秒；下一颗与它相距二十角秒；最东的那颗又与下一颗相距两角分，它比其余两颗大，因为靠近木星的两颗都极小。但到了将近第五个小时，靠近木星的两颗之中只能看到一颗，距木星三十角秒；最东那颗与木星的距离则增大了，此时达到四角分。
f25r.4: \noindent 到了第六个小时，除了刚才所说的东侧两颗之外，西侧还能看到一颗极小的星，距木星两角分。
f25r.5: 二月十六日，第六个小时，诸星的布局如下：东侧那颗距木星七角分；
f25v.1: \noindent 木星与西侧紧邻的那颗相距五角分，这一颗又与更西的另一颗相距三角分。所有的星大小几乎相同，都相当显眼，并且极为精确地沿黄道带的走向位于同一直线上。
f25v.2: 二月十七日，一时，有两颗星：
f25v.3: \noindent 一颗在东侧，距木星三角分；另一颗在西侧，距木星十角分。西侧这颗比东侧那颗略小一些。但到了六时，东侧那颗离木星更近了，相距五十角秒；西侧那颗则更远了，相距十二角分。两次观测中，它们都位于同一直线上，而且两颗都相当小，第二次观测时东侧那颗尤其如此。
f25v.4: 二月十八日，一时，有三颗星，两颗在西侧，一颗在东侧：
f25v.5: \noindent 东侧那颗距木星三角分，西侧最近的那颗距木星两角分，余下更西的那颗与中间那颗相距八角分。所有的星都精确地位于同一直线上，大小也差不多。到了二时，较近的两颗与木星的距离相等了，因为西侧那颗此时也距木星三角分。但到了六时，在最东那颗与木星之间又看到了第四颗小星，布局如下：最东那颗与下一颗相距三角分，下一颗距木星一角分五十角秒；
f26r.1: \noindent 木星与西侧紧邻的那颗相距三角分，这一颗又与更西的那颗相距七角分。
f26r.2: \noindent 这些星大小几乎相等，只有东侧离木星最近的那颗比其余的稍小。它们位于一条与黄道平行的直线上。
f26r.3: 二月十九日，零时四十分，只在木星西侧看到两颗星，都相当大，与木星精确地位于同一直线上，沿黄道的走向排列。
f26r.4: |-
  \noindent 较近的一颗距木星七角分，它又与更西的那颗相距六角分。

  二月二十日，天空多云。

  二月二十一日，一时三十分，看到三颗相当小的星，布局如下：
f26r.5: |-
  \noindent 东侧那颗距木星两角分；木星与西侧紧邻的那颗相距三角分；这一颗又与更西的那颗相距七角分。它们精确地位于一条与黄道平行的直线上。

  二月二十五日，一时三十分（前三夜天空都被云遮蔽），出现了三颗星：
f26r.6: \noindent 东侧两颗，它们彼此之间以及与木星之间的距离相等，都是四角分；
f26v.1: \noindent 西侧一颗，距木星两角分。它们精确地位于同一直线上，沿黄道的走向排列。
f26v.2: 二月二十六日，零时三十分，只有两颗星：
f26v.3: \noindent 一颗在东侧，距木星十角分；另一颗在西侧，距木星六角分。东侧那颗比西侧那颗略小。但到了五时，看到了三颗星：
f26v.4: \noindent 除了已经记下的两颗之外，在西侧靠近木星处还能看到第三颗，极小，它先前藏在木星后面，此时距木星一角分；东侧那颗看起来比先前更远，距木星十一角分。这一夜，我第一次决定以某颗恒星为参照，观测木星及其周围的行星沿黄道经度方向的移动。当时在东边可以看到一颗恒星，距东侧那颗行星十一角分，并略向南偏，情形如下：
f26v.5: 二月二十七日，一时四分，诸星呈如下布局：最东的那颗距木星十角分；下一颗离木星最近，相距三十角秒；西侧紧接着的那颗距木星两角分三十角秒；
f27r.1: \noindent 更西的那颗又与它相距一角分。
f27r.2: \noindent 靠近木星的两颗看起来很小，尤其是东侧那颗；两端的两颗则非常显眼，西侧那颗尤甚。它们精确地沿黄道的走向排成一条直线。与前述那颗恒星相比较，可以清楚地看出这些行星在向东移动：因为木星连同它周围的行星离那颗恒星更近了，如附图所示。到了五时，东侧离木星最近的那颗距木星一角分。
f27r.3: 二月二十八日，一时，只看到两颗星：东侧那颗距木星九角分，西侧那颗距木星两角分。两颗都相当显眼，位于同一直线上；从那颗恒星向这条直线所作的垂线，恰好落在东侧那颗行星上，如图所示：
f27r.4: \noindent 到了五时，又在东侧看到第三颗小星，距木星两角分，布局如下：
f27r.5: 三月一日，零时四十分，看到四颗星，全都在东侧。
f27v.1: \noindent 其中离木星最近的那颗距木星两角分，下一颗与它相距一角分，第三颗与下一颗相距二十角秒，它比其余的星都亮；最东的那颗与第三颗相距四角分，比其余的星都小。它们几乎排成一条直线，只是从木星数起的第三颗稍稍高出一些。那颗恒星与木星以及最东的那颗星构成一个等边三角形，如图所示：
f27v.2: 三月二日，零时四十分，木星旁有三颗行星，两颗在东侧，一颗在西侧，布局如下：
f27v.3: |-
  \noindent 最东的那颗距木星七角分，下一颗与它相距三十角秒；西侧那颗距木星两角分。两端的两颗比中间那颗更亮、更大，中间那颗看起来非常小。最东的那颗略微偏离穿过其余两颗和木星所引的直线，向北抬高了一些。前面记下的那颗恒星与西侧那颗行星相距八角分，位于从这颗行星出发、垂直于贯穿所有行星之直线的那条垂线上，如附图所示。

  我决定附上木星及其周围行星与恒星的这些比较，好让每个人都能从中看出：这些行星无论在经度上还是纬度上的移动，都与根据天文表\footnote{指当时据以推算行星位置的天文表，如普鲁士星表。}推得的运动完全吻合。
f28r.1: '% 本页开头半句所属的句子（Hasce ... collationes apponere placuit ...）按规范整句译在 f27v'
f28r.2: 以上就是对四颗美第奇行星的观测，它们是我最近首次发现的。根据这些观测，虽然还不能用数字推算出它们的周期，但至少可以指出一些值得注意的事情。首先，它们时而以相近的间距跟在木星后面，时而走在它前面，向东或向西离开木星都只有极小的幅度，并且无论木星逆行还是顺行，都始终与它相伴；因此谁都不能怀疑它们是在绕木星转动，与此同时，它们又全体一道绕宇宙中心完成十二年的周期。此外，它们沿大小不等的圆周转动。这一点可以清楚地推知：在离木星较远的位置上，从未见过两颗行星挨在一起；而在木星附近，却曾见到两颗、三颗，有时甚至全部四颗聚集在一起。还可以发现，绕木星画出较小圆周的行星转得较快：离木星较近的星常常前一天出现在西侧，次日便出现在东侧，反之亦然；而那颗沿最大轨道运行的行星，若仔细考察前面记下的各次往返，看来以半个月为周期回到原位。\footnote{木卫四（卡利斯托）的实际公转周期约为十六点七天。}此外，我们还有一个绝佳而有力的论据，可以打消某些人的疑虑：他们在哥白尼体系中能够平心接受行星绕太阳运转，却因唯一的月球绕地球运动、而二者又一同每年绕太阳一周而大感困扰，以至认为这种宇宙结构不可能成立，应当推翻。如今我们所见的，不只是一颗行星绕另一颗转动、二者又一同沿大轨道绕太阳运行；感官还向我们展示了四颗环绕木星游行的星，正如月球环绕地球一样，
f28v.1: |-
  \fontsize{9.8}{16.6}\selectfont % leading 3% tighter on this page only, to keep 完 on the page
  \taperpar[4]{\noindent 而它们又全体随同木星，以十二年为期，沿大轨道绕太阳运行。最后不应略过的问题是：美第奇星绕木星作极小的旋转，为什么有时看起来比它们自身平时大出一倍以上？原因决不能到地球的雾气中去寻找，因为它们显得变大或变小时，木星和附近恒星的大小却毫无变化。若说它们在其转动的近地点和远地点靠近或远离地球，以致产生如此大的变化，这似乎完全不可想象：因为狭小的圆周运动绝无可能造成这种效果；而卵形运动（在此情形下几乎就是直线运动）似乎既不可想象，也与观测到的现象毫不相符。对此我想到的解释，乐于提出来，交由正确从事哲学思考的人评判和审查。众所周知，隔着地球上的雾气看，太阳和月球显得较大，恒星和行星却显得较小：因此日月两大发光体在地平线附近显得较大，而星辰则显得较小，而且往往看不见；如果这些雾气又被光照亮，星辰就缩得更小；所以星辰在白天和晨昏时分显得十分微弱，月球却不是这样，这一点我们前面也已指出。此外，不仅地球，月球也有一层雾气球层环绕着它，这既可从前面所说的得知，更可从我们将在《体系》\footnote{指伽利略计划撰写的论宇宙体系的著作，当时并未出版。}中更详细论述的内容得知。对其余行星，我们也可以合理地作同样的判断；因此，设想木星周围也有一层比其余以太更浓密的球层，似乎绝非不可想象。\zhemph{美第奇}行星就像月球环绕元素天球那样环绕这层球层运行；当它们位于远地点时，隔着这层球层看，便显得较小；位于近地点时，由于这层球层被移开或变薄，便显得较大。时间紧迫，不容我再深入；关于这些问题，坦诚的读者不久可望读到更多论述。}

