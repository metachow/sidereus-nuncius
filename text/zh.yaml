f02r.2: \zhwoodinitial{you}些人致力于保护德行卓越之士的光辉业绩不受嫉妒的侵害，使他们配享不朽的名字免遭遗忘和湮灭；这些人的做法实在高尚，也极富仁厚之心。正因如此，才有了为留给后人纪念而制作的肖像，有的用大理石雕成，有的用青铜铸就；才有了竖立起来的雕像，有立像，也有骑像；才有了那位诗人所说的、耗费巨资而“直抵星辰”的圆柱和金字塔；\footnote{语出古罗马诗人普罗佩提乌斯《哀歌集》第三卷第二首。}最后，才有了一座座建起的城市，以那些人的名字命名——心怀感念的后人认为应当把他们托付给永恒。因为人的心智就是如此：除非不断有事物的形象从外界闯入、叩击它，一切记忆都很容易从中流失。
f02r.3: 然而另一些人着眼于更坚固、更长久的东西，他们把对伟人的永恒颂扬，不是献给石头和金属，
f02v.1: \noindent 而是献给缪斯的守护，献给不朽的文字丰碑。可我何必提起这些呢？仿佛人类的智巧满足于这些领域，就不敢再往前走了似的。其实不然：它望得更远，深知人类的一切纪念物终将毁于暴力、风雨和岁月，于是构想出更不易朽坏的标记，让“吞噬一切的时间”和“心怀嫉妒的岁月”都无权染指。\footnote{化用奥维德《变形记》第十五卷中的诗句。}于是它迁往天上，借那些永恒天球上最明亮星辰的标记，铭刻下某些人的名字：他们因卓越而近乎神圣的功业，被认为配得与星辰一同享有永恒。因此，朱庇特、玛尔斯、墨丘利、赫拉克勒斯以及其他英雄——众星正是以他们的名字命名——的声名不会黯淡，除非这些星辰自身的光辉先熄灭。然而人类智慧的这项发明，虽然无比高贵、令人惊叹，却已湮没了许多个世纪，因为古代的英雄们占据着那些明亮的居所，仿佛凭着自己的权利据有它们。奥古斯都出于孝心，曾想把尤利乌斯·恺撒列入他们的行列，却是徒劳：他想把在他那个时代出现的一颗星——属于希腊人称为“彗星”、我们称为“长发星”的那一类——命名为“尤利乌斯之星”，可它不久便消失了，使他如此殷切的期望落了空。\footnote{指公元前四十四年恺撒遇刺后出现的彗星，当时被视为恺撒升天成神的征兆。}但是，至尊的君主啊，我们能为殿下预言的，要真实得多，也吉祥得多。因为殿下灵魂中不朽的光彩刚刚开始在地上闪耀，天上便有明亮的星辰现身，它们将如同口舌一般，
f03r.1: \noindent 永世诉说、颂扬殿下卓绝的美德。看哪，这四颗星正是为殿下显赫的名字保留的。它们并非来自平庸而不起眼的恒星之群，而是属于显赫的行星之列。它们以彼此不同的运动，环绕众星之中最尊贵的木星，犹如它的嫡亲后裔，以惊人的速度走完各自的路程和轨道；与此同时，它们又同心协力，全体一起每十二年绕宇宙的中心——也就是太阳本身——完成一次大的环行。\footnote{木星绕太阳一周约需十二年。伽利略在此明确把太阳称为“宇宙的中心”。}而要我把这些新行星特别献给殿下显赫的名字，似乎是星辰的创造者亲自以明白的证据提醒了我。因为，正如这些星犹如无愧于朱庇特的子嗣，\footnote{拉丁文 \textit{Iuppiter}（属格 \textit{Iovis}）既是罗马主神朱庇特之名，也是木星之名（木星即“朱庇特之星”）。伽利略在献词中有意两用：新星是“朱庇特的子嗣”，常伴木星左右；而占星术中主吉、主王权的木星又庇佑着科西莫，由此把美第奇家族与木星及其卫星联系在一起。}从不远离他的身旁，至多只离开一小段距离；同样，仁慈、温和的心性、优雅的举止、王室血统的光辉、行事的威严、对他人的权威与统治之广——这一切都已在殿下身上安家落户——谁不知道，我是说，谁不知道这一切都是从仅次于万善之源上帝的、最吉善的木星流溢而出的呢？木星，我是说，正是木星，在殿下诞生的那一刻，已越过地平线上浑浊的雾气，占据中天，从它的王宫照亮东方的宫角，\footnote{“中天”“东方的宫角”（即上升点）都是占星术用语。伽利略在这里依照占星术描述科西莫出生时木星的位置。}从那崇高的宝座上俯视这最幸运的降生，把它全部的光辉与恢宏倾注到最纯净的空气中，
f03v.1: \noindent 好让那娇嫩的小小身躯，连同已蒙上帝赐予更高贵禀赋的灵魂，随着第一口呼吸，就把那全部的力量与权能吸纳进去。然而，既然我几乎能以必然的理由推断并证明这一点，又何必使用这些仅属可能的论证呢？至善至大的上帝乐于让殿下尊贵的双亲认为我不无资格，可以为殿下讲授数学诸学科；在刚刚过去的四年里，每到一年中通常可以从较繁重的学业里得闲的时节，我都尽了这份职责。因此，既然天意让我得以侍奉殿下，因而更近地沐浴到殿下难以置信的仁慈与恩惠的光芒，那么，我的心灵热切到几乎日夜别无所思，只求让人知道：我——不仅在心里，而且就出身与天性而言，都是殿下治下的臣民——最热切地渴望殿下的荣耀，对殿下的感激之深无以复加——这又有什么奇怪呢？既然如此，既然在殿下的护佑之下，至尊的\zhemph{科西莫}啊，我探查到了以往所有天文学家都不知道的这些星，我便有充分的理由决定以殿下最尊贵的家族之名来命名它们。如果说是我首先找到了它们，那么倘若我也给它们取名，称之为\zhemph{美第奇星}，谁又能正当地责怪我呢？我希望，这一名称给这些星带来的尊荣，能像别的名称给其他英雄带来的一样多。因为，且不说殿下那些尊贵的先祖——他们永恒的荣耀，
f04r.1: \noindent 有一切史册为证——单凭殿下您自己的美德，最伟大的英雄啊，就足以赋予这些星辰不朽的名声。因为谁能怀疑：殿下以无比吉祥的统治开端在人们心中激起的期望，尽管已是极高，您不仅能够担当、守住，而且必将远远超越？这样，在胜过其他与您相仿的人之后，您仍要与自己竞争，一天天变得比您自己、比您自身的伟大更加伟大。
f04r.2: 所以，最仁慈的君主啊，请接受这份由星辰为您保留的家族荣耀吧；并愿您尽可能长久地享有那些神圣的福祉——它们与其说是由星辰，不如说是由星辰的创造者与主宰者上帝赐予您的。
f04r.3: 一六一〇年三月十二日，于帕多瓦。\footnote{原文用罗马历法纪日，作“三月伊代斯日前第四日”。三月的伊代斯日为十五日，按罗马人连首尾计数的算法，即三月十二日。}
