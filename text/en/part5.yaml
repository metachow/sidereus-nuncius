p056.01: >-
  On the 3rd, at the seventh hour, the stars were arranged in this order: the eastern one was 1 minute 30 seconds from Jupiter, the western one nearest to Jupiter, ⟦23r⟧ 2 minutes; and from this one the other, farther western one was separated by 10 minutes. They lay exactly on the same straight line and were of equal magnitude.
p057.01: >-
  On the 4th, at the second hour, four stars stood around Jupiter, two eastern and two western, arranged precisely on the same straight line, as in the next figure:
p057.02: >-
  The more eastern one was 3 minutes from the one next to it, and this one was 0 minutes 40 seconds from Jupiter; Jupiter was 4 minutes from the nearest western one, and this one 6 minutes from the more western one.
p057.03: >-
  They were nearly equal in magnitude; the one nearest to Jupiter appeared a little smaller than the rest.
p057.04: >-
  At the seventh hour, however, the eastern stars were only 0 minutes 30 seconds apart.
p057.05: >-
  Jupiter was 2 minutes from the nearer eastern one and 4 minutes from the next western one, and this one was 3 minutes from the more western one; they were all equal, and lay on the same straight line extended along the ecliptic.
p058.01: >-
  On the 5th, the sky was cloudy.
p059.01: >-
  On the 6th, only two stars appeared, enclosing Jupiter ⟦23v⟧ between them, as can be seen in the figure added here: the eastern one was 2 minutes from Jupiter, the western one 3 minutes; they were on the same straight line with Jupiter, and equal in magnitude.
p060.01: >-
  On the 7th, two stars stood near Jupiter, both to the east of it, arranged in this manner:
p060.02: >-
  the intervals between them and Jupiter were equal, namely one minute each; and a straight line passed through them and the center of Jupiter.
p061.01: >-
  On the 8th, at the first hour, three stars were present, all eastern, as in the drawing:
p061.02: >-
  The one nearest to Jupiter, quite small, was 1 minute 20 seconds from it; the middle one, which was fairly large, was 4 minutes from this; the easternmost, extremely small, was 0 minutes 20 seconds from the middle one.
p061.03: >-
  I was in doubt whether the one nearest to Jupiter was a single little star or two; for at times another seemed to be present beside it toward the east, remarkably small, and separated from it by only 0 minutes 10 seconds. All of them lay on the same straight line extended along the course of the zodiac.
p061.04: >-
  At the third hour, the star nearest to Jupiter almost touched it, for it was only 0 minutes 10 seconds from it; the others had moved farther from Jupiter, for the middle one was now 6 minutes away.
p061.05: >-
  At last, at the fourth hour, the one that had been nearest to Jupiter had joined with it and could no longer be seen.
p062.01: >-
  On the 9th, at hour 0 and 30 minutes, there stood by Jupiter two eastern stars ⟦24r⟧ and one western, in this arrangement:
p062.02: >-
  The more eastern one, which was quite small, was 4 minutes from the next; the middle one, larger, was 7 minutes from Jupiter; Jupiter was 4 minutes from the western one, which was small.
p063.01: >-
  On the 10th, at the first hour and 30 minutes, two little stars, extremely small, both eastern, were seen in this arrangement:
p063.02: >-
  the farther one was 10 minutes from Jupiter, the nearer 0 minutes 20 seconds; and they were on the same straight line.
p063.03: >-
  At the fourth hour, however, the star nearest to Jupiter no longer appeared; the other too seemed so diminished that it could scarcely be seen, although the air was very clear; and it was farther from Jupiter than before, for it was 12 minutes away.
p064.01: >-
  On the 11th, at the first hour, there were two stars to the east and one to the west.
p064.02: >-
  The western one was 4 minutes from Jupiter; the nearer eastern one was likewise 4 minutes from Jupiter; the more eastern one was 8 minutes from this one. They were quite clear, and on the same straight line.
p064.03: >-
  But at the third hour a fourth star, nearest to Jupiter, was seen on the eastern side, smaller than the rest, ⟦24v⟧ 0 minutes 30 seconds from Jupiter, and turning a little toward the north from the straight line drawn through the other stars; all were most brilliant and very conspicuous.
p064.04: >-
  At the fifth hour and a half, the eastern star nearest to Jupiter had already moved farther from it and held the middle place between Jupiter and the more eastern star next to it; and all were exactly on the same straight line and of the same magnitude, as can be seen in the drawing added here:
p065.01: >-
  On the 12th, at hour 0 and 40 minutes, two stars stood to the east and likewise two to the west.
p065.02: >-
  The farther eastern one was 10 minutes from Jupiter, and the farther western one 8 minutes, and both were quite conspicuous; the other two were very close to Jupiter and extremely small, especially the eastern one, which was 0 minutes 40 seconds from Jupiter; the western one was 1 minute away.
p065.03: >-
  At the fourth hour, however, the little star that had been nearest to Jupiter on the east no longer appeared.
p066.01: >-
  On the 13th, at hour 0 and 30 minutes, two stars appeared to the east, and two more to the west.
p066.02: >-
  The eastern one nearer to Jupiter, quite clear, was 2 minutes from it; the one farther east than this, less conspicuous, was 4 minutes from it.
p066.03: >-
  Of the western ones, ⟦25r⟧ the one farther from Jupiter, very conspicuous, was 4 minutes from it; between this one and Jupiter there lay a tiny little star, nearer to the more western star, since it was no more than 0 minutes 30 seconds from it.
p066.04: >-
  All were exactly on the same straight line along the length of the ecliptic.
p067.01: >-
  On the 15th (for on the 14th the sky was covered with clouds), at the first hour, the positions of the stars were as follows:
p067.02: >-
  three stars were eastern, and none was seen to the west. The eastern one nearest to Jupiter was 0 minutes 50 seconds from it; the next was 0 minutes 20 seconds from this one, and the one farther east 2 minutes from that; it was larger than the others, for those closer to Jupiter were extremely small.
p067.03: >-
  But at about the fifth hour, only one of the stars near Jupiter could be seen, 0 minutes 30 seconds from Jupiter; the distance of the more eastern one from Jupiter had increased, for it was then 4 minutes.
p067.04: >-
  And at the sixth hour, besides the two placed to the east, as just described, a very small little star was seen toward the west, 2 minutes from Jupiter.
p068.01: >-
  On the 16th, at the sixth hour, they stood in this arrangement: the eastern star was 7 minutes from Jupiter, ⟦25v⟧ Jupiter was 5 minutes from the next western one, and this one 3 minutes from the other, more western one. All were of nearly the same magnitude, quite conspicuous, and on the same straight line, precisely along the course of the zodiac.
p069.01: >-
  On the 17th, at hour 1, two stars were present:
p069.02: >-
  one eastern, 3 minutes from Jupiter, and the other western, 10 minutes from it; this one was somewhat smaller than the eastern one.
p069.03: >-
  But at hour 6, the eastern one was nearer to Jupiter, namely 0 minutes 50 seconds; the western one was farther, namely 12 minutes.
p069.04: >-
  In both observations they were on the same straight line, and both were quite small, especially the eastern one in the second observation.
p070.01: >-
  On the 18th, at hour 1, three stars were present, two of them western and one eastern:
p070.02: >-
  the eastern one was 3 minutes from Jupiter, the nearest western one 2 minutes; the remaining, more western one was 8 minutes from the middle one. All were exactly on the same straight line, and of nearly the same magnitude.
p070.03: >-
  At hour 2, however, the nearer stars were at equal distances from Jupiter, for the western one too was now 3 minutes away.
p070.04: >-
  But at hour 6, a fourth little star was seen between the more eastern one and Jupiter, in this configuration: the more eastern one was 3 minutes from the next, the next 1 minute 50 seconds from ⟦26r⟧ Jupiter, Jupiter 3 minutes from the next western one, and this one 7 minutes from the more western one:
p070.05: >-
  they were nearly equal; only the eastern one nearest to Jupiter was a little smaller than the rest; and they were on the same straight line, parallel to the ecliptic.
p071.01: >-
  On the 19th, at hour 0 and 40 minutes, only two stars were seen, both to the west of Jupiter, quite large, and arranged exactly on the same straight line with Jupiter, along the course of the ecliptic.
p071.02: >-
  The nearer was 7 minutes from Jupiter, and this one 6 minutes from the more western one.
p072.01: >-
  On the 20th, the sky was cloudy.
p073.01: >-
  On the 21st, at hour 1 and 30 minutes, three quite small little stars were seen in this arrangement:
p073.02: >-
  the eastern one was 2 minutes from Jupiter, Jupiter 3 minutes from the next western one, and this one 7 minutes from the more western one; they were exactly on the same straight line, parallel to the ecliptic.
p074.01: >-
  On the 25th, at hour 1 and 30 minutes (for on the three preceding nights the sky was covered with clouds), three stars appeared:
p074.02: >-
  two eastern ones, whose distances from each other and from Jupiter ⟦26v⟧ were equal, namely 4 minutes; the one western star was 2 minutes from Jupiter. They were exactly on the same straight line, along the course of the ecliptic.
p075.01: >-
  On the 26th, at hour 0 and 30 minutes, only two stars were present:
p075.02: >-
  one eastern, 10 minutes from Jupiter, the other western, 6 minutes from it; the eastern one was somewhat smaller than the western.
p075.03: >-
  But at hour 5, three stars were seen:
p075.04: >-
  for besides the two already noted, a third, extremely small, was seen near Jupiter on the west, which had previously been hidden behind Jupiter; it was 1 minute from it. The eastern one, moreover, seemed farther away than before, being 11 minutes from Jupiter.
p075.05: >-
  On this night I resolved for the first time to observe the progress of Jupiter and the neighboring planets along the length of the zodiac by relating them to a fixed star. For a fixed star was seen toward the east, 11 minutes from the eastern planet, and lying a little to the south, as follows:
p076.01: >-
  On the 27th, at hour 1 and 4 minutes, the stars appeared in this configuration: the more eastern one was 10 minutes from Jupiter, the next, nearest to Jupiter, 0 minutes 30 seconds; the next, western one was ⟦27r⟧ 2 minutes 30 seconds away; and the one more western than this was 1 minute from it.
p076.02: >-
  The ones nearer to Jupiter appeared small, especially the eastern one; the outer ones were very conspicuous, the western one above all; and they marked out exactly a straight line along the course of the ecliptic.
p076.03: >-
  The progress of these planets toward the east was plainly seen by comparison with the fixed star mentioned above; for Jupiter, with the planets standing by it, was nearer to the fixed star, as can be seen in the figure added here.
p076.04: >-
  But at hour 5, the eastern star nearest to Jupiter was 1 minute from it.
p077.01: >-
  On the 28th, at hour 1, only two stars were seen: the eastern one, 9 minutes from Jupiter, and the western one, 2 minutes. They were quite conspicuous and on the same straight line, and a perpendicular from the fixed star to this line fell on the eastern planet, as in the figure:
p077.02: >-
  but at hour 5, a third little star was seen to the east, 2 minutes from Jupiter, in this arrangement:
p078.01: >-
  On the 1st of March, at hour 0 and 40 minutes, four stars were seen, all of them eastern ⟦27v⟧. The one nearest to Jupiter was 2 minutes from it, the next 1 minute from this, the third 0 minutes 20 seconds from that one, and it was brighter than the rest; the easternmost was 4 minutes from the third, and was smaller than the rest.
p078.02: >-
  They marked out nearly a straight line, except that the third from Jupiter was raised a little.
p078.03: >-
  The fixed star formed an equilateral triangle with Jupiter and the easternmost star, as in the figure:
p079.01: >-
  On the 2nd, at hour 0 and 40 minutes, three planets stood by Jupiter, two eastern and one western, in this configuration:
p079.02: >-
  The more eastern one was 7 minutes from Jupiter, the next 0 minutes 30 seconds from it; the western one was 2 minutes from Jupiter. The outer ones were brighter and larger than the remaining one, which appeared extremely small.
p079.03: >-
  The more eastern one seemed to be raised a little toward the north from the straight line drawn through the others and Jupiter.
p079.04: >-
  The fixed star already noted was 8 minutes from the western planet, along the perpendicular drawn from that planet to the straight line extended through all the planets, as the figure added here shows.
p080.01: >-
  I decided to add these comparisons of Jupiter and the neighboring planets with the fixed star ⟦28r⟧ so that anyone may understand from them that the progress of these planets, both in longitude and in latitude, agrees exactly with the motions derived from the tables.\footnote{The astronomical tables then used to compute planetary positions, such as the Prutenic Tables of Erasmus Reinhold (1551), based on Copernicus. Only Jupiter’s motion could be taken from the tables; Galileo’s point is that its companions share it.}
p081.01: >-
  These are the observations of the four Medicean planets, recently discovered by me for the first time. Although it is not yet possible to work out their periods in numbers, these observations at least allow us to state some things worthy of notice.
p081.02: >-
  First, they now follow Jupiter and now precede it at similar distances; they move away from it, toward the east and toward the west, only within very narrow limits; and they accompany it alike when it moves retrograde and when it moves direct. No one, therefore, can doubt that they make their revolutions about Jupiter, while all of them together complete periods of twelve years about the center of the universe.
p081.03: >-
  Moreover, they revolve in unequal circles. This is plainly gathered from the fact that at the greater distances from Jupiter two planets were never seen joined together, whereas near Jupiter two, three, and sometimes all of them have been found crowded together.
p081.04: >-
  It is also found that the planets describing the smaller circles about Jupiter revolve faster: for the stars nearer to Jupiter are often seen in the east when on the day before they had appeared in the west, and the other way around. But the planet traveling on the largest orbit seems, to anyone who carefully weighs the returns recorded above, to come back to its place every half month.\footnote{The actual period of Callisto, the outermost of the four, is about 16.7 days; those of Io, Europa and Ganymede are about 1.8, 3.6 and 7.2 days.}
p081.05: >-
  We have, besides, an excellent and splendid argument for removing the misgivings of those who calmly accept the revolution of the planets about the Sun in the Copernican system, yet are so disturbed by the motion of the Moon alone about the Earth, while both complete a yearly orbit about the Sun, that they think this arrangement of the universe must be rejected as impossible. For now we have not just one planet revolving about another while both travel a great orbit about the Sun: our senses show us four wandering ⟦28v⟧ stars revolving about Jupiter, as the Moon does about the Earth, while all of them together with Jupiter travel a great orbit about the Sun in the space of 12 years.
p081.06: >-
  Finally, we must not pass over the question of how it happens that the Medicean Stars, while they complete their very small circuits about Jupiter, sometimes appear more than twice as large as at other times.
p081.07: >-
  We can by no means look for the cause in the vapors of the Earth, for they appear enlarged or diminished while the size of Jupiter and of the nearby fixed stars is seen to be quite unchanged.
p081.08: >-
  But that they should approach the Earth and recede from it, at the perigee and apogee of their revolution, so far as to account for so great a change seems altogether inconceivable. A tight circular motion can in no way produce this; and an oval motion (which in this case would be almost straight) seems both inconceivable and in no way consistent with the appearances.
p081.09: >-
  What occurs to me on this point I gladly put forward, and submit it to the judgment and criticism of those who philosophize rightly.
p081.10: >-
  It is well known that, seen through the vapors of the Earth, the Sun and the Moon appear larger, but the fixed stars and the planets smaller. Hence the luminaries appear larger near the horizon, while the stars appear smaller and often cannot be seen at all; and they are diminished still more if those same vapors are filled with light. For this reason the stars appear very faint by day and in twilight, but the Moon does not, as we also noted above.
p081.11: >-
  It is also well known that not only the Earth but the Moon too has its own vaporous orb surrounding it, both from what we said above and above all from what will be said more fully in our \textit{System}.\footnote{The planned work on the system of the world; see [14v].} We may fittingly judge the same of the other planets; so it seems by no means inconceivable to place about Jupiter as well an orb denser than the rest of the aether. Around this orb the \tremph{Medicean} planets would be carried, as the Moon is around the sphere of the elements; and when they are at apogee they would appear smaller, because this orb lies in the way, but when at perigee, larger, because the orb is removed or thinned.
p081.12: >-
  Shortness of time prevents me from going further; the fair-minded reader may expect more on these matters before long.
