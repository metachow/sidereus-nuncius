f02r.1: |-
  {\centering \dispcaps[11][15]{To the Most Serene}\\[1pt]
   \dispcaps[16.5][2]{Cosimo II de' Medici}\\[1pt]
   \dispcaps[16.5][2]{Fourth Grand Duke}\\[1pt]
   \dispcaps[11][15]{of Tuscany}\par}
p001.01: >-
  Noble indeed, and full of humanity, was the practice of those who have striven to protect from envy the splendid deeds of men outstanding in virtue, and to rescue from oblivion and destruction names worthy of immortality.
p001.02: >-
  Hence the likenesses handed down to the memory of posterity, whether carved in marble or cast in bronze; hence the statues set up, both standing and equestrian; hence, as the poet says, the costly columns and pyramids raised to the stars;\footnote{The Roman poet Propertius, \textit{Elegies} III.2.} hence, finally, the cities built and called by the names of those whom a grateful posterity judged worthy to be entrusted to eternity.
p001.03: >-
  For such is the condition of the human mind that, unless it is continually struck by images of things bursting in upon it from outside, all remembrance easily drains away from it.
p002.01: >-
  Others, however, looking to things firmer and longer-lasting, have consecrated the everlasting praise of the greatest men not to stones and metals ⟦2v⟧ but to the keeping of the Muses and to the incorruptible monuments of letters.
p002.02: >-
  But why do I recall these things? As though human ingenuity, content with these regions, had not dared to advance further! On the contrary, looking farther ahead, and understanding perfectly well that all human monuments perish at last through violence, weather, and age, it devised more incorruptible signs, over which devouring time and envious age could claim no right.\footnote{Echoing Ovid, \textit{Metamorphoses} XV.234: “tempus edax rerum, tuque, invidiosa vetustas.”}
p002.03: >-
  Migrating to the heavens, therefore, it inscribed on those everlasting orbs, with the marks of the brightest stars, the names of those who, on account of outstanding and almost divine deeds, were judged worthy to enjoy eternity together with the stars.
p002.04: >-
  Hence the fame of Jupiter, Mars, Mercury, Hercules, and the other heroes, by whose names the stars are called, will not be dimmed before the splendor of the stars themselves is extinguished.
p002.05: >-
  Yet this invention of human sagacity, though singularly noble and admirable, has now been out of use for many centuries, since the ancient heroes occupy those shining seats and hold them, as it were, by right; into their company the filial devotion of Augustus tried in vain to enlist Julius Caesar. For when he wished a star that rose in his time, one of those the Greeks call comets and our people “hairy stars,” to be named the Julian star, it soon vanished and mocked the hope of so great a desire.\footnote{The comet that appeared after Caesar's assassination in 44 B.C. and was taken as a sign of his deification.}
p002.06: >-
  But far truer and happier things, Most Serene Prince, we can foretell for Your Highness. For scarcely have the immortal glories of your spirit begun to shine on earth, when bright stars offer themselves in the heavens, which, like tongues, will speak of your outstanding ⟦3r⟧ virtues and celebrate them for all time.
p002.07: >-
  Behold, then, four stars reserved for your illustrious name; and not from the common and less distinguished throng of the fixed stars, but from the splendid order of the wandering ones. With motions unequal among themselves, they complete their courses and orbits around the star of Jupiter, the noblest of all the others, as though they were his own offspring, with marvelous swiftness; and meanwhile, in unanimous concord, they all together complete their great revolutions every twelfth year around the center of the universe, that is, around the Sun itself.\footnote{Jupiter takes about twelve years to circle the Sun. Galileo here plainly calls the Sun the center of the universe.}
p002.08: >-
  That I should assign these new planets to the illustrious name of Your Highness before all others, the Maker of the stars himself seems to have prompted me by clear indications.
p002.09: >-
  For just as these stars, like offspring worthy of Jupiter, never depart from his side except by a small interval, so who does not know the clemency, the gentleness of spirit, the sweetness of manners, the splendor of royal blood, the majesty in action, the breadth of authority and rule over others, all of which have made their home and seat in Your Highness? Who, I say, does not know that all these things flow from the most benign star of Jupiter, next to God the source of all good?\footnote{In Latin \textit{Iuppiter} (genitive \textit{Iovis}) is both the name of the god and the name of the planet. Galileo plays on both: the new stars are Jupiter's offspring, always at his side, while the planet, in astrology the bringer of good fortune and royal power, watches over Cosimo; thus the Medici are tied to Jupiter and his four companions.}
p002.10: >-
  Jupiter, Jupiter, I say, at the very hour of Your Highness's birth, having already passed beyond the turbid vapors of the horizon, occupying the middle hinge of the heavens and lighting up the eastern angle from his royal palace, looked down from that lofty throne upon that most fortunate nativity, and poured all his splendor and grandeur into the purest air, so that your tender little body, together with your spirit, already adorned by God with nobler gifts, might draw in with its first breath all ⟦3v⟧ that power and authority.\footnote{“The middle hinge of the heavens” (the midheaven) and “the eastern angle” (the ascendant) are astrological terms; Galileo here describes the position of Jupiter at Cosimo's birth according to astrology.}
p002.11: >-
  But why do I use probable arguments, when I can conclude and demonstrate the point by almost necessary reasoning?
p002.12: >-
  It pleased God, Best and Greatest, that I should be thought by your Most Serene parents not unworthy to devote my labor to Your Highness in teaching the mathematical disciplines; this I did during the last four years, at that time of year when there is usually a respite from more serious studies.
p002.13: >-
  Since it has therefore plainly been granted to me by divine favor to serve Your Highness, and thus to receive more closely the rays of your incredible clemency and kindness, what wonder if my spirit has grown so warm that day and night it thinks of almost nothing else than that I, who am under your dominion not only by inclination but by very birth and nature, should be known to be most eager for your glory and as grateful to you as possible?
p002.14: >-
  This being so, since under your auspices, Most Serene \tremph{Cosimo}, I have explored these stars, unknown to all earlier astronomers, I have with every right decided to distinguish them with the most august name of your house.
p002.15: >-
  And if I was the first to track them down, who could justly blame me if I also give them a name and call them the \tremph{Medicean Stars}? I hope that these stars will gain as much dignity from this name as other names have brought to other heroes.
p002.16: >-
  For, to say nothing of your Most Serene forebears, whose everlasting glory the records of all ⟦4r⟧ histories attest, your virtue alone, Greatest of Heroes, can bestow immortality of name upon those stars.
p002.17: >-
  Who can doubt that the expectation you have aroused by the most fortunate beginnings of your rule, however high, you will not only sustain and uphold, but surpass by far? Thus, having surpassed others like yourself, you will nonetheless compete with yourself, and from day to day grow greater than yourself and than your own greatness.
p003.01: >-
  Accept, therefore, Most Clement Prince, this glory of your house, reserved for you by the stars, and enjoy for as long as possible those divine blessings which are conferred upon you not so much by the stars as by the Maker and Ruler of the stars, God.
p004.01: >-
  Given at Padua, on the fourth day before the Ides of March, 1610.\footnote{That is, March 12: the Romans counted back inclusively from the Ides, which in March fall on the 15th.}
f04r.4: |-
  \vspace{1.5\baselineskip}
  \noindent\hspace*{6em}Your Highness's

  \vspace{1.5\baselineskip}
  \noindent\hspace*{10em}Most Devoted Servant

  \vspace{4\baselineskip}
  \hfill Galileo Galilei.
p005.01: >-
  The Most Excellent Lords, Heads of the Exalted Council of Ten, undersigned, having received assurance from the Lords Reformers of the University of Padua, by the report, under oath, of the two deputed to this matter, namely the Reverend Father Inquisitor and the Circumspect Secretary of the Senate, Giovanni Maraviglia, that in the book entitled \tremph{Sydereus Nuncius}, etc., by Signor Galileo Galilei, nothing is found contrary to the Holy Catholic Faith, to Princes, or to good morals, and that it is worthy of print, grant license that it may be printed in this City.\footnote{The Council of Ten was the Venetian Republic's highest body for matters of state security, and its Heads issued printing licenses. The Reformers of the University of Padua were the Republic's officials in charge of the university; they arranged the pre-publication review of books and issued their certificate on the reviewers' testimony.}
p006.01: >-
  Given on the first day of March, 1610.
