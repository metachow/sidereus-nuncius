f05r.1: |-
  {\centering \dispcaps[18][2]{The Astronomical}\\[1pt]
  \dispcaps[15][16]{Messenger}\par
  \vspace{0.4\baselineskip}
  \litsw{containing and explaining}\\
  \lital{\addfontfeatures{LetterSpace=6}RECENTLY MADE OBSERVATIONS}\\
  \litsw{with the aid of a new spyglass, on the face of the Moon, the Milky Way and nebulous stars, innumerable fixed stars, and also on four planets, never seen until now, called}\\
  \lital{\addfontfeatures{LetterSpace=12}THE MEDICEAN STARS.}\par}
p007.01: >-
  Great indeed are the things I set forth in this small treatise for all students of nature to inspect and contemplate.
p007.02: >-
  Great, I say, both for the excellence of the subject itself, and for their novelty, unheard of through all the ages, and also on account of the instrument by whose aid they have presented themselves to our senses.
p008.01: >-
  It is surely a great thing to add, to the numerous multitude of fixed stars that until this day could be seen by natural sight, countless others never seen before, and to set them plainly before the eyes, outnumbering the old and familiar ones more than tenfold.
p009.01: >-
  It is most beautiful and most pleasing to the sight to behold the body of the Moon, removed from us by about sixty Earth semidiameters,\footnote{The first edition reads “sixty Earth diameters” (\textit{diametros}); Favaro's edition corrects this to “semidiameters” (\textit{semidiametros}), in agreement with the true distance. Galileo's manuscript also has \textit{diametros}, probably a slip. For “two Earth diameters” below [6v], both the first edition and Favaro read \textit{diametros}.} as close as if ⟦5v⟧ it were only two of those measures away; so that the diameter of the same Moon appears about thirty times larger, its surface nine hundred times, and its solid body nearly twenty-seven thousand times larger than when seen only with the unaided eye. From this anyone may then understand, with the certainty of the senses, that the Moon is by no means clothed with a smooth and polished surface, but is rough and uneven; and that, like the face of the Earth itself, it is crowded everywhere with huge swellings, deep hollows, and winding chasms.
p010.01: >-
  Furthermore, to have put an end to the disputes about the Galaxy, or Milky Way, and to have made its essence plain to the senses, let alone the intellect, should not be thought a matter of small moment; and besides, to point out as with a finger the substance of the stars which every astronomer up to now has called nebulous, and to show that it is far different from what has hitherto been believed, will be pleasing and most beautiful.\footnote{That is, celestial objects that look to the naked eye like a hazy patch of light. With the spyglass Galileo found that many of them are clusters of small stars (see below).}
p011.01: >-
  But what far surpasses all wonder, and what chiefly impelled us to give notice to all astronomers and philosophers, is this: that we have found four wandering stars, known or observed by none before us, which have their periods around a certain conspicuous star among the known ones, like Venus and Mercury around the Sun, and now precede it, now follow it, never departing from it beyond certain limits.
p011.02: >-
  All these things were discovered and observed a few days ago by means of the spyglass devised by me, divine grace having first enlightened me.
p012.01: >-
  Other things, perhaps more remarkable, will in time be found, by me or by others, with the help of a similar instrument; its form and construction, and the occasion of devising it, ⟦6r⟧ I shall first describe briefly, and then I shall relate the history of the observations I have made.
p013.01: >-
  About ten months ago a report reached our ears that a certain Netherlander had made a spyglass by whose help visible objects, though very far from the eye of the observer, were seen distinctly as if near; and some accounts of trials of this truly wonderful effect were going around, which some believed and others denied.
p013.02: >-
  A few days later it was confirmed to me by a letter from the noble Frenchman Jacques Badovere, from Paris;\footnote{Jacques Badovere (Giacomo Badoer), by his own certificate of 1607, lodged around 1598 in Galileo's house in Padua and studied mathematics with him. Lutetia is the old Latin name of Paris.} and that finally was the reason why I turned wholly to inquiring into the principles and devising the means by which I might arrive at the invention of a similar instrument. This I attained a little later, relying on the theory of refraction. First I prepared for myself a tube of lead, at whose ends I fitted two glass lenses, both plane on one side, while on the other one was spherically convex and the other concave. Then, putting my eye to the concave one, I saw objects fairly large and near: they appeared three times closer and nine times larger than when viewed with the natural eye alone.\footnote{Galileo's “times closer” refers to linear magnification, his “times larger” to magnification of area: three times closer means nine times larger. Below, “more than sixty times larger” is about eightfold in linear terms, and “nearly a thousand times larger” about thirtyfold.}
p013.03: >-
  Afterwards I made another, more exact, which showed objects more than sixty times larger.
p013.04: >-
  At last, sparing neither labor nor expense, I got so far as to construct for myself an instrument so excellent that things seen through it appear nearly a thousand times larger, and more than thirty times nearer, than if they were viewed with natural power alone.
p013.05: >-
  How many and how great are the advantages of this instrument, on land as well as at sea, it would be wholly superfluous to enumerate.
p013.06: >-
  But, leaving earthly things aside, I turned to the contemplation of the heavens; and first I viewed the Moon so close ⟦6v⟧ that it seemed scarcely two Earth diameters away.
p013.07: >-
  After this I observed stars, both fixed and wandering, many times and with incredible delight of mind; and when I saw their very great multitude, I began to consider, and at length found, a way by which I could measure the intervals between them.
p013.08: >-
  On this matter it is fitting that all who wish to approach observations of this kind be forewarned.
p013.09: >-
  First it is necessary that they prepare for themselves a most exact spyglass, one that shows objects bright, distinct, and covered by no haze, and magnifies them at least four hundred times; for then it will show them twenty times nearer. Unless the instrument is of this kind, one will try in vain to see all those things that have been seen by us in the heavens, or that will be enumerated below.\footnote{Here too the magnification is of area (see the note at [6r]): four hundredfold means twentyfold in linear size.}
p013.10: >-
  So that anyone may be assured with little trouble of the magnification of his instrument, let him cut out of paper two circles or two squares, one of which is four hundred times larger than the other; this will be when the diameter of the larger is twenty times the length of the other's diameter. Then, with both surfaces fixed on the same wall, he should look at them together from afar, the smaller with one eye applied to the spyglass, the larger with the other eye free; this can be done conveniently at one and the same time with both eyes open. Then the two figures will appear of the same size, if the instrument magnifies objects in the desired proportion.
p013.11: >-
  With such an instrument prepared, the method of measuring distances must be inquired into, which we shall attain by the following device.
p013.12: >-
  Let the tube be ABCD, for easier understanding.
p013.13: >-
  Let E be the eye of the observer. If there were no lenses in the tube, the rays would travel to the object FG along the straight lines ECF, EDG; but with the lenses put in place, ⟦7r⟧ they travel along the refracted lines ECH, EDI. They are drawn together, and those that before were directed freely to the object FG will now embrace only the part HI.
p013.14: >-
  Then, having found the ratio of the distance EH to the line HI, one will find by the table of sines the size of the angle that the object HI subtends at the eye, which we shall find to contain only a few minutes.
p013.15: >-
  If we fit to the lens CD thin plates, some pierced with larger holes, some with smaller, laying now this one, now that one over it as need requires, we shall make at will different angles subtending more or fewer minutes; by their help we shall be able to measure conveniently the intervals between stars that are separated by some minutes, with an error of no more than one or two minutes.
p013.16: >-
  Let it suffice for the present to have touched on this lightly, and as it were to have tasted it with the tips of the lips; on another occasion we shall bring forth the complete theory of this instrument.
p013.17: >-
  Now let us review the observations made by us in the last two months, summoning all who desire true philosophy to the beginnings of truly great contemplations.
p014.01: >-
  Of the face of the Moon that is turned ⟦7v⟧ toward our sight, let us speak in the first place.
p014.02: >-
  For easier understanding I divide it into two parts, one brighter, the other darker; the brighter seems to surround and pervade the whole hemisphere, while the darker, like a kind of cloud, stains the face itself and makes it spotted.
p014.03: >-
  These spots, somewhat dark and quite broad, are plain to everyone, and every age has beheld them; we shall therefore call them large, or ancient, in distinction from other spots, smaller in size but so thickly sown that they sprinkle the whole lunar surface, especially the brighter part. These were observed by no one before us. From repeated inspections of them we have been led to the conviction, and understand with certainty, that the surface of the Moon is not smooth, even, and perfectly spherical, as a great company of philosophers have supposed of it and of the other heavenly bodies, but, on the contrary, uneven, rough, crowded with cavities and swellings, no differently from the face of the Earth itself, which is marked here and there by the ridges of mountains and the depths of valleys.
p014.04: >-
  The appearances from which it was possible to gather these things are of the following kind.
