p029.01: >-
  In the first you have the so-called \tremph{Nebula} of Orion’s Head, in which we counted twenty-one stars.\footnote{Galileo’s “Nebula of Orion’s Head” is the group of stars around λ Orionis, in the head of Orion, today the open cluster Collinder~69; it is not the Orion Nebula (M42) in the Sword.}
p030.01: >-
  The second contains the \tremph{Nebula} called \tremph{Praesepe}; this is not one star only, but a cluster of more than forty little stars. Apart from the Aselli, we have noted thirty-six, arranged in the order that follows.\footnote{Praesepe (the Beehive) is the open cluster M44 in Cancer. The Aselli (“the Little Asses”) are the two stars γ and δ Cancri, which flank it to the north and south.}
p031.01: >-
  We have now briefly related what has been observed so far concerning the Moon, the fixed stars, and the Milky Way.
p031.02: >-
  There remains what seems to be the most important matter in the present undertaking: to disclose and make public four \tremph{planets}, never seen from the very beginning of the world down to our own times, together with the occasion of their discovery and observation, their positions, and the observations of their motions and changes made over the last two months. We call upon all astronomers to devote themselves to investigating and determining their periods, which, because of the shortness of time, we have by no means been able to achieve up to this day.
p031.03: >-
  Once more, however, we warn them, so that they do not approach such observation in vain, that a most exact spyglass is needed, such as we described at the beginning of this discourse.
p032.01: >-
  On the 7th of January, then, in the present year 1610, at the first hour of the following night,\footnote{Galileo counts the hours in the Italian manner, from sunset, so “the first hour of the night” is the first hour after sunset. At Padua in early January the Sun set at about half past four in the afternoon, local time.} while I was viewing the heavenly bodies through the spyglass, Jupiter presented itself. Since I had prepared for myself a quite excellent instrument (this had not happened before, because of the weakness of my other instrument), I perceived three little stars standing beside it, small indeed, yet very bright. Although I believed them to be among the fixed stars, they aroused some wonder in me, because they appeared to be arranged along an exact straight line parallel to the ecliptic, and to be brighter than other stars of equal size.
p032.02: >-
  Their arrangement among themselves and with respect to Jupiter was as follows: ⟦17v⟧
p032.03: >-
  that is, two stars were on the eastern side, and one toward the west.
p032.04: >-
  The easternmost and the western one looked slightly larger than the remaining one. I did not concern myself at all with the distance between them and Jupiter, for, as we said at first, I believed them to be fixed stars.
p032.05: >-
  But when on the 8th, led by I know not what fate, I returned to the same observation, I found a very different arrangement. For the three little stars were all to the west, nearer to Jupiter and to one another than on the previous night, and separated by equal intervals, as the accompanying drawing shows.
p032.06: >-
  At this point, although I had by no means turned my thoughts to the stars’ approaching one another, I began to be perplexed how Jupiter could be found to the east of all the aforesaid fixed stars, when the day before it had been west of two of them. I therefore feared that Jupiter might, contrary to the astronomical computation, be moving direct, and so had passed ahead of those stars by its own motion.\footnote{Jupiter was then in retrograde motion, as the tables also predicted, moving westward against the fixed stars. Had it been moving direct, that is eastward, it could have overtaken the stars and come to appear east of them.}
p032.07: >-
  So I awaited the following night with the greatest longing; but my hope was disappointed, for the sky was covered with clouds on every side.
p033.01: >-
  On the 10th, however, the stars appeared in this position with respect to Jupiter:
p033.02: >-
  only two were present, and both eastern; the third, as I supposed, was hidden behind Jupiter.
p033.03: >-
  As before, they were in the same straight line with Jupiter, and placed exactly along the length of the zodiac.
p033.04: >-
  When I had seen this, and understood that such changes ⟦18r⟧ could by no means be ascribed to Jupiter, and moreover knew that the stars I was watching were always the same (for no others, either preceding or following, lay within a great interval along the length of the zodiac), then, turning my doubt into wonder, I found that the apparent change lay not in Jupiter but in the stars I had noted. I therefore judged that from then on I must observe more attentively and scrupulously.
p034.01: >-
  On the 11th, accordingly, I saw this arrangement:
p034.02: >-
  there were only two stars, both eastern; the middle one was three times as far from Jupiter as from the more eastern one, and the more eastern was almost twice as large as the other, although on the previous night they had looked nearly equal.
p034.03: >-
  I therefore established, and decided beyond all doubt, that there are in the heavens three stars wandering about Jupiter, like Venus and Mercury about the Sun. This was at length observed, clearer than midday light, in many later observations; and not only three, but four wandering stars complete their revolutions about Jupiter. The changes in their positions, observed afterwards with greater exactness, the following account will present. I also measured the intervals between them with the spyglass, in the manner explained above; and I have added the hours of the observations, especially when several were made on the same night, for the revolutions of these planets are so swift that even hour-to-hour differences can usually be perceived.
p035.01: >-
  On the 12th, then, at the first hour of the following night, I saw the stars disposed in this manner. The more eastern ⟦18v⟧ star was larger than the western, yet both were very conspicuous and bright; each was 2 minutes from Jupiter. A third little star also began to appear at the third hour, not seen at all before; it almost touched Jupiter on the eastern side, and was very small.
p035.02: >-
  All were in the same straight line and ranged along the length of the ecliptic.
p036.01: >-
  On the 13th, four little stars were seen by me for the first time, in this arrangement with respect to Jupiter:
p036.02: >-
  three were western and one eastern; they formed a nearly straight line, for the middle one of the western stars bent a little away from the line toward the north.
p036.03: >-
  The more eastern was 2 minutes from Jupiter; the intervals between the others and Jupiter were each only 1 minute.
p036.04: >-
  All the stars showed the same size, and, though small, they were very bright, and far more brilliant than fixed stars of the same size.
p037.01: >-
  On the 14th the weather was cloudy.
p038.01: >-
  On the 15th, at the third hour of the night, the four stars stood with respect to Jupiter in the arrangement drawn here:
p038.02: >-
  all were western and placed nearly in the same straight line; for the one counted third from Jupiter was raised a little ⟦19r⟧ toward the north. The one nearest Jupiter was the smallest of all, and the others appeared larger in turn. The intervals between Jupiter and the three following stars were all equal, of 2 minutes each; but the more western one was 4 minutes from its neighbor.
p038.03: >-
  They were very bright, and did not twinkle at all, just as they always appeared, both before and after.
p038.04: >-
  But at the seventh hour there were only three stars, in this aspect with respect to Jupiter:
p038.05: >-
  they were exactly in the same straight line; the one nearer Jupiter was very small, and separated from it by 3 minutes; from this the second was distant 1 minute; and the third from the second 4 minutes 30 seconds.
p038.06: >-
  After another hour, however, the two middle little stars were closer still: they were barely 30 seconds apart.
p039.01: >-
  On the 16th, at the first hour of the night, we saw three stars arranged in this order:
p039.02: >-
  two enclosed Jupiter between them, removed from it by 0 minutes 40 seconds on either side; the third, western, was 8 minutes from Jupiter.
p039.03: >-
  The two nearest Jupiter appeared not larger, but brighter than the more remote one.
p040.01: >-
  On the 17th, at hour 0 and 30 minutes after sunset, the configuration was of this kind:
p040.02: >-
  there was only one eastern star, 3 minutes from ⟦19v⟧ Jupiter; and likewise only one western, 11 minutes from Jupiter.
p040.03: >-
  The eastern one looked twice as large as the western; and there were no more than these two.
p040.04: >-
  But four hours later, that is, at about the fifth hour, a third began to emerge on the eastern side, which, I think, had earlier been joined with the first; and the position was this:
p040.05: >-
  The middle star, very close to the eastern one, was removed from it by only 20 seconds, and it declined a little toward the south from the straight line drawn through the outer stars and Jupiter.
p041.01: >-
  On the 18th, at hour 0 and 20 minutes after sunset, the appearance was this:
p041.02: >-
  the eastern star was larger than the western, and 8 minutes from Jupiter; the western was 10 minutes from Jupiter.
p042.01: >-
  On the 19th, at the second hour of the night, the arrangement of the stars was this:
p042.02: >-
  three stars were exactly in a straight line with Jupiter: one eastern, 6 minutes from Jupiter; between Jupiter and the first following western star lay an interval of 5 minutes; and this one was 4 minutes from the more western.
p042.03: >-
  I was then uncertain whether a little star lay between the eastern star and Jupiter, extremely close to Jupiter, so that it almost touched it.
p042.04: >-
  But at the fifth hour I saw it clearly, ⟦20r⟧ by then occupying exactly the middle place between Jupiter and the eastern star, so that the configuration was this:
p042.05: >-
  Moreover, the star seen last was very small; yet at the sixth hour it was nearly equal to the others in size.
p043.01: >-
  On the 20th, at hour 1 and 15 minutes, a similar arrangement was seen:
p043.02: >-
  there were three little stars so small that they could scarcely be perceived; they were no more than 1 minute from Jupiter or from one another. I was uncertain whether there were two or three little stars on the western side.
p043.03: >-
  About the sixth hour they were disposed in this way:
p043.04: >-
  the eastern one was twice as far from Jupiter as before, namely 2 minutes; the middle western one was 0 minutes 40 seconds from Jupiter, and 0 minutes 20 seconds from the more western.
p043.05: >-
  At last, at the seventh hour, three little stars were seen to the west:
p043.06: >-
  the one nearest Jupiter was 0 minutes 20 seconds from it; the interval between this and the more western was 40 seconds; and between these another was seen, bending a little toward the south, ⟦20v⟧ no more than 10 seconds from the more western.
p044.01: >-
  On the 21st, at hour 0 and 30 minutes, three little stars were present in the east, equally distant from one another and from Jupiter:
p044.02: >-
  the intervals were, by estimate, 50 seconds.
p044.03: >-
  There was also a star in the west, 4 minutes from Jupiter.
p044.04: >-
  The eastern one nearest Jupiter was the smallest of all; the others were somewhat larger, and very nearly equal to one another.
p045.01: >-
  On the 22nd, at hour 2, the arrangement of the stars was similar:
p045.02: >-
  from the eastern star to Jupiter the interval was 5 minutes, from Jupiter to the more western 7 minutes.
p045.03: >-
  The two intermediate western ones were 0 minutes 40 seconds apart; the one nearer Jupiter was 1 minute from it.
p045.04: >-
  The middle little stars themselves were smaller than the outer ones; they extended along the same straight line, along the length of the zodiac, except that the middle one of the three western stars bent a little toward the south.
p045.05: >-
  But at the sixth hour of the night they were seen in this arrangement:
p045.06: >-
  the eastern one was very small, distant from Jupiter, as before, 5 minutes.
p045.07: >-
  The three western ones were separated equally from Jupiter and from one another, and the intervals were each very nearly 1 minute 20 seconds; ⟦21r⟧
p045.08: >-
  and the star nearer Jupiter looked smaller than the two following; and all appeared placed exactly in the same straight line.
p046.01: >-
  On the 23rd, at hour 0 and 40 minutes after sunset, the arrangement of the stars was about as follows:
p046.02: >-
  there were three stars with Jupiter in a straight line along the length of the zodiac, as they always were: two were eastern, one western.
p046.03: >-
  The more eastern was 7 minutes from the next, this one 2 minutes 40 seconds from Jupiter, and Jupiter 3 minutes 20 seconds from the western; and all were nearly equal in size.
p046.04: >-
  But at the fifth hour the two stars that had been nearest Jupiter were no longer seen, hiding, I believe, behind Jupiter; and the appearance was this:
p047.01: >-
  On the 24th, three stars were seen, all eastern, and almost in the same straight line with Jupiter:
p047.02: >-
  for the middle one deviated slightly toward the south.
p047.03: >-
  The one nearer Jupiter was 2 minutes from it, the next 0 minutes 30 seconds from this, and the more eastern 9 minutes from this one; and all were very bright.
p047.04: >-
  But at the sixth hour only two stars ⟦21v⟧ presented themselves, in this position: exactly in the same straight line with Jupiter, the nearer being removed from it 3 minutes, the other 8 minutes from this one. The two middle little stars observed earlier had joined into one, if I am not mistaken.\footnote{The text describes two stars here, but the figure in the 1610 print shows only one. This edition reproduces the figure as printed.}
p048.01: >-
  On the 25th, at hour 1 and 40 minutes, the arrangement was as follows:
p048.02: >-
  there were only two stars, on the eastern side, and they were fairly large: the more eastern was 5 minutes from the middle one, and the middle one 6 minutes from Jupiter.
p049.01: >-
  On the 26th, at hour 0 and 40 minutes, the arrangement of the stars was of this kind:
p049.02: >-
  three stars were seen, of which two were eastern and the third western of Jupiter: this one was 5 minutes from it, while the eastern middle one was 5 minutes 20 seconds from Jupiter, and the more eastern 6 minutes from the middle one. They were set in the same straight line and were of the same size.
p049.03: >-
  Then at the fifth hour the arrangement was almost the same, differing only in this, that near Jupiter a fourth little star was emerging on the east, smaller than the rest, at that time 30 minutes from Jupiter,\footnote{So the Latin (“min.\ 30”). The figure shows the star close beside Jupiter, so 30 seconds is probably meant.} but raised a little toward the north from the straight line, as the accompanying figure shows:
p050.01: >-
  On the 27th, at hour 1 after sunset, only a single ⟦22r⟧ little star was seen, an eastern one, in this arrangement:
p050.02: >-
  and it was very small, and removed from Jupiter 7 minutes.
p051.01: >-
  On the 28th and 29th, because of intervening clouds, nothing could be observed.
p052.01: >-
  On the 30th, at the first hour of the night, the stars were seen arranged in this way:
p052.02: >-
  one was eastern, 2 minutes 30 seconds from Jupiter, and two were western, of which the one nearer Jupiter was 3 minutes from it, and the other 1 minute from this one. The outer ones and Jupiter were in the same straight line, but the middle star was raised a little toward the north. The more western was smaller than the others.
p053.01: >-
  On the last day of the month, at the second hour, two eastern stars and one western were seen:
p053.02: >-
  Of the eastern ones the middle was 2 minutes 20 seconds from Jupiter; the more eastern was 0 minutes 30 seconds from that middle one; the western was 10 minutes from Jupiter. They were very nearly in the same straight line, only the eastern one nearer Jupiter was raised a little toward the north.
p053.03: >-
  But at the fourth hour the two eastern ones were still closer ⟦22v⟧ to each other; for they were only 20 seconds apart.
p053.04: >-
  In these observations the western star appeared rather small.
p054.01: >-
  On the 1st of February, at the second hour of the night, the arrangement was similar:
p054.02: >-
  The more eastern star was 6 minutes from Jupiter, the western 8; on the eastern side a certain very small star was 20 seconds from Jupiter. They marked out an exactly straight line.
p055.01: >-
  On the 2nd the stars were seen in this order:
p055.02: >-
  Only one was eastern, 6 minutes from Jupiter; Jupiter was 4 minutes from the nearer western one; between this and the more western there was an interval of 8 minutes. They were exactly in the same straight line and of nearly the same size.
p055.03: >-
  But at the seventh hour there were four stars:
p055.04: >-
  among them Jupiter held the middle seat.
p055.05: >-
  The more eastern of these stars was 4 minutes from the next, and this one 1 minute 40 seconds from Jupiter; Jupiter was 6 minutes from the western one nearer to it, and this one 8 minutes from the more western. Likewise all were in the same straight line, extended along the length of the zodiac.
