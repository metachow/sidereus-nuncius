p023.01: >-
  Here I am glad to give the cause of another appearance of the Moon, one worthy of wonder. We observed it not recently but many years ago, and showed it to some close friends and pupils, explaining it and setting out its cause. Yet because the spyglass makes it easier to observe and more evident, I have judged that it belongs fittingly in this place, above all because it brings out more clearly the kinship and likeness between the Moon and the Earth.
p024.01: >-
  When the Moon is found not far from the Sun, whether before or after conjunction, not only does her globe present itself to our sight on the side adorned with the shining horns, but a faint, gleaming rim of the dark part as well, that is, the part turned away from the Sun, seems to trace her outline and to separate her from the darker field of the ether itself.\footnote{This is the “earthshine” (also called the ashen light): around the new Moon the part of the lunar face not directly lit by the Sun is still faintly visible. Galileo argues below that it comes from sunlight reflected by the Earth.}
p024.02: >-
  But if we examine the matter more closely, we shall see that not only the outermost edge of the dark part shines with an uncertain brightness, but that the whole face of the Moon, namely the part that does not yet feel the Sun’s splendor, is whitened by a light that is not slight. At first glance, however, only a thin circumference seems to shine, because of the darker parts of the sky next to it; the remaining surface, on the contrary, looks darker, because of its contact with the shining horns, which dim our sight.
p024.03: >-
  But suppose someone chooses a position such that the shining horns themselves are hidden by a roof, a chimney, or some other obstacle placed between the eye and the Moon (but far from the eye), while the rest ⟦14v⟧ of the lunar globe is left exposed to our view. Then he will find that this region of the Moon too, though deprived of sunlight, shines with no small light, and especially when the horror of night has already deepened in the Sun’s absence; for on a darker field the same light appears brighter.
p024.04: >-
  It has been found, moreover, that this second brightness of the Moon (so to call it) is greater the less she is distant from the Sun. As she moves away from him it fades more and more, so that after the first quadrature and before the second it is found weak and quite uncertain, even when viewed against a darker sky; whereas at the sextile and at smaller elongations, even in twilight, it shines wonderfully. It shines, I say, so much that with the help of a good spyglass the large spots can be distinguished in it.\footnote{Quadrature means the Moon and Sun are 90 degrees apart (first and last quarter); the sextile aspect means they are 60 degrees apart.}
p024.05: >-
  This marvelous glow has caused no small wonder among philosophers, and to account for it different people have put forward different explanations.
p024.06: >-
  Some have said that the splendor belongs to the Moon herself and is natural to her; others, that Venus bestows it on her; others, that all the stars do; others, that it comes from the Sun, whose rays pass through the deep solidity of the Moon.
p024.07: >-
  But claims of this kind are refuted with little effort and proved false.
p024.08: >-
  For if such light were the Moon’s own, or conferred by the stars, she would keep and display it above all in eclipses, when she is left in the darkest sky. This, however, contradicts experience: the glow that appears on the Moon in eclipses is far weaker, reddish and almost copper-colored, whereas this one is brighter and whiter.
p024.09: >-
  Moreover, the eclipse glow is changeable and moves about; it wanders over the face of the Moon, so that the part nearer to the circumference of the Earth’s shadow is always seen brighter, and the rest darker. From this we understand beyond all doubt that it happens because the Sun’s rays, ⟦15r⟧ touching in their neighborhood a certain denser region that surrounds the Moon in a ring, spread a kind of dawn into the neighboring parts of the Moon, just as on Earth a twilight glow is scattered both morning and evening. We shall treat this more fully in the book \textit{On the System of the World}.\footnote{The work Galileo announces never appeared under this title; his account of the Earth’s light on the Moon was given later in the \textit{Dialogue Concerning the Two Chief World Systems} (1632).}
p024.10: >-
  To assert that this light is bestowed by Venus is so childish that it does not deserve an answer.
p024.11: >-
  For who will be so ignorant as not to understand that, around conjunction and within the sextile aspect, it is wholly impossible for the part of the Moon turned away from the Sun to be seen by Venus?
p024.12: >-
  That it comes from the Sun, whose light penetrates and floods the deep solidity of the Moon, is equally unbelievable: for it would never diminish, since one hemisphere of the Moon is always lit by the Sun, except at the time of lunar eclipses; yet it does diminish as the Moon hastens toward quadrature, and it is wholly dulled once she has passed quadrature.
p024.13: >-
  Since, then, this secondary glow is neither born with the Moon and her own, nor borrowed from any stars or from the Sun, and since in the vastness of the universe no other body remains but the Earth alone, what, I ask, are we to think? What are we to put forward? That the lunar body itself, or anything else opaque and dark, is flooded with light by the Earth? What is so strange in that? Just so: with a fair and welcome exchange the Earth repays the Moon with an equal illumination, just such as she herself receives from the Moon almost the whole time in the deepest darkness of night.
p024.14: >-
  Let us make the matter plainer.
p024.15: >-
  At conjunctions the Moon, holding the middle place between the Sun and the Earth, is bathed by the Sun’s rays on her upper hemisphere, which is turned away from the Earth; her lower hemisphere, with which she looks at the Earth, is covered with darkness. She therefore does not light the Earth’s surface at all.
p024.16: >-
  As the Moon gradually moves away from the Sun, she is soon lit in part on the lower hemisphere that faces us; she turns toward us whitening horns, still slender, and lightly illuminates the Earth. The Sun’s illumination grows on the Moon ⟦15v⟧ as she now approaches quadrature; the reflection of her light increases on Earth; the brightness on the Moon extends beyond a semicircle, and our nights shine more brightly. At last the whole face of the Moon with which she looks at the Earth is irradiated by the opposite Sun with the clearest splendors; the surface of the Earth, flooded with lunar brilliance, gleams far and wide. Afterward, the waning Moon sends fainter rays to us, and the Earth is illuminated more weakly; the Moon hastens to conjunction, and black night takes hold of the Earth.
p024.17: >-
  Thus in this cycle the Moon’s radiance bestows on us month by month illuminations that are now brighter, now fainter; but the favor is repaid by the Earth in equal measure.
p024.18: >-
  For while the Moon is found beneath the Sun around conjunctions, she looks at the whole surface of the terrestrial hemisphere that is exposed to the Sun and lit by his vivid rays, and she receives the light reflected from it. Hence, from this reflection, her lower hemisphere, though deprived of sunlight, appears to shine not a little.
p024.19: >-
  The same Moon, removed from the Sun by a quadrant, sees only half of the illuminated terrestrial hemisphere, namely the western half; for the other, eastern half is darkened by night. So the Moon herself is less splendidly lit by the Earth, and her secondary light therefore looks fainter to us.
p024.20: >-
  If you place the Moon in opposition to the Sun, she will look at the hemisphere of the Earth between them, wholly dark and bathed in dim night. If such an opposition is ecliptic, therefore, the Moon will receive no illumination at all, being deprived of solar and terrestrial radiation together.
p024.21: >-
  In her other positions relative to the Earth and the Sun, she receives more or less light from the Earth’s reflection, according as she sees a larger or smaller part of the illuminated terrestrial hemisphere. For between these two globes this rule is kept: at the times when the Earth is most illuminated by the Moon, at those same times the Moon in turn ⟦16r⟧ is less illuminated by the Earth, and conversely.
p024.22: >-
  Let these few words on the matter suffice for the present place; for we shall say more in our \textit{System of the World}. There, by very many reasons and experiments, we shall show the very strong reflection of sunlight from the Earth to those who loudly insist that she be barred from the dance of the stars, chiefly because she is devoid of motion and of light. We shall demonstrate that she is a wandering body, surpassing the Moon in splendor, and not the sink of the world’s filth and dregs; and we shall confirm it also by six hundred natural reasons.
p025.01: >-
  So far we have spoken of the observations made on the lunar body; now let us briefly set forth what we have so far seen concerning the fixed stars.
p025.02: >-
  And first this is worth noting: when stars, fixed and wandering alike, are viewed with the spyglass, they do not appear enlarged in the same proportion in which other objects, and the Moon herself, gain in size. In the stars such an increase appears far smaller, so that a spyglass able to multiply other objects a hundredfold, for example, you would think barely makes the stars four or five times larger.
p025.03: >-
  The reason is that, when stars are viewed with the free and natural keenness of the eyes, they do not offer themselves to us in their plain and naked size, so to speak, but irradiated with certain glares and wearing twinkling rays like hair, especially when night has deepened. For this reason they look far larger than if they were stripped of those borrowed locks; for the visual angle is bounded not by the star’s own little body but by the splendor poured widely around it.
p025.04: >-
  You can understand this quite plainly from ⟦16v⟧ the fact that stars emerging in the first twilight at sunset look very small, even if they are of the first magnitude; and Venus herself, if she ever shows herself to us around midday, is seen so slight that she hardly seems to equal a little star of the last magnitude.
p025.05: >-
  It is otherwise with other objects, and with the Moon herself, which always looks the same in size, whether viewed in midday light or in the deepest darkness.
p025.06: >-
  So the stars are seen unshorn in the midst of darkness, but daylight can shave off their locks; and not that light alone, but also a thin cloud placed between the star and the eye of the observer. Black veils and colored glasses do the same: when they are held in the way, the glares poured around leave the stars.
p025.07: >-
  The spyglass does the same: it first removes the borrowed, accidental glares from the stars, and then enlarges their simple little globes (if indeed they are round in shape); and so they seem enlarged in a smaller ratio.
p025.08: >-
  For a little star of the fifth or sixth magnitude, seen through the spyglass, is presented as if of the first magnitude.
p026.01: >-
  The difference between the appearance of the planets and that of the fixed stars also seems worthy of remark.
p026.02: >-
  The planets show their little globes exactly round and sharply circumscribed, and appear as little moons, flooded with light all over; the fixed stars, however, are never seen bounded by a circular edge, but as a kind of glare darting rays all around and twinkling strongly. Through the spyglass they appear with the same kind of shape as to natural sight, but so much larger that a little star of the fifth or sixth magnitude seems to equal the Dog, the largest of all the fixed stars.\footnote{The Dog (Canis) is Sirius, α Canis Majoris, the brightest star in the whole sky.} ⟦16a\,r⟧
p026.03: >-
  But below stars of the sixth magnitude you will see through the spyglass such a numerous throng of others, which escape natural sight, as is hardly credible. You can see more than six further degrees of magnitude; the largest of these, which we may call of the seventh magnitude, or the first of the invisible, appear larger and brighter through the spyglass than stars of the second magnitude seen with natural sight.
p026.04: >-
  So that you may have one or two proofs of their almost unbelievable multitude, I have decided to add below the figures of two asterisms, so that from their example you may judge the rest.
p026.05: >-
  In the first I had resolved to draw the whole constellation of Orion; but overwhelmed by the immense abundance of stars and by lack of time, I put off this undertaking to another occasion. For more than five hundred stars stand near the old ones, scattered within a limit of one or two degrees. Therefore, to the three in the Belt and the six in the Sword, noted long ago, we have added eighty others newly seen in their neighborhood, and we have kept the intervals between them as exactly as we could. For the sake of distinction, we have drawn the known or ancient ones larger and outlined them with a double line; the others, inconspicuous, we have drawn smaller and marked with single lines. The differences of magnitude too we have preserved as far as we could.
p026.06: >-
  In the second example we have drawn the six stars of Taurus called the \tremph{Pleiades} (I say six, since the seventh almost never appears), enclosed within very narrow bounds in the sky, beside which lie more than forty others, invisible; none of them is distant from any of the aforesaid six by much more than half a degree. Of these we have recorded only thirty-six, and we have kept their intervals, magnitudes, and the distinction between old and new, as in Orion.
