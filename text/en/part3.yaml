p027.01: >-
  The third thing we have observed is the very essence, or matter, of the \tremph{Milky} Way, which with the help of the spyglass can be seen so plainly to the senses that all the disputes which for so many centuries have tormented philosophers are settled by eyewitness certainty, and we are freed from wordy quarrels.
p027.02: >-
  For the \tremph{Galaxy} is nothing other than a mass of innumerable stars planted together in clusters. Into whatever region of it you direct the spyglass, at once an immense crowd of stars shows itself to view, of which many seem quite large and very conspicuous; but the multitude of small ones is wholly beyond exploring.
p028.01: >-
  But since that milky whiteness, like that of a whitish cloud, is seen not only in the \tremph{Galaxy}, but many small patches of similar color shine faintly here and there through the ether, if you turn the glass on any of them you will come upon a crowd ⟦16b\,v⟧ of densely packed stars.
p028.02: >-
  Furthermore (and you will wonder at this more), the stars called \tremph{nebulous} by every astronomer up to this day are swarms of tiny stars set together in a marvelous way. From the mingling of their rays, while each one escapes the keenness of the eyes because of its smallness or its very great distance from us, that whiteness arises which has been believed until now to be a denser part of the sky, able to throw back the rays of stars or of the Sun.\footnote{Star catalogues since Ptolemy have listed as “nebulous stars” (\textit{stellae nebulosae}) several objects that appear to the naked eye as hazy patches.}
p028.03: >-
  We have observed some of them, and wished to append the asterisms of two.
