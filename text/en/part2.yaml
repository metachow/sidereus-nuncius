p015.01: >-
  On the fourth or fifth day after conjunction, when the Moon presents herself to us with bright horns, the boundary that divides the dark part from the luminous part does not run evenly along an oval line, as it would on a perfectly spherical solid; it is marked instead by an uneven, rough and very sinuous line, as the accompanying figure shows. For many bright protuberances, so to speak, extend beyond the border of light and darkness into the dark part, and conversely little dark portions enter into the light.
p015.02: >-
  Indeed, a great number of small blackish spots, ⟦8r⟧ wholly separated from the dark part, are scattered everywhere over nearly the whole region already flooded with sunlight, except only for that part which is occupied by the large and ancient spots.
p015.03: >-
  We have noted, moreover, that the small spots just mentioned always and all agree in this: they have their blackish part facing the place of the Sun, while on the side opposite the Sun they are crowned with brighter borders, like glowing ridges.
p015.04: >-
  And we have an altogether similar sight on the Earth around sunrise, when we behold the valleys not yet flooded with light, while the mountains that surround them on the side away from the Sun are already shining with splendor. And just as the shadows of the hollows on Earth grow smaller as the Sun climbs higher, so these spots on the Moon lose their darkness as the luminous part grows.
p016.01: >-
  But not only are the borders of light and darkness on the Moon seen to be uneven and winding; what causes still greater wonder is that very many bright points appear within the dark part of the Moon, entirely divided and torn away from the illuminated region and separated from it by no small interval. After some time these gradually increase in size and brightness, and after two or three hours they are joined to the rest of the bright part, which has by then grown larger. Meanwhile, however, others and still others, sprouting as it were here and there, are kindled within the dark part, grow, and at last are linked to the same luminous surface, now extended further.
p016.02: >-
  The same figure gives us an example of this.
p016.03: >-
  On the Earth, before sunrise, while shadow still holds the plains, are not the summits of the highest mountains lit by the Sun’s rays?
p016.04: >-
  After a short interval does not the light spread, as the middle and broader parts of those same mountains are illuminated; and finally, once the Sun has risen, do not the illuminated parts of the plains and hills join together?
p016.05: >-
  But the differences between such elevations and hollows on the Moon appear to exceed the roughness of the Earth by a very wide margin, as we shall demonstrate below.
p016.06: >-
  Meanwhile I shall by no means pass over in silence something worthy of notice that I observed while the Moon was hastening toward her first quarter, whose image the same drawing set above also shows. A huge dark gulf cuts into the luminous part, situated toward the lower horn. I had watched this gulf for a good while and had seen it entirely dark, when at last, after almost two hours, a certain luminous peak began to rise a little below the middle of the hollow. Growing little by little, it took on a triangular shape, and it was still wholly torn away and separated from the luminous face. Soon three other small points ⟦9r⟧ began to shine around it, until, as the Moon was now heading toward setting, that triangular shape, extended and by now grown larger, was joined to the rest of the luminous part, and, still surrounded by the three bright peaks just mentioned, it burst into the dark gulf like a huge promontory.
p016.07: >-
  At the extreme horns too, the upper as well as the lower, certain brilliant points emerged, wholly detached from the rest of the light, as can be seen depicted in the same figure.
p016.08: >-
  There was also a great abundance of dark spots in each horn, but most in the lower one. Of these, the larger and darker appear to be those nearer to the boundary of light and darkness, while the more remote ones are less dark and more faded.
p016.09: >-
  Yet always, as we also mentioned above, the blackish part of a spot faces the place from which the Sun shines, while a brighter rim surrounds the blackish spot on the side turned away from the Sun and facing the dark region of the Moon.
p016.10: >-
  This lunar surface, where it is marked with spots like the blue eyes of a peacock’s tail, is made quite like those little glass vessels which, plunged into cold water while still hot, acquire a cracked and wavy surface, whence the common people call them ice cups.\footnote{The Latin is \textit{glaciales cyathi}, literally “ice cups”: plunging hot glass into cold water so that its surface crazes all over (“ice glass”) was a technique of the sixteenth-century Venetian glassmakers.}
p016.11: >-
  But the large spots of the Moon are not seen to be broken up in a similar way, nor crowded with hollows and elevations; they are rather more even and uniform, and only here and there abound in some brighter patches. Thus, if anyone wished to revive the old opinion of the Pythagoreans, that the Moon is, as it were, another Earth, her brighter part would represent the land surface more fittingly and her darker part the watery one. As for me, I have never doubted that if the terrestrial globe were seen from afar, flooded with the rays of the Sun, it would present to view a brighter land surface and a darker watery surface ⟦9v⟧.
p016.12: >-
  Furthermore, the large spots on the Moon are seen to lie lower than the brighter regions. For on the Moon, whether waxing or waning, along the boundary of light and darkness there always project, here and there around the large spots themselves, the adjoining borders of the brighter part, as we noticed in drawing the figures. And the borders of the spots mentioned are not only lower but more even, and are not interrupted by wrinkles or ruggedness.
p016.13: >-
  The brighter part, on the other hand, stands highest near the spots; so much so that both before the first quarter and at about the second quarter itself, around a certain spot occupying the upper, that is northern, region of the Moon, certain huge elevations rise very high, both above and below it, as the accompanying drawings show.
p017.01: >-
  This same spot, before the second quarter, is seen walled round by certain darker borders which, like the highest ridges of mountains, appear darker on the side away from the Sun, and on the side facing the Sun stand out brighter. The opposite happens in the hollows, whose part away from the Sun appears shining, while the part on the Sun’s side is dark and shadowed.
p017.02: >-
  Then, when the luminous surface has diminished, as soon as almost the whole of the said spot has been covered with darkness, the brighter ridges of the mountains rise high into the darkness.
p017.03: >-
  The following figures show this twofold appearance.
p018.01: >-
  There is one thing more that I shall by no means consign to oblivion, which I noted not without some wonder. Almost the middle of the Moon is occupied by a cavity larger than all the rest and perfectly round in shape. I viewed it near both quarters, and in the second figures set above I reproduced it as well as I could.\footnote{The “second figures” are the two drawings on [9v] and [10r] (the first being the one on [8r]), which show the Moon near first and last quarter; the great round cavity lies at the boundary of light in both, and it can be seen again in the lower drawing on [10v].} As to shadow and illumination it gives just the appearance that a region like Bohemia\footnote{Bohemia: the western part of the present Czech Republic, a basin ringed by mountains.} would give on Earth, if it were shut in on every side by very high mountains arranged along the circumference of a perfect circle. On the Moon, indeed, it is walled round by ridges so lofty that the outermost rim, adjoining the dark part of the Moon, is seen flooded with the Sun’s light before the boundary of light and shadow reaches the middle diameter of that very figure.
p018.02: >-
  As with the other spots, its shadowed part faces the Sun, while its luminous part lies toward the Moon’s darkness. This I am glad to point out for the third time, as the firmest argument for the roughness and unevenness spread over the whole brighter region of the Moon. Of these spots, those that adjoin the border of light and darkness are always the blacker, while the more remote ones appear both smaller and less dark; so that at last, when the Moon at opposition has filled her entire disc, the darkness of the hollows is set apart from the whiteness of the elevations only by a small and very slight difference.
p019.01: >-
  What we have recounted is observed in the brighter regions of the Moon. But in the large spots there is not seen such a difference of hollows and elevations as we are necessarily compelled to posit in the brighter part, on account of the change of shapes under ever different illumination by the Sun’s rays, according as the Sun looks upon the Moon from many positions. In the large spots there do indeed exist ⟦11v⟧ some rather darker patches, as we noted in the figures; yet these always present the same appearance, nor is their darkness intensified or lessened, but with a very slight difference they appear now a little darker and now a little brighter, as the solar rays fall upon them more or less obliquely. Moreover they are joined to the neighboring parts of the spots by a gentle transition, their borders mingling and blending. It is otherwise with the spots occupying the brighter surface of the Moon; for, like sheer cliffs studded with rough and jagged rocks, they are sharply marked off, as if by a ruled line, by stark contrasts of shadow and light.
p019.02: >-
  Besides, within these same large spots some patches are seen that are brighter, and a few even very bright. But both these and the darker ones always have the same appearance, with no change of shape or of light or of darkness. So it is established beyond doubt that they appear because of a true dissimilarity of their parts, and not merely because of unevenness in the shapes of those same parts, which would shift their shadows in various ways under the Sun’s varying illumination. That indeed is what happens with the other, smaller spots occupying the brighter part of the Moon; for from day to day they change, grow, diminish and vanish, since they originate only from the shadows of elevations.
p020.01: >-
  But I sense that many here are seized by a great doubt, and beset by so grave a difficulty that they are compelled to call into question the conclusion already explained and confirmed by so many appearances.
p020.02: >-
  For if that part of the lunar surface which throws back the solar rays more brilliantly is full of windings, that is, of countless swellings and hollows, why is it that on the waxing Moon the outermost circumference, which looks toward the west, and on the waning Moon the other, eastern semicircumference, and at ⟦12r⟧ full moon the whole periphery, is seen not uneven, rough and winding, but exactly round, as if drawn with a compass, and eaten away by no swellings or cavities? And this is all the more puzzling because the entire limb consists of the brighter substance of the Moon, which we have said is wholly knobby and pitted; for none of the large spots extends all the way to the outermost perimeter, but all are seen gathered far from the rim.
p020.03: >-
  Of this appearance, which gives occasion for so grave a doubt, I offer a twofold cause, and accordingly a twofold solution of the doubt.
p020.04: >-
  First, if the swellings and hollows in the lunar body stretched along one circumference only, the circle that bounds the hemisphere visible to us, then the Moon could indeed, and even would have to, show herself to us in the guise of a toothed wheel, bounded, that is, by a knobby and winding outline. But if not one series of elevations alone, arranged along a single circumference only, but very many ranks of mountains, with their pits and windings, are ordered around the outermost rim of the Moon, and these not only on the visible hemisphere but also on the one turned away from us (yet near the dividing line of the hemispheres), then the eye looking from afar will not be able at all to detect the differences of elevations and hollows. For the gaps between mountains disposed in the same circle or the same series are hidden by the interposition of other elevations set in other and still other ranks; and this especially if the eye of the observer is placed in the same straight line with the summits of the said elevations.
p020.05: >-
  So on the Earth the ridges of many mountains close together appear to lie in a flat surface, if the observer is far away and stationed at the same height.
p020.06: >-
  So in a stormy sea the lofty crests of the waves seem stretched along ⟦12v⟧ one and the same plane, although among the billows there is a very great number of chasms and troughs, so deep that not only the keels of tall ships but even their sterns, masts and sails are hidden among them.
p020.07: >-
  Since, therefore, on the Moon itself, and around her perimeter, there is a manifold arrangement of elevations and hollows, and the eye, looking from far away, is placed almost in the same plane as their summits, it should astonish no one that to the visual ray grazing them they offer themselves along an even line, not winding in the least.
p020.08: >-
  To this reasoning a second can be joined: namely, that around the lunar body, as around the Earth, there is a sphere of substance denser than the rest of the aether, which is able to receive and reflect the Sun’s irradiation, though it is not so opaque as to bar the passage of sight (especially when it is not illuminated).
p020.09: >-
  This sphere, lit by the solar rays, makes the lunar body appear in the guise of a larger globe, and it could stop our sight from reaching the solid body of the Moon, if it were deeper; and deeper it indeed is around the Moon’s periphery. Deeper, I say, not absolutely, but relative to our rays, which cut through it obliquely. Accordingly it can bar our sight, particularly when it is luminous, and cover the periphery of the Moon exposed to the Sun.
p020.10: >-
  This is understood more clearly in the accompanying figure, in which the lunar body ABC ⟦13r⟧ is surrounded by a vaporous sphere DEG. The eye at F reaches the middle parts of the Moon, such as A, through the less deep vapors DA; but toward the outermost edge the greater depth of vapors EB shuts off our sight with its boundary.
p020.11: >-
  A sign of this is that the part of the Moon flooded with light appears to have a wider circumference than the rest of the dark orb. Someone may perhaps think this same cause a reasonable explanation why the larger spots of the Moon are not seen to extend anywhere all the way to the outermost edge, although it is plausible that some are to be found near it too; yet it seems credible that they are invisible because they are hidden beneath a deeper and brighter mass of vapors.
p021.01: >-
  That the brighter surface of the Moon is everywhere sprinkled with swellings and hollows, I think is made sufficiently plain by the appearances already explained.
p021.02: >-
  It remains for us to speak of their sizes, showing that terrestrial roughnesses are far smaller than the lunar ones; smaller, I say, even speaking absolutely, and not merely in proportion to the sizes of their respective globes. And this is plainly shown as follows.
p022.01: >-
  Since I have often observed, in various positions of the Moon relative to the Sun, some peaks within the dark part of the Moon, though quite far from the boundary of light, appearing flooded with light, I compared their distance with the whole diameter of the Moon and found that this interval sometimes exceeds a twentieth part of the diameter.
p022.02: >-
  This granted, let a lunar globe be conceived, whose great circle is CAF, its center E, and its diameter CF, which is to the diameter of the Earth as two to seven. And since the terrestrial diameter, according to more exact observations, contains 7000 Italian miles,\footnote{Italian miles: in Galileo’s day the mile varied in length from one Italian state to another, roughly 1.5 to 1.7 km. The modern ratio of the Moon’s diameter to the Earth’s is about 3 to 11, so Galileo’s 2 to 7 is quite close.} CF will be 2000 and CE ⟦13v⟧ 1000; and a twentieth part of the whole of CF is 100 miles.
p022.03: >-
  Now let CF be the diameter of the great circle dividing the luminous part of the Moon from the dark (for on account of the very great distance of the Sun from the Moon, this circle does not differ perceptibly from a great circle), and let A be distant from the point C by a twentieth part of it; and let the radius EA be drawn, and extended until it meets the tangent GCD (which represents the illuminating ray) at the point D.
p022.04: >-
  The arc CA, or the straight line CD, will therefore be 100, of which parts CE is 1000, and the sum of the squares of DC and CE is 1010000, to which the square of DE is equal. The whole of ED will therefore be more than 1004, and AD more than 4 of such parts as CE was 1000.\footnote{That is, by the Pythagorean theorem, $\mathrm{DE}=\sqrt{1000^2+100^2}\approx 1004.99$, so $\mathrm{AD}=\mathrm{DE}-\mathrm{EA}\approx 4.99$; Galileo takes only the lower bound, “more than 4”.}
p022.05: >-
  The height AD on the Moon, which marks some peak raised all the way up to the Sun’s ray GCD and removed from the boundary C by the distance CD, is therefore more ⟦14r⟧ than 4 Italian miles.
p022.06: >-
  But on the Earth there are no mountains that come even close to a perpendicular height of one mile; it therefore remains evident that the lunar elevations are loftier than the terrestrial ones.
