p023.01: >-
  ここで、月に見られるもう一つの驚くべき現象について、その原因を述べておきたい。これはわれわれが最近見つけたものではなく、何年も前に観測して、親しい友人や弟子たちに見せ、その成り立ちを説明し、原因を明らかにしたことがある。ただ、遠眼鏡の助けを借りれば観測はいっそう容易になり、いっそうはっきりするので、ここに載せるのも不適当ではないと考えた。とりわけ、月と地球とのあいだの親近性と相似がより明らかになるからである。
p024.01: >-
  月が\ruby{合}{ごう}の前でも後でも太陽からそう遠くない所にあるとき、われわれの目に見えるのは、輝く角で飾られた側の月面だけではない。太陽に背を向けた暗い部分の縁にも、淡くほのかに光る細い輪郭があって、月の円盤の形を描き出し、アイテールそのもののより暗い背景から切り離しているように見える。\footnote{これは「地球照」である。新月の前後には、太陽の光が直接当たらない月面の部分も、かすかに見える。ガリレオは以下で、これが地球に反射した太陽光によることを論じる。}
p024.02: >-
  しかし、もう少し念入りに見るなら、暗い部分のもっとも外側の縁が不確かな明るさで光っているだけではなく、月の顔全体、すなわちまだ太陽の輝きを受けていない側のすべてが、弱くはない光で白く見えることに気づくであろう。それでも一見したところでは、ごく細い周縁だけが光って見える。隣り合う空の部分がそれより暗いからである。残りの表面は、これとは逆に、いっそう暗く見える。目をくらませる輝く角に接しているからである。
p024.03: >-
  ところが、目と月とのあいだにある（ただし目からは遠く離れた）屋根や煙突、あるいは何か別の障害物によって輝く角そのものが隠され、⟦14v⟧月の球の残りの部分は視野に残る、という位置を選ぶならば、太陽の光を欠いているこの月面の領域も、かなり強い光で輝いているのがわかるであろう。とくに、太陽がいないために夜の闇がすでに深まっているときには、それがきわだつ。同じ光でも、より暗い背景の中ではいっそう明るく見えるからである。
p024.04: >-
  さらに、この月の第二の明るさ（と呼んでおく）は、月が太陽から離れていないほど強いことが確かめられている。太陽からの隔たりが増すにつれて光はしだいに弱まり、上弦のあとから下弦の前までのあいだでは、より暗い空の中で見ても、弱くてごくおぼろげにしか認められない。ところが、離角が60度かそれより小さいときには、たとえ薄明のうちであっても、驚くほどに輝く。いや、あまりに輝くので、精確な遠眼鏡を使えば、その中に大きな斑点を見分けることさえできるのである。\footnote{上弦・下弦は、原文では「第一の\ruby{矩}{く}」「第二の矩」（\textit{quadratura}）、すなわち月と太陽の離角が90度になる位置である。「離角が60度」と訳したところは、原文では「六分」（\textit{sextilis}）と呼ばれる位置で、両者の離角が60度になる配置をいう。}
p024.05: >-
  この不思議な輝きは、哲学する人々に少なからぬ驚きを与えた。その原因を示すために、人々はそれぞれに違った説を持ち出してきた。
p024.06: >-
  ある人々は、その輝きは月自身に固有のもの、生まれつきのものだと言った。金星から月に与えられたのだと言う人々もあり、すべての星からだと言う人々もあった。太陽から来るのであって、太陽の光線が月の深い堅固な実体を貫くのだと言う人々もあった。
p024.07: >-
  しかし、こうした説は、さしたる労もなく\ruby{論駁}{ろんばく}され、誤りであることが明らかになる。
p024.08: >-
  この光が月に固有のものであるか、星々から与えられたものであるなら、月がもっとも暗い空の中に置かれる月食のときに、とりわけこの光を保って見せるはずである。ところがこれは経験に反する。月食のとき月面に現れる光は、はるかに弱く、赤みを帯びて、銅のような色をしている。いま問題の光は、それよりずっと明るく、白い。
p024.09: >-
  そのうえ、月食の光は変化し、場所を変える。月の面をさまよい、地球の影の円周に近い部分がつねにいっそう明るく、残りの部分は暗く見える。このことから、疑いなく、次のことが起こっているとわかる。すなわち、⟦15r⟧月をぐるりと取り巻くやや濃密な領域に太陽の光線が近づいて触れ、その接触によって、一種の\ruby{曙光}{しょこう}が月の近くの領域に広がるのである。それは、地上で朝にも夕にも薄明の光が広がるのと変わりない。このことについては、『世界の体系について』という書物で、もっと詳しく論じることにする。\footnote{ガリレオが予告したこの著作は、この題では刊行されなかった。月面に及ぶ地球の光についての彼の議論は、のちに『天文対話』（1632年）で述べられた。}
p024.10: >-
  この光が金星から与えられたと主張することは、子供じみていて、答えるにも値しない。
p024.11: >-
  合のころ、また離角が60度以内のときに、月の太陽に背を向けた側が金星から見られることなどまったくありえないと、わからないほど無知な者がいるだろうか？
p024.12: >-
  また、太陽の光が月の深い堅固な実体を貫いて満たすのだというのも、同じく考えがたい。もしそうなら、この光は決して減ることがないはずだからである。月食のときを除けば、月の半球はつねに太陽に照らされているのだから。ところが実際には、月が弦に向かって急ぐにつれてこの光は減り、弦を過ぎてしまうと、すっかり鈍くなる。
p024.13: >-
  こうして、この第二の輝きは、月に生まれつき備わった固有のものでもなく、どんな星からも太陽からも借りたものでもない。しかも、この広大な世界には、もはや地球のほかに残っている天体は一つもない。ならば、いったい何を考えるべきか？　何を言うべきか？　月の本体そのもの、あるいは何か不透明で暗い別の物体が、地球から光を注がれるというのか？　それのどこが不思議だろうか？　まさしくそのとおりなのである。地球は、公平で喜ばしい交換によって、月に同じだけの照明を返しているのだ。それは、地球自身が、夜のもっとも深い闇のなかで、ほとんどいつも月から受け取っている照明と等しい。
p024.14: >-
  事柄をもっとはっきりさせよう。
p024.15: >-
  合のとき、月は太陽と地球のあいだの位置にあり、地球に背を向けた上の半球に太陽光線を浴びている。地球を見ている下の半球は闇に覆われている。したがって、地球の表面をまったく照らさない。
p024.16: >-
  月が太陽からしだいに離れると、やがて地球に向いた下の半球の一部が照らされ、白く輝く角を、まだ細いながらもわれわれのほうへ向けて、地球をかすかに照らす。⟦15v⟧月が上弦に近づくにつれて月の太陽による照明は増し、地上ではその光の反射が強まる。月の輝きは半円を超えて広がり、われわれの夜はいっそう明るく輝く。ついには、月が地球を見ている顔の全体が、反対側にある太陽からもっとも明るい光を浴び、月の輝きに満たされた地球の表面が遠く広く照り映える。その後、欠けてゆく月はより弱い光線をわれわれに送り、地球はより弱く照らされる。月は合へと急ぎ、暗黒の夜が地球を覆う。
p024.17: >-
  こうして、このような周期のなかで、月の輝きは交互に、毎月の照明を、あるときは明るく、あるときは弱くわれわれに恵んでくれる。しかし、この恩恵に、地球は等しい重みで報いているのである。
p024.18: >-
  月が合のころに太陽の下にあるとき、月は、太陽に向いて強い光線に照らされている地球の半球の表面全体を見て、そこから反射した光を受け取る。したがって、この反射によって、月の下の半球は、太陽の光を欠いているにもかかわらず、かなり明るく輝いて見える。
p024.19: >-
  同じ月が太陽から四分円（90度）だけ離れると、地球の照らされた半球の半分、すなわち西の半分しか見えない。東の残り半分は夜によって暗くなっているからである。したがって、月自身も地球によってそれほど輝かしくは照らされず、その第二の光はわれわれにはいっそう弱く見える。
p024.20: >-
  また、月を太陽に対して衝の位置に置けば、月は、両者のあいだにある地球の、まったく暗く、闇夜に浸された半球を見ることになる。したがって、この衝が月食となるものであれば、月は太陽の光も地球の光も同時に欠いて、いかなる照明もまったく受けない。
p024.21: >-
  地球や太陽に対するその他さまざまな位置では、月が見る地球の照らされた半球の部分が大きいか小さいかに応じて、地球の反射する光を多くも少なくも受け取る。この二つの球体のあいだには、次のような規則が守られているからである。すなわち、地球が月からもっとも強く照らされる時期には、⟦16r⟧逆に月が地球から照らされることは弱く、その反対もまた同じである。
p024.22: >-
  この問題についてここで述べるのは、これだけで足りるとしよう。詳しくは『世界の体系』で述べるからである。そこでは、非常に多くの論拠と実験によって、地球が太陽の光を強く反射することを、地球を星々の輪舞から締め出すべきだと言いふらす人々に示すであろう。彼らがそう主張するのは、おもに、地球には運動も光もないからである。われわれは、地球がさまよう星であり、その輝きは月にまさること、世界の汚物や\ruby{滓}{かす}の吹き\ruby{溜}{だ}まりではないことを、証明するであろう。さらに六百もの自然学上の論拠によって、これを確かめるであろう。
p025.01: >-
  ここまで、月について行った観測を述べた。次に、恒星についてこれまでに見たことを、手短に述べよう。
p025.02: >-
  まず注意に値するのは、次のことである。恒星も惑星も、遠眼鏡を使って見たとき、他の対象や月自身が大きさを増すのと同じ比率では、決して大きくならないように見える。星ではこの拡大ははるかに小さい。たとえば、他の対象を百倍に拡大できる遠眼鏡でも、星はせいぜい四、五倍にしか拡大しないと思えるほどである。
p025.03: >-
  その理由は、次のとおりである。星を、何にも妨げられない自然のままの目の力で見るとき、星は、いわば単純でむきだしの大きさでわれわれの前に現れるのではなく、ある種のぎらつく輝きに包まれ、きらめく光線を髪のようにまとっている。夜が深まったときには、とりわけそうである。そのため星は、このように外から付け加わった髪を取り去った場合よりも、はるかに大きく見える。視角を限っているのは、星の本来の小さな体ではなく、そのまわり一面に広がった輝きだからである。
p025.04: >-
  このことは、次の事実からたやすくわかる。⟦16v⟧日没の最初の薄明のうちに現れる星は、たとえ一等星であってもごく小さく見える。金星自身も、正午ごろにわれわれの目に姿を現すことがあれば、きわめて小さく見え、もっとも小さい等級の星にようやく並ぶかどうかというほどである。
p025.05: >-
  他の対象では、また月自身でも、そうはならない。月は、真昼の光の中で見ても、もっとも深い闇の中で見ても、いつも同じ大きさに見える。
p025.06: >-
  したがって、星は暗闇のただなかでは、刈られていない髪のまま見える。ところが、昼の光はその髪を\ruby{剃}{そ}り落とすことができる。この光だけでなく、星と見る人の目とのあいだに置かれた薄い雲も同じである。黒い布や色ガラスも同じ働きをする。これらを目の前にかざして間に挟むと、星を取り巻いていた輝きは星から去ってしまう。
p025.07: >-
  遠眼鏡も同じことをする。まず星から外から付け加わった偶然の輝きを取り去り、そのうえで、星の単純な小さな球を拡大する（もっとも、それが球形であるならばだが）。それゆえ星は、より小さい倍率で拡大されたように見えるのである。
p025.08: >-
  実際、五等か六等の小さな星が、遠眼鏡で見ると、一等星のように見える。
p026.01: >-
  惑星と恒星とでは見え方に違いがあることも、述べておくに値すると思われる。
p026.02: >-
  惑星は、その小さな球をまったく丸く、コンパスで描いたように見せ、あたかも全面に光を浴びた小さな月のように円い。ところが恒星は、円い周縁で限られているようには決して見えず、むしろあたり一面に光線を震わせ、盛んにまたたく輝きのように見える。遠眼鏡を通して見ても、肉眼で見るときと同様の形を示すが、ずっと大きいので、五等か六等の小さな星が、全恒星のなかで最大の「犬」に等しく見えるほどである。\footnote{「犬」（Canis）はシリウス、すなわちおおいぬ座α星で、全天でもっとも明るい恒星である。}⟦16a\,r⟧
p026.03: >-
  しかも、六等星より下に、肉眼から逃れている他の星々のきわめて数多い群れが、遠眼鏡を通して見えて、ほとんど信じがたいほどである。六つ以上の等級の違いを、さらに見分けることができる。そのうちで大きなもの、すなわち七等星、あるいは見えない星の第一等とも呼べるものは、遠眼鏡のおかげで、肉眼で見た二等星よりも大きく、明るく見える。
p026.04: >-
  これらの星の、ほとんど信じられないほどの多さについて、一つか二つの証拠を示すために、二つの星群の図を下に添えることにした。これらを例として、他の星についても判断してほしい。
p026.05: >-
  第一の図では、オリオン座全体を描くつもりでいた。しかし星があまりに多く、時間はあまりに乏しいので、圧倒されて、この企てを別の機会に延ばした。古くから知られた星々のまわり、一度か二度の範囲のなかに、五百を超える星が散らばって並んでいるのである。そこで、ずっと以前から記録されていた帯の三つの星と剣の六つの星に、その近くで新たに見た八十の星を加えた。星と星との間隔は、できるかぎり正確に保った。区別のために、既知の星、つまり古くからの星は大きく描き、二重の線で縁取った。目立たないほかの星は小さく描き、一重の線で記した。等級の違いも、できるだけ保った。
p026.06: >-
  もう一つの例では、おうし座にある六つの星、\tremph{プレアデス}（すばる）と呼ばれるものを描いた（六つと言うのは、七つ目はほとんど見えないからである）。これらは天空のきわめて狭い範囲に閉じこめられており、そのそばに、見えない星が四十以上ある。そのどれも、上記の六つのどれかから半度をわずかに超えるほども離れていない。これらのうち、われわれは三十六だけを記した。その間隔、等級、および古い星と新しい星との区別は、オリオン座の場合と同じように保った。
f16ar.2: |-
  \vspace{1.5\baselineskip}
  {\centering \tremph{オリオン}の帯と剣の星群\par}
f16br.1: |-
  {\centering \tremph{プレアデスの星座}\par}
p027.01: >-
  第三にわれわれが観測したのは、\tremph{銀河}（天の川）そのものの本質、すなわち素材である。遠眼鏡のおかげで、これは感覚ではっきりと見ることができるので、幾世紀にもわたって哲学者たちを苦しめてきたあらゆる論争は、目で見た確実さによって片がつき、われわれは言葉ばかりの議論から解放される。
p027.02: >-
  すなわち、\tremph{銀河}とは、無数の星が塊になって密に植えられた集まりにほかならない。そのどの部分に遠眼鏡を向けても、ただちにおびただしい数の星が目の前に現れる。そのうちの多くはかなり大きく、はっきりと目につく。しかし小さな星の数となると、およそ調べつくすことができない。
p028.01: >-
  ところで、あの乳のような白さは、雲が白く見えるようなものだが、\tremph{銀河}にだけ見られるのではない。同じような色の小さな領域が、アイテールのあちこちに散らばって淡く光っている。そのどれにでも遠眼鏡を向けるなら、⟦16b\,v⟧密集した星の群れに出会うであろう。
p028.02: >-
  さらに（これにはもっと驚くであろう）、今日にいたるまで、あらゆる天文学者から\tremph{星雲状}と呼ばれてきた星は、驚くべきやり方で寄り集まった小さな星の群れである。その一つ一つは、小さいため、あるいはわれわれから非常に遠く離れているために、目の力から逃れてしまうが、その光線が混じりあうことから、あの白さが生まれる。この白さは、これまで、星や太陽の光線をはね返すことのできる天空のより濃密な部分だと信じられてきた。\footnote{プトレマイオス以来の星表は、肉眼ではぼんやりした光の斑点に見えるいくつかの天体を「星雲状の星」（\textit{stellae nebulosae}）として載せている。}
p028.03: >-
  われわれはそのうちのいくつかを観測し、そのうち二つについて、星群の図を添えたいと思った。
