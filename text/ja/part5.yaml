p056.01: >-
  3日、第7時には、星は次のように並んでいた。東の星は木星から1分30秒離れ、⟦23r⟧木星にもっとも近い西の星は2分離れていた。この星からさらに西の星は10分離れていた。三つは正確に同じ直線上にあり、大きさは等しかった。
p057.01: >-
  4日、第2時には、木星のまわりに四つの星があった。東に二つ、西に二つで、次の図のように、寸分違わず同じ直線上に並んでいた。
p057.02: >-
  もっとも東の星は次の星から3分、この星は木星から40秒離れていた。木星は西のもっとも近い星から4分、この星はさらに西の星から6分離れていた。
p057.03: >-
  大きさはほぼ等しかったが、木星にもっとも近い星は、ほかよりやや小さく見えた。
p057.04: >-
  ところが第7時には、東の二つの星は30秒しか離れていなかった。
p057.05: >-
  木星は東の近いほうの星から2分、西の次の星から4分、この星はさらに西の星から3分離れていた。どれも等しい大きさで、黄道に沿って伸びる同じ直線上にあった。
p058.01: >-
  5日、空は曇っていた。
p059.01: >-
  6日には、二つの星だけが現れ、⟦23v⟧木星をあいだにはさんでいた。添えた図に示すとおりである。東の星は木星から2分、西の星は3分離れていた。木星とともに同じ直線上にあり、大きさは等しかった。
p060.01: >-
  7日には、二つの星が木星のそばにあり、どちらも木星の東にあって、次のように並んでいた。
p060.02: >-
  二つの星どうしの間隔と、これらと木星との間隔は等しく、いずれも1分であった。そして二つの星と木星の中心とを、一本の直線が貫いていた。
p061.01: >-
  8日、第1時には、三つの星が現れ、すべて東にあった。図に示すとおりである。
p061.02: >-
  木星にもっとも近い星はかなり小さく、木星から1分20秒離れていた。中間の星は、この星から4分離れていて、かなり大きかった。もっとも東の星はきわめて小さく、中間の星から20秒離れていた。
p061.03: >-
  木星にもっとも近い星が一つの小さな星なのか、二つなのか、私は判断に迷った。ときどき、その東側にもう一つ、驚くほど小さな星がそばにあるように見え、それは最初の星から10秒しか離れていなかったからである。すべては獣帯に沿って伸びる同じ直線上にあった。
p061.04: >-
  第3時には、木星にもっとも近い星はほとんど木星に触れんばかりであった。木星から10秒しか離れていなかったのである。ほかの星は木星からいっそう遠ざかっていた。中間の星は木星から6分離れていた。
p061.05: >-
  ついに第4時には、それまで木星にもっとも近かった星は木星と一つになり、もう見えなくなっていた。
p062.01: >-
  9日、第0時30分には、木星のそばに東の星が二つ、⟦24r⟧西の星が一つあり、次のように並んでいた。
p062.02: >-
  もっとも東の星はかなり小さく、次の星から4分離れていた。中間の星はより大きく、木星から7分離れていた。木星は西の星から4分離れていて、この星は小さかった。
p063.01: >-
  10日、第1時30分には、きわめて小さな二つの星が、どちらも東に、次のように並んで見えた。
p063.02: >-
  遠いほうは木星から10分、近いほうは20秒離れていた。二つは同じ直線上にあった。
p063.03: >-
  ところが第4時には、木星にもっとも近い星はもう現れなかった。もう一つの星もひどく小さくなり、空気はたいへん澄んでいたのに、かろうじて見分けられるほどであった。しかも先ほどより木星から遠ざかり、12分離れていた。
p064.01: >-
  11日、第1時には、東に二つの星、西に一つの星があった。
p064.02: >-
  西の星は木星から4分離れていた。東の近いほうの星も同じく木星から4分離れ、もっとも東の星はこの星から8分離れていた。三つはかなりはっきりしていて、同じ直線上にあった。
p064.03: >-
  しかし第3時には、東側の木星にもっとも近いところに第四の星が見えた。⟦24v⟧ほかの星より小さく、木星から30秒離れていて、ほかの星を通る直線からわずかに北へそれていた。星はどれもきわめて明るく、よく目立っていた。
p064.04: >-
  第5時半には、木星にもっとも近かった東の星はすでに木星から遠ざかり、木星と、そのそばのもっとも東の星とのちょうど中間の位置を占めていた。すべての星は寸分違わず同じ直線上にあって、大きさも等しかった。添えた図に示すとおりである。
p065.01: >-
  12日、第0時40分には、東に二つの星、西にも同じく二つの星があった。
p065.02: >-
  東の遠いほうの星は木星から10分、西の遠いほうの星は8分離れていて、どちらもかなりよく目立った。残りの二つは木星のごく近くにあり、きわめて小さかった。とくに東の星がそうで、木星から40秒離れていた。西の星は1分離れていた。
p065.03: >-
  ところが第4時には、木星にもっとも近い東の小さな星はもう現れなかった。
p066.01: >-
  13日、第0時30分には、東に二つの星、さらに西にも二つの星が現れた。
p066.02: >-
  東の木星に近いほうの星はかなりはっきりしていて、木星から2分離れていた。これよりも東の星はあまり目立たず、この星から4分離れていた。
p066.03: >-
  西の二つのうち、⟦25r⟧木星から遠いほうの星はたいへんよく目立ち、木星から4分離れていた。この星と木星のあいだに小さな星が一つあり、この西の遠いほうの星に近く、そこから30秒以内の距離にあった。
p066.04: >-
  すべての星は、黄道に沿って、寸分違わず同じ直線上にあった。
p067.01: >-
  15日（14日は空が雲に覆われていた）、第1時には、星の位置は次のようであった。
p067.02: >-
  東に三つの星があり、西には一つも見えなかった。東の木星にもっとも近い星は木星から50秒、次の星はこの星から20秒、もっとも東の星はこの星から2分離れていた。この東の星はほかより大きかった。木星に近い二つはきわめて小さかったからである。
p067.03: >-
  しかし第5時ごろには、木星に近い星のうち一つしか見えず、木星から30秒離れていた。もっとも東の星は木星からの隔たりが増していて、そのときは4分であった。
p067.04: >-
  第6時には、いま述べた東の二つのほかに、西のほうに一つ、きわめて小さな星が見え、木星から2分離れていた。
p068.01: >-
  16日、第6時には、星は次のような配置にあった。東の星は木星から7分、⟦25v⟧木星は西の次の星から5分、この星はさらに西の星から3分離れていた。どれもほぼ同じ大きさで、かなりよく目立ち、獣帯に沿って正確に同じ直線上にあった。
p069.01: >-
  17日、第1時には、二つの星があった。
p069.02: >-
  一つは東にあって木星から3分、もう一つは西にあって10分離れていた。西の星は東の星よりやや小さかった。
p069.03: >-
  しかし第6時には、東の星は木星にいっそう近づき、50秒離れていた。西の星はいっそう遠ざかり、12分離れていた。
p069.04: >-
  二度の観測のどちらでも、二つは同じ直線上にあり、どちらもかなり小さかった。とくに二度目の観測の東の星がそうであった。
p070.01: >-
  18日、第1時には、三つの星があり、二つは西に、一つは東にあった。
p070.02: >-
  東の星は木星から3分、西のもっとも近い星は2分離れていた。残るさらに西の星は中間の星から8分離れていた。すべてが寸分違わず同じ直線上にあり、大きさもほぼ等しかった。
p070.03: >-
  ところが第2時には、木星に近い二つの星は木星から等しい間隔にあった。西の星もまた3分離れるようになったからである。
p070.04: >-
  しかし第6時には、もっとも東の星と木星のあいだに第四の小さな星が見え、配置は次のようであった。もっとも東の星は次の星から3分、⟦26r⟧次の星は木星から1分50秒、木星は西の次の星から3分、この星はさらに西の星から7分離れていた。
p070.05: >-
  星はほぼ等しい大きさで、木星にもっとも近い東の星だけがほかよりやや小さかった。それらは黄道に平行な同じ直線上にあった。
p071.01: >-
  19日、第0時40分には、木星の西にある二つの星だけが見えた。かなり大きく、木星とともに寸分違わず同じ直線上にあって、黄道に沿って並んでいた。
p071.02: >-
  近いほうの星は木星から7分、この星はさらに西の星から6分離れていた。
p072.01: >-
  20日、空は曇っていた。
p073.01: >-
  21日、第1時30分には、かなり小さな三つの星が見え、配置は次のようであった。
p073.02: >-
  東の星は木星から2分、木星は西の次の星から3分、この星はさらに西の星から7分離れていた。三つは寸分違わず、黄道に平行な同じ直線上にあった。
p074.01: >-
  25日、第1時30分には（その前の三夜は空が雲に覆われていた）、三つの星が現れた。
p074.02: >-
  東の二つは、互いの距離も、木星からの距離も等しく、⟦26v⟧4分であった。西の星は木星から2分離れていた。三つは黄道に沿って、寸分違わず同じ直線上にあった。
p075.01: >-
  26日、第0時30分には、二つの星だけがあった。
p075.02: >-
  一つは東にあって木星から10分、もう一つは西にあって6分離れていた。東の星は西の星よりやや小さかった。
p075.03: >-
  しかし第5時には、三つの星が見えた。
p075.04: >-
  すでに記した二つのほかに、西の木星のそばに、きわめて小さな第三の星が見えたのである。この星は先には木星の陰に隠れていたもので、木星から1分離れていた。東の星は先よりも遠くに見え、木星から11分離れていた。
p075.05: >-
  この夜、私は初めて、木星とそのそばの惑星が獣帯に沿って進むようすを、ある恒星と比べて観測することにした。東のほうに一つの恒星が見え、東の惑星から11分離れていて、わずかに南へそれていた。その様子は次のとおりである。
p076.01: >-
  27日、第1時4分には、星は次のような配置に見えた。もっとも東の星は木星から10分、その次の、木星にもっとも近い星は30秒、⟦27r⟧西の次の星は2分30秒離れていた。これよりさらに西の星は、この星から1分離れていた。
p076.02: >-
  木星に近い二つは小さく見え、とくに東の星がそうであった。両端の二つはきわめてよく目立ち、とくに西の星がそうであった。四つは黄道に沿って、寸分違わず一直線をなしていた。
p076.03: >-
  これらの惑星が東へ進んでいることは、先に述べた恒星と比べればはっきりと見てとれた。木星は、そばにある惑星とともに、この恒星にいっそう近づいていたからである。添えた図に示すとおりである。
p076.04: >-
  しかし第5時には、東の木星にもっとも近い星は木星から1分離れていた。
p077.01: >-
  28日、第1時には、二つの星だけが見えた。東の星は木星から9分、西の星は2分離れていた。二つはかなりよく目立ち、同じ直線上にあった。恒星からこの直線に下ろした垂線は、東の惑星に落ちた。図に示すとおりである。
p077.02: >-
  しかし第5時には、東に第三の小さな星が木星から2分離れて見え、配置は次のようであった。
p078.01: >-
  3月1日、第0時40分には、四つの星が見え、⟦27v⟧すべて東にあった。木星にもっとも近い星は木星から2分、その次の星はこの星から1分、第三の星はその次の星から20秒離れていて、ほかよりも明るかった。もっとも東の星は第三の星から4分離れ、ほかよりも小さかった。
p078.02: >-
  四つはほぼ一直線をなしていたが、木星から数えて第三の星だけはわずかに持ち上がっていた。
p078.03: >-
  恒星は、木星ともっとも東の星とともに、正三角形をなしていた。図に示すとおりである。
p079.01: >-
  2日、第0時40分には、三つの惑星が木星のそばにあり、東に二つ、西に一つで、配置は次のようであった。
p079.02: >-
  もっとも東の星は木星から7分、その次の星はこの星から30秒離れていた。西の星は木星から2分離れていた。両端の星は、きわめて小さく見えた残りの一つよりも明るく、大きかった。
p079.03: >-
  もっとも東の星は、ほかの二つと木星を通る直線から、わずかに北へ持ち上がっているように見えた。
p079.04: >-
  すでに記した恒星は、西の惑星から8分離れていた。この距離は、この惑星から、すべての惑星を通る直線に垂直に引いた線に沿って測ったものである。添えた図に示すとおりである。
p080.01: >-
  木星とそのそばの惑星を恒星と比べたこれらの記録をここに添えたのは、⟦28r⟧それによって、これらの惑星の進行が、経度においても緯度においても、天文表から導かれる運動と寸分違わず一致することを、誰もが理解できるようにするためである。\footnote{当時惑星の位置の計算に用いられていた天文表をいう。たとえば、コペルニクスに基づくエラスムス・ラインホルトの『プロイセン表』（1551年）がある。表から得られるのは木星自身の運動だけであり、ガリレオの言わんとするところは、木星に伴う星々もその運動を共にしているということである。}
p081.01: >-
  以上が、私が最近初めて発見した四つのメディチ惑星の観測である。これらの周期はまだ数値として求められないが、少なくとも、注目に値するいくつかのことは言うことができる。
p081.02: >-
  第一に、これらの星は、似たような間隔を保って、あるときは木星のあとを追い、あるときは先に立ち、東へも西へもごく狭い開きでしか木星から離れず、木星が逆行しているときも順行しているときも、同じようにそれに伴っている。したがって、これらが木星のまわりで回転していることは、誰も疑うことができない。しかもそのあいだに、すべてがそろって、世界の中心のまわりに十二年の周期を終えるのである。
p081.03: >-
  さらに、これらは大きさの等しくない円を描いて回っている。このことは、木星から大きく離れたときには、二つの惑星が合わさって見えたことが一度もないのに、木星の近くでは、二つ、三つ、ときにはすべてが同時に寄り集まっているのが見られたことから、はっきりと知られる。
p081.04: >-
  また、木星のまわりにより小さな円を描く惑星ほど、回転が速いことも知られる。木星に近い星は、前日に西に見えたものが翌日には東に見えることがよくあり、その逆もあるからである。一方、もっとも大きな軌道を巡る惑星は、先に記録した回帰を注意深く検討すれば、半月ごとに元の位置に戻るように見える。\footnote{四つのうちもっとも外側にある木星の第四衛星（カリスト）の実際の公転周期は約16.7日である。イオ、エウロパ、ガニメデの周期は、それぞれ約1.8日、3.6日、7.2日である。}
p081.05: >-
  そのうえわれわれは、ある人々の疑念を取り除くための、すぐれた、輝かしい論拠を手にしている。その人々は、コペルニクス体系において惑星が太陽のまわりを回ることは平然と受け入れながら、月がただ一つ地球のまわりを回り、しかも両者がそろって一年で太陽のまわりを一周するということにはひどく心を乱され、宇宙のこの構成を不可能なものとして覆さねばならないと考えるのである。だが今や、一つの惑星が別の惑星のまわりを回り、その二つがそろって太陽のまわりに大きな軌道を巡るというだけではない。感覚はわれわれに、月が地球のまわりを回るように木星のまわりを回る、四つのさまよう星を示している。⟦28v⟧しかもそれらすべてが木星とともに、12年かけて太陽のまわりの大きな軌道を巡るのである。
p081.06: >-
  最後に、見過ごしてはならないことがある。メディチ星は、木星のまわりでごく小さな回転を行っているのに、ときに別のときの二倍を超える大きさに見えるのは、どういう理由によるのかということである。
p081.07: >-
  その原因を地上の蒸気に求めることはまったくできない。星が大きくなったり小さくなったりして見えるとき、木星や近くの恒星の大きさは、少しも変わって見えないからである。
p081.08: >-
  また、これらの星が自らの回転の近地点や遠地点で地球に近づいたり遠ざかったりして、これほど大きな変化の原因を得るということも、まったく考えられないように思われる。狭い円運動にはそのようなことはどうしてもできないし、卵形の運動（この場合ほとんど直線に近いであろう）は、考えられないうえに、見えている現象とまったく合わないように思われる。
p081.09: >-
  この点について私に思い浮かんだことを、喜んで述べ、正しく哲学する人々の判断と批評にゆだねる。
p081.10: >-
  地上の蒸気を通して見ると、太陽と月はより大きく、恒星と惑星はより小さく見えることは確かである。そのため、地平線の近くでは、二つの光体は大きく見え、星は小さくなり、たいていは見えなくなる。その蒸気が光に満たされていれば、星はいっそう小さくなる。だから星は昼間や薄明のあいだは、ひどく弱々しく見える。月はそうではなく、これは前にも述べたとおりである。
p081.11: >-
  さらに、地球だけでなく月も、そのまわりに蒸気に満ちた天球を広げていることは確かである。それは、前に述べたことからも、またとくに、われわれの『体系』でもっと詳しく述べられることからも分かる。\footnote{計画されていた宇宙体系についての著作。[14v]を参照。}ほかの惑星についても、同じ判断を妥当に下すことができる。したがって、木星のまわりにも、ほかのアイテールより濃い天球があると考えることは、決して考えられないことではないように思われる。月が元素の天球のまわりを回るように、\tremph{メディチ}惑星はこの天球のまわりを運ばれていて、遠地点にあるときは、この天球が間にあるために小さく見え、近地点にあるときは、この天球が取り除かれるか薄くなるために、大きく見えるのであろう。
p081.12: >-
  時間が足りず、これ以上先へ進むことはできない。公正な読者は、近いうちにこれらについてさらに多くを期待してよい。
