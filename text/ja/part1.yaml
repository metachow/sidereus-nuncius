f02r.1: |-
  {\centering \zhdisp[10.5]{いとも晴朗なる}\\[2pt]
   \zhdisp[15]{第四代トスカーナ大公}\\[2pt]
   \zhdisp[15]{コジモ二世・デ・メディチ}\\[2pt]
   \zhdisp[10.5]{殿下に}\par}
p001.01: >-
  \jawoodinitial{toku}において卓越した人々の輝かしい事績を妬みから守り、不滅に値するその人々の名を忘却と消滅から救い出そうと努めた人々の慣わしは、まことに立派で、人間味あふれるものでありました。
p001.02: >-
  そこから、後世の記憶にとどめるために、大理石に刻み、あるいは青銅で鋳た肖像が生まれ、立像も騎馬像も建てられ、またあの詩人の言うとおり、巨費を投じた円柱やピラミッドが星々にまで届くほど高く築かれ、\footnote{ローマの詩人プロペルティウス『エレゲイア』第3巻第2歌の句。}さらには、感謝を忘れぬ後世が永遠にゆだねるべきだと考えた人々の名を冠して、都市までが建てられたのです。
p001.03: >-
  人間の精神とは、事物の像が絶えず外から飛び込んで打ちつけなければ、あらゆる記憶がたやすく流れ去ってしまう、そうした性質のものだからです。
p002.01: >-
  しかし、より堅固でより長く続くものに目を向けた人々は、もっとも偉大な人々への永遠の称賛を、石や金属にではなく、ムーサたちの守護と、朽ちることのない文字の記念碑にささげました。
p002.02: >-
  それにしても、なぜ私はこのようなことを申し上げるのでしょうか？　まるで人間の才知が、これらの領域に満足して、それ以上先へ進む勇気を持たなかったかのようではありませんか。決してそうではありません。人間の才知はさらに遠くを見通し、人間の記念物はみな暴力と風雨と年月によっていつかは滅びると十分に悟って、より朽ちにくいしるしを考え出しました。それに対しては、すべてを食らう時間も、妬み深い歳月も、いかなる権利も主張できないのです。\footnote{オウィディウス『変身物語』第15巻234行「すべてを食らう時間よ、そして妬み深い歳月よ」を踏まえる。}
p002.03: >-
  そこで才知は天へと移り、もっとも輝かしい星々の印によって、あの永遠の天球に、卓越した、ほとんど神にも等しい偉業のゆえに、星々とともに永遠の時を享受するにふさわしいと見なされた人々の名を刻みました。
p002.04: >-
  それゆえ、その名で星が呼ばれているユピテル、マルス、メルクリウス、ヘルクレスなどの英雄たちの名声は、星々そのものの輝きが消えるよりも前に曇ることはないでしょう。
p002.05: >-
  ところが、人間の知恵のこの発明は、きわめて高貴で驚嘆すべきものでありながら、すでに何世紀ものあいだすたれています。古代の英雄たちがあの輝く座を占め、いわば自分の権利として保っているからです。その仲間にユリウス・カエサルを加えようと、アウグストゥスは孝心から試みましたが、むなしく終わりました。アウグストゥスは、自分の時代に現れた一つの星、ギリシア人が\ruby{彗星}{すいせい}（コメテス）、われわれが「髪をなびかせた星」と呼ぶものの一つを、「ユリウスの星」と名づけようとしたのですが、その星はほどなく消え失せ、あれほど切なる望みを裏切ってしまったのです。\footnote{前44年のカエサル暗殺の後に現れた彗星。カエサルが神になった印と見なされた。}
p002.06: >-
  しかし、いとも晴朗なる君主よ、私が殿下のために予言できることは、はるかに確かで、はるかに喜ばしいものです。殿下の魂の不滅の誉れが地上に輝きはじめるやいなや、天には明るい星々が現れ、あたかも舌のように、殿下のこのうえなく卓越した徳を永遠に語り、称えようとしているのですから。
p002.07: >-
  ご覧ください、ここに四つの星が、殿下の輝かしい御名のために取っておかれています。しかもそれは、ありふれて目立たない恒星の群れからではなく、さまよう星々の輝かしい列から選ばれたものです。これらの星は互いに異なる運動をしながら、ほかのあらゆる星のなかでもっとも高貴なユピテルの星、すなわち木星の周りを、あたかもその実の子孫のように、驚くべき速さで巡り、それぞれの道と軌道を描いています。その一方で、心を一つにして、世界の中心、すなわち太陽そのものの周りを、十二年ごとにそろって大きく一巡りするのです。\footnote{木星が太陽を一周するのに約十二年かかる。ガリレオはここで、太陽をはっきりと「世界の中心」と呼んでいる。}
p002.08: >-
  これらの新しい惑星を、ほかの誰の名にもまして殿下の輝かしい御名にささげるよう、星々の造り主ご自身が、明白なしるしをもって私に促してくださったように思われます。
p002.09: >-
  実際、これらの星が、ユピテルにふさわしい子孫として、わずかな隔たりのほかは決してその傍らを離れないのと同じように、殿下のうちに住まいと座を定めた慈悲、心の穏やかさ、立ち居振る舞いの優しさ、王家の血筋の輝き、行いにおける威厳、他者に及ぶ権威と統治の広さ——これらすべてが、あらゆる善の源である神に次いで、いとも恵み深いユピテルの星から流れ出ていることを、誰が、そう、いったい誰が知らないでしょうか？\footnote{ラテン語の \textit{Iuppiter}（属格 \textit{Iovis}）は神の名であり、同時に惑星（木星）の名でもある。ガリレオはこの二重の意味を生かしている。新しい星はユピテルの子孫としてその傍らを離れず、占星術で幸運と王権をつかさどる木星はコジモを守護する。こうしてメディチ家は、木星とそれを巡る四つの星に結びつけられる。}
p002.10: >-
  ユピテルが、そうです、ユピテルこそが、殿下ご誕生のまさにその時、すでに地平線の濁った蒸気を越えて天の中央の要を占め、その王宮から東の角を照らしつつ、あの高い玉座からこのうえなく幸いなご誕生を見下ろし、おのれの輝きと壮大さのすべてを、もっとも清らかな大気の中に注ぎ出したのです。それは、柔らかな小さいお体が、すでに神によってより高貴な賜物で飾られていた御魂とともに、最初の息で、その力と権能のすべてを吸い込まれるためでした。\footnote{「天の中央の要」（南中点）と「東の角」（上昇点）は占星術の用語。ガリレオはここで、占星術にしたがってコジモ誕生時の木星の位置を述べている。}
p002.11: >-
  しかし、ほとんど必然的な理由によって結論し、証明することができるのに、なぜ私は蓋然的な論証にとどまっているのでしょうか？
p002.12: >-
  至善至大の神の御心により、私は殿下の尊い御両親から、殿下に数学の諸学科をお教えする務めにふさわしくないとは見なされませんでした。私はその務めを、過ぎ去ったばかりの四年間、一年のうちで、きびしい学業から離れて休むのが常である季節に果たしてまいりました。
p002.13: >-
  そういうわけで、殿下にお仕えすることがまさに神のお計らいによって私に許され、そのために殿下の信じがたいほどのご慈悲とご厚意の光を、より近くで受けることになりました。それならば、私の心がこれほどまでに燃え立ち、心においてだけでなく、生まれと本性においても殿下の支配のもとにある私が、殿下の栄光を何よりも切に願い、殿下にできるかぎりの感謝をささげる者として知られること、ほとんどただそれだけを昼も夜も思うようになったとしても、何の不思議がありましょうか？
p002.14: >-
  以上の次第で、いとも晴朗なる\tremph{コジモ}様、殿下のご加護のもとに、これまでのいかなる天文学者にも知られていなかったこれらの星を私は探り当てましたので、殿下のご一門のいとも尊い御名をもってこれらを飾ることを、まったく正当なこととして決意いたしました。
p002.15: >-
  もしこれらを最初に探り当てたのが私であるならば、私がこれらに名を与え、\tremph{メディチ星}と呼んだとしても、誰が正当に私をとがめることができるでしょうか？　私は、ほかの名がほかの英雄たちにもたらしたのと同じだけの尊厳が、この呼び名によってこれらの星に加わることを望んでおります。
p002.16: >-
  と申しますのも、あらゆる歴史の記録がその永遠の栄光を証している殿下の尊いご祖先のことはさておくとしても、もっとも偉大な英雄よ、殿下の徳ただそれだけで、これらの星に名の不滅を授けることができるからです。
p002.17: >-
  殿下が、このうえなく幸先のよい治世の始まりによって呼び起こされた期待は、どれほど高いものであっても、殿下はそれを担い守られるだけでなく、はるかに超えていかれる——そのことを誰が疑えましょうか？　こうして殿下は、ご自身に似た他の方々に勝たれたのちも、なおご自身と競い合い、日ごとに、ご自身よりも、またご自身の偉大さよりも、さらに偉大になっていかれることでしょう。
p003.01: >-
  ですから、いとも慈悲深き君主よ、星々が殿下のために取っておいた、このご一門の栄光をお受けください。そして、星々からというよりは、星々の造り主であり支配者である神から殿下に授けられる、あの神聖な恵みを、どうか末永く享受なさいますように。
p004.01: >-
  1610年3月12日、パドヴァにて。\footnote{原文はローマ暦で「3月のイドゥスの4日前」と記す。3月のイドゥスは15日であり、ローマ人は起点の日も数えに入れたので、3月12日にあたる。}
