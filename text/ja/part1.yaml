f05r.1: |-
  {\centering \zhdisp[17]{天文の使者}\par
  \vspace{0.4\baselineskip}
  \zhital{新しい遠眼鏡の力によって、月の面、天の川と星雲状の星、数知れぬ恒星、さらにこれまで一度も見られたことのない、}\\[1pt]
  \zhdisp[12]{メディチ星}\\[1pt]
  \zhital{と名づけられた四つの惑星について}\\[1pt]
  \zhdisp[12]{新たに行われた観測を}\\[1pt]
  \zhital{収め、かつ明らかにする。}\par}
p007.01: >-
  \jawoodinitial{i}大な事柄を、私はこの小さな論考において、自然を探究する一人ひとりに、観察し熟考してもらうべく提示する。
p007.02: >-
  偉大であると、私は言う。それは事柄そのものが卓越しているからであり、いつの世にも聞かれなかったほど新しいからであり、さらには、その助けによってそれらがわれわれの感覚の前に姿を現した、器具そのもののゆえでもある。
p008.01: >-
  生来の視力によって今日まで見ることのできた数多くの恒星の群れに、さらに数知れぬ星を加え、これまで一度も見られなかったそれらを目の前にはっきりと示すことは、まことに偉大なことである。しかもその数は、古くから知られた星を十倍以上も上回るのである。
p009.01: >-
  月の本体は、われわれから地球の半径のほぼ六十倍も離れている。\footnote{初版は「地球の直径の六十倍」（\textit{diametros}）とするが、ファヴァロ版は月と地球の実際の距離に合うよう「半径」（\textit{semidiametros}）と改めている。ガリレオの手稿も \textit{diametros} で、おそらく書き誤りである。後出の[6v]「地球の直径の二倍」では、初版もファヴァロ版も \textit{diametros} としている。}それを、あたかも半径のわずか二倍しか離れていないかのように間近に眺めることは、このうえなく美しく、見るも楽しいことである。こうして月の直径はほぼ三十倍、表面積は九百倍、体積はほぼ二万七千倍も、肉眼だけで見るときより大きく見える。そこから誰でも、感覚による確かさをもって、月が滑らかで磨き上げられた表面をまとっているのでは決してなく、粗くて凹凸があり、地球そのものの表面と同じように、いたるところ巨大な隆起と深いくぼみ、曲がりくねった裂け目に満ちていることを理解するであろう。
p010.01: >-
  さらに、銀河、すなわち天の川をめぐる論争に決着をつけ、その本質を、理性にとってはもとより感覚にとっても明らかにしたことは、決して\ruby{些細}{ささい}なことと考えるべきではないと思われる。そのうえ、これまで天文学者の誰もが星雲状の星と呼んできた星々の実体を、指でさすように示し、それがこれまで信じられてきたものとはまったく異なることを明らかにするのは、愉快で、じつにすばらしいことであろう。\footnote{肉眼にはぼんやりした光の\ruby{斑点}{はんてん}に見える天体をいう。ガリレオは遠眼鏡によって、その多くが小さな星の集まりであることを見いだした（後述）。}
p011.01: >-
  しかし、あらゆる驚嘆をはるかに超えるもの、すべての天文学者と哲学者に知らせなければならないと、われわれを何よりも強く駆り立てたものは、次のことである。すなわち、われわれは四つのさまよう星を見いだした。われわれ以前の誰にも知られず、観測されもしなかった星である。それらは、既知の星のなかのある顕著な星の周りに、金星と水星が太陽の周りを巡るように、それぞれの周期をもっている。ときにはその星に先行し、ときには後に従い、一定の限界を決して越えてその星から離れることがない。
p011.02: >-
  これらはすべて、神の\ruby{恩寵}{おんちょう}が先に私を照らしてくださったうえで、私が考案した遠眼鏡の助けにより、数日前に見いだされ、観測されたのである。
p012.01: >-
  おそらくこれからも、私によってであれ他の人々によってであれ、同様の器具の助けによって、日々、ほかのもっと優れたものが見いだされるであろう。その器具の形と仕組み、またそれを考え出すきっかけを、私はまず手短に述べ、そのうえで、私が行った観測の経過を叙述することにする。
p013.01: >-
  \zhinitial[2]{\CJKfamily{zhsemi}十}か月ほど前のこと、あるネーデルラント人が遠眼鏡を作り上げたという\ruby{噂}{うわさ}が、われわれの耳に響いてきた。それを使うと、目に見える物体は、観察者の目からはるか遠く離れていても、あたかも近くにあるかのようにはっきり見えるというのである。そして、この実に驚くべき効果についていくつかの試験の話が出回り、ある者は信じ、ある者は否定した。\footnote{原語は \textit{perspicillum}。「望遠鏡」を意味する \textit{telescopium} という語は当時まだなく、本訳では「遠眼鏡」と訳す。}
p013.02: >-
  数日後、高貴なフランス人ジャック・バドヴェールが、パリから手紙で、同じことを確認してくれた。\footnote{ジャック・バドヴェール（Jacques Badovere、イタリア名ジャコモ・バドエル Giacomo Badoer）は、1607年の彼自身の証明書によれば、1598年ごろガリレオのパドヴァの家に寄宿し、数学を学んだ。原文の Lutetia はパリのラテン語の古名。}これがついに、私が全身全霊をあげて、その原理を探り、同様の器具の発明にたどり着く手段を考え出すことに向かう原因となった。ほどなく私は、屈折の理論に支えられて、それに成功した。まず鉛の管を用意し、その両端にガラスのレンズを二枚はめた。二枚とも片面は平らで、もう一方の面は、一枚が球面状に凸、もう一枚が凹であった。それから凹のほうに目を寄せると、物体はかなり大きく、近く見えた。肉眼だけで見たときより、三倍も近く、九倍も大きく見えたのである。\footnote{ガリレオが「何倍近く」と言うときは線の長さについての拡大率、「何倍大きく」と言うときは面積についての拡大率を指す。近さが三倍なら、面積は九倍になる。後出の「六十倍以上大きく」は線の長さで約八倍、「ほぼ千倍大きく」は約三十倍にあたる。}
p013.03: >-
  その後、さらに精密なものをもう一つ作り上げた。それは物体を六十倍以上に大きく見せた。
p013.04: >-
  ついに、労苦も費用もいっさい惜しまず、私は自分のために、きわめて優れた器具を作り上げるまでに至った。それを通して見たものは、生来の視力だけで見る場合に比べて、ほぼ千倍大きく、三十倍以上も近く見える。
p013.05: >-
  この器具が陸上でも海上でも、どれほど多くの、どれほど大きな利点をもつかを数え上げることは、まったく無用であろう。
p013.06: >-
  しかし地上のことは措いて、私は天上の探究に向かった。まず月を、地球の直径の二倍ほどしか離れていないかのように、間近に眺めた。
p013.07: >-
  その後、恒星も、さまよう星も、信じがたいほどの心の喜びをもって、しばしば観測した。それらがきわめて数多いのを見て、その間隔を測る方法を考えはじめ、ついに見いだした。
p013.08: >-
  この点について、この種の観測に取りかかろうとする者は、一人ひとり、あらかじめ心得ておくのがよい。
p013.09: >-
  第一に、きわめて精密な遠眼鏡を自分のために用意することが必要である。それは物体を、明るく、くっきりと、いかなる\ruby{靄}{もや}にも覆われることなく映し出し、少なくとも四百倍に拡大するものでなければならない。そうであれば、物体を二十倍も近づけて見せるであろう。そのような器具でなければ、われわれが天に見たもの、また以下に列挙されるもののすべてを見ようとしても、むなしいであろう。\footnote{ここでも倍数は面積についてのもの（[6r]の注を参照）で、四百倍は線の長さで二十倍にあたる。}
p013.10: >-
  器具の拡大率を、誰もが手間をかけずに確かめられるように、紙で円を二つ、あるいは正方形を二つ切り抜くとよい。一方が他方の四百倍の大きさのもので、これは大きいほうの直径が小さいほうの直径の二十倍の長さのときである。それから、両方の図形を同じ壁に取り付け、遠くから同時に眺める。小さいほうは一方の目を遠眼鏡に当てて、大きいほうはもう一方の目を何も当てずに見る。これは両目を開いたまま、同時にたやすく行うことができる。そのとき、器具が物体を望みの比で拡大していれば、二つの図形は同じ大きさに見えるだろう。
p013.11: >-
  このような器具を整えたら、次に距離を測る方法を探らねばならない。それは次のような工夫によって果たされる。
p013.12: >-
  理解しやすくするために、管をABCDとしよう。
p013.13: >-
  観察者の目をEとする。管の中にレンズがなければ、光線は直線ECF、EDGに沿って物体FGへ向かうであろう。しかしレンズを置くと、屈折した線ECH、EDIに沿って向かう。光線は収束させられ、先には妨げられずに物体FGへ向かっていた光線が、いまやHIの部分しか捉えなくなるのである。
p013.14: >-
  次に、距離EHの線HIに対する比を得れば、正弦表によって、物体HIが目につくる角の大きさがわかる。その角は、わずか数分しか含まないことが見いだされるだろう。
p013.15: >-
  もしレンズCDに薄板を取り付け、あるものにはより大きな孔、あるものにはより小さな孔をあけて、必要に応じてあれこれをかぶせるならば、含む分の数が多い角、少ない角と、さまざまな角を思いのままに作ることができる。これを用いて、数分離れた星どうしの間隔を、誤差を1分か2分にとどめて、楽に測ることができる。
p013.16: >-
  とはいえ、これらは今は軽く触れただけ、いわば唇の先で味わっただけで十分としよう。別の機会に、この器具の完全な理論を公にするからである。
p013.17: >-
  さあ、われわれがこの二か月のあいだに行った観測を順に述べよう。真の哲学を望むすべての人々を、まことに偉大な考察の始まりへと呼び集めながら。
p014.01: >-
  さて、われわれの視線に向いている月の面について、まず述べよう。
p014.02: >-
  理解しやすくするために、私はそれを二つの部分に分ける。すなわち一方はより明るく、他方はより暗い。明るいほうは半球全体を取り巻き、満たしているように見え、暗いほうは、雲のように、その面を染めてまだらにしている。
p014.03: >-
  この斑点は、やや暗くかなり広く、誰の目にも明らかで、あらゆる時代の人がこれを見てきた。それゆえわれわれは、これを「大きな斑点」あるいは「古くからの斑点」と呼ぶ。ほかの斑点、すなわち大きさでは小さいが、数が多くて月面全体、とりわけ明るいほうの部分に散らばるほど密に分布しているものと、区別するためである。この後者の斑点は、われわれ以前の誰にも観測されなかった。これらを何度もくり返し眺めるうちに、われわれは次の考えに導かれ、確かに理解した。月の表面は、大勢の哲学者たちが月やほかの天体について思い描いたような、磨かれ、平らで、完全な球形をしたものではない。逆に、でこぼこで粗く、くぼみと隆起に満ち、あちこち山の尾根と谷の深みで区切られた地球そのものの表面と、少しも変わらないのである。
p014.04: >-
  これらを導き出すことのできた現象とは、次のようなものである。
