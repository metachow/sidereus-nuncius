f01r.1: |-
  {\centering
   \zhdisp[23]{星界の使者}\\[6pt]
   \zhdisp[10.5]{偉大にして、このうえなく}\\
   \zhdisp[10.5]{驚嘆すべき光景を}\\
   {\small 繰り広げ、すべての人に、とりわけ}\\
   {\small\zhital{哲学者と天文学者}に仰ぎ見るべきものとして示す。これらの光景は}\\[4pt]
   \zhdisp[11]{フィレンツェの貴族}\\
   {\small パドヴァ大学の数学教授}\\[2pt]
   \zhdisp[17]{ガリレオ・ガリレイ}\\[3pt]
   {\small が、近ごろみずから発明した}\\[4pt]
   \zhdisp[12]{\ruby{遠眼鏡}{とおめがね}}\\[1pt]
   {\small\zhital{の力によって、月の面、数知れぬ恒星、}}\\
   {\small\zhital{銀河（天の川）、星雲状の星において}}\\
   {\small\zhital{観測したものであり、とりわけ}}\\[1pt]
   \zhdisp[12]{四つの惑星}\\[1pt]
   {\small において観測したものである。これらの惑星は、それぞれ異なる間隔と周期をもち、驚くべき速さで\tremph{木星}の周りを巡っている。今日まで誰にも知られていなかったこれらの惑星を、作者はごく最近、最初に見いだし、さらにこれを}\\[4pt]
   \zhdisp[17]{メディチ星}\\[1pt]
   \zhdisp[10.5]{と名づけることに決めた。}\par}
