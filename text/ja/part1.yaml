p005.01: >-
  以下に署名する至高の十人評議会の首長たる閣下らは、パドヴァ大学監督官諸氏より、この件のために任命された二名、すなわち尊敬すべき異端審問官神父と慎重なる元老院書記ジョヴァンニ・マラヴィーリャの宣誓による報告にもとづき、ガリレオ・ガリレイ氏の『\tremph{星界の使者}』等と題する書物には、聖なるカトリックの信仰、君主、および良俗に反するものは何も見当たらず、印刷に値するとの確証を得たので、本市においてこれを印刷する許可を与える。\footnote{十人評議会はヴェネツィア共和国で国家の安全をつかさどる最高機関で、印刷許可はその首長が与えた。「パドヴァ大学監督官」（Riformatori dello Studio di Padova、直訳すれば「パドヴァ大学改革官」）は共和国で同大学の事務を担当する官職で、書物の出版前審査を手配し、審査人の証言にもとづいて証明書を出した。}
p006.01: >-
  1610年3月1日付。
