p029.01: >-
  第一の図には、オリオンの頭と呼ばれる\tremph{星雲}があり、そこでわれわれは二十一個の星を数えた。\footnote{ガリレオの言う「オリオンの頭の星雲」は、オリオン座の頭部、λ星の周辺にある星の集まりで、今日の散開星団コリンダー69にあたる。剣のあたりにあるオリオン大星雲（M42）ではない。}
p030.01: >-
  第二の図には、プレセペ（かいばおけ）と呼ばれる\tremph{星雲}がある。これは一つの星ではなく、四十を超える小さな星の集まりである。われわれはアセッリ（「ロバの子」）を除いて三十六個を書き留めた。その並びは次のとおりである。\footnote{プレセペはかに座の散開星団M44。アセッリは、その北と南に並ぶかに座のγ星とδ星である。}
p031.01: >-
  月と恒星と銀河について、これまでに観察されたことは、以上のように簡潔に述べた。
p031.02: >-
  残るのは、このたびの仕事でもっとも重大と思われること、すなわち、世界の始まりから今日に至るまで一度も見られたことのない四つの\tremph{惑星}について、その発見と観測の機会、それらの位置、およびこの二か月のあいだに行った、それらの運行と変化の観測を、明らかにして公にすることである。そしてわれわれは、すべての天文学者に、これらの周期の探究と決定に取り組むよう呼びかける。時間が足りなかったため、われわれは今日までそれをまったく果たせなかったのである。
p031.03: >-
  ただし、このような観測に空しく取りかかることのないよう、彼らにもう一度注意しておく。きわめて精確な遠眼鏡が必要であり、それは本書の初めに記したようなものでなければならない。
p032.01: >-
  さて、今年、1610年の1月7日、その夜の第1時に、\footnote{ガリレオが用いているのは当時のイタリアの時刻法で、一日は日没から数え始める。「夜の第1時」とは日没後の最初の1時間をいう。1610年1月初めのパドヴァでは、日没は現地時間の午後4時半ごろであった。}私が遠眼鏡で天の星々を眺めていると、木星が目の前に現れた。私はたいへん優れた器具を用意していた（以前は別の器具が非力だったため、それができなかった）ので、木星のそばに三つの小さな星があるのを認めた。小さいけれども、きわめて明るかった。私はそれらを恒星の一つだと思ったが、それでもいささか私を驚かせた。というのは、それらが黄道に平行な、正確な一直線に沿って並んでいるように見え、同じ大きさのほかの星よりも輝いて見えたからである。
p032.02: >-
  それらの互いの位置と木星に対する位置は次のようであった。
p032.03: >-
  すなわち、東側に二つの星があり、西のほうに一つあった。
p032.04: >-
  もっとも東の星と西の星は、残る一つよりやや大きく見えた。それらと木星との距離は、私はまったく気にしなかった。先に述べたとおり、それらを恒星だと思っていたからである。
p032.05: >-
  ところが8日に、どういう運命に導かれたのか、私が同じ観測に戻ってみると、配置はまるで違っていた。三つの小さな星はすべて木星の西にあり、前の夜よりも、木星からも互いからも近づいて、互いに等しい間隔で隔てられていた。添えた図に示すとおりである。
p032.06: >-
  この時、私は星どうしが互いに近づいたなどとはまったく考えていなかったが、それでも、前日には木星はそのうち二つよりも西にあったのに、どうして先に述べた恒星すべてよりも東に見いだされうるのかと、戸惑い始めた。そこで私は、木星が天文計算に反して順行しており、固有の運動によってそれらの星を追い越したのではないかと恐れた。\footnote{当時の天文表の推算では、木星はこのとき逆行の時期にあり、恒星を背景に東から西へ動いていた。もし木星が予想に反して順行（西から東へ）していたのであれば、それらの星を追い越して、その東側に出たように見えることになる。}
p032.07: >-
  それゆえ私は次の夜をこの上なく待ち望んだが、期待は裏切られた。空はいたるところ雲に覆われていたのである。
p033.01: >-
  10日には、星は木星に対して次のような位置に現れた。
p033.02: >-
  すなわち、星は二つしかなく、いずれも東にあった。三つ目は、私が推測したとおり、木星の陰に隠れていた。
p033.03: >-
  それらは前と同じく木星と同じ直線上にあり、獣帯に沿って正確に並んでいた。
p033.04: >-
  これを見て、私は、このような変化を木星のせいにはまったくできないと悟った。さらに、観測した星が常に同じものであることも知った（獣帯に沿って広い範囲に、先行するにせよ後続するにせよ、ほかの星はなかったのである）。そこで私は、戸惑いを驚きに変え、見かけの変化は木星ではなく、記録した星のほうにあることを見いだした。そして、これからはもっと注意深く、厳密に観測しなければならないと考えた。
p034.01: >-
  こうして11日には、次のような配置を見た。
p034.02: >-
  すなわち、星は東に二つだけであった。そのうち中間の星と木星との距離は、中間の星ともっとも東の星との距離の三倍であった。もっとも東の星は、もう一つの星のほぼ二倍の大きさであった。前の夜には両者はほとんど等しく見えたのである。
p034.03: >-
  そこで私は、天には、金星と水星が太陽の周りをめぐるように、木星の周りをさまよう三つの星があると、いささかの疑いもなく断定した。このことは、のちに数多くの観測を重ねて、ついに真昼の光よりも明らかに確かめられた。そして、木星の周りをめぐって公転するさまよう星は、三つだけでなく四つあることも確かめられた。それらの位置の変化は、その後いっそう精密に観測したので、以下の記述で示そう。私はまた、それらの間隔も、先に説明した方法で、遠眼鏡によって測った。さらに観測の時刻も記しておいた。とくに同じ夜に何度も観測したときはそうである。これらの惑星の公転はきわめて速く、たいていは1時間ごとの違いまで捉えることができるのである。
p035.01: >-
  12日、夜の第1時には、星は次のように並んでいた。東の星は西の星より大きかったが、どちらもたいへんはっきりして輝いていた。どちらも木星から2分離れていた。第3時には、それまでまったく見えなかった三つ目の小さな星が現れ始めた。それは東側で木星にほとんど接しており、ごく小さかった。
p035.02: >-
  すべては同じ直線上にあり、黄道に沿って並んでいた。
p036.01: >-
  13日、私は初めて四つの小さな星を見た。木星に対する配置は次のようであった。
p036.02: >-
  西に三つ、東に一つあった。ほぼ一直線をなしていたが、西の三つのうち中間の星は、直線からわずかに北へそれていた。
p036.03: >-
  東の星は木星から2分離れていた。残りの星と木星との間隔は、それぞれわずか1分であった。
p036.04: >-
  星はみな同じ大きさに見え、小さくはあったが、きわめて明るく、同じ大きさの恒星よりもはるかに輝いていた。
p037.01: >-
  14日、空は曇っていた。
p038.01: >-
  15日、夜の第3時には、四つの星は木星に対して、次に描いたとおりの配置にあった。
p038.02: >-
  すべて西にあり、ほぼ同じ直線上に並んでいた。木星から数えて三番目の星は、わずかに北へ持ち上がっていた。木星にもっとも近い星はすべてのうちでもっとも小さく、残りは順に大きく見えた。木星とそれに続く三つの星との間隔はすべて等しく、2分であった。もっとも西の星は、隣の星から4分離れていた。
p038.03: >-
  それらはきわめて明るく、少しもまたたかなかった。前にも後にも、いつもそうであった。
p038.04: >-
  しかし第7時には、星は三つしかなく、木星に対して次のような姿であった。
p038.05: >-
  すなわち、寸分違わず同じ直線上にあった。木星に近い星はごく小さく、木星から3分離れていた。二番目の星はこの星から1分、三番目の星は二番目の星から4分30秒離れていた。
p038.06: >-
  さらに1時間後には、中間の二つの小さな星はいっそう近づいており、せいぜい30秒しか離れていなかった。
p039.01: >-
  16日、夜の第1時には、三つの星が次の順に並んでいるのを見た。
p039.02: >-
  二つは木星をはさみ、木星から両側に40秒ずつ離れていた。三つ目は西にあり、木星から8分離れていた。
p039.03: >-
  木星に近い二つは、遠い星より大きくはなかったが、より明るく見えた。
p040.01: >-
  17日、日没後第0時30分には、配置は次のようであった。
p040.02: >-
  東の星はただ一つで、木星から3分離れていた。西の星も同じく一つで、木星から11分離れていた。
p040.03: >-
  東の星は西の星の二倍の大きさに見えた。この二つのほかには星はなかった。
p040.04: >-
  しかし4時間後、すなわちおよそ第5時に、東に三つ目の星が現れ始めた。それは、私の考えでは、それまで先の星と重なっていたのである。位置は次のようであった。
p040.05: >-
  中間の星は、東の星のすぐ近くにあって、そこから20秒しか離れておらず、両端の星と木星を通る直線から、わずかに南へそれていた。
p041.01: >-
  18日、日没後第0時20分には、様子は次のようであった。
p041.02: >-
  東の星は西の星より大きく、木星から8分離れていた。西の星は木星から10分離れていた。
p042.01: >-
  19日、夜の第2時には、星の配列は次のようであった。
p042.02: >-
  すなわち、三つの星が木星と寸分違わず一直線上にあった。東に一つあり、木星から6分離れていた。木星は西の最初の星から5分、この星はさらに西の星から4分離れていた。
p042.03: >-
  その時、私は、東の星と木星の間に小さな星が入っているのかどうか、決めかねていた。それは木星のごく近くにあって、ほとんど木星に接するほどだったのである。
p042.04: >-
  しかし第5時には、この星が、木星と東の星の間のちょうど中央の位置を占めているのが、はっきり見えた。したがって配置は次のようであった。
p042.05: >-
  なお、この最後に見つけた星はごく小さかった。しかし第6時には、ほかの星とほぼ同じ大きさになった。
p043.01: >-
  20日、第1時15分には、似た配置が見えた。
p043.02: >-
  三つの小さな星があり、ほとんど見分けられないほど小さかった。木星からも互いからも、1分を超えて離れてはいなかった。西に小さな星が二つあるのか、三つあるのか、私には確かでなかった。
p043.03: >-
  第6時ごろには、次のように並んでいた。
p043.04: >-
  すなわち、東の星は木星から前の二倍の距離、つまり2分離れていた。西の中間の星は木星から40秒、もっとも西の星から20秒離れていた。
p043.05: >-
  最後に第7時には、西に三つの小さな星が見えた。
p043.06: >-
  木星にもっとも近い星は木星から20秒離れていた。この星ともっとも西の星との間隔は40秒であった。この両者の間には、もう一つが見え、わずかに南へそれて、もっとも西の星から10秒を超えない距離にあった。
p044.01: >-
  21日、第0時30分には、東に三つの小さな星があり、互いにも木星にも等しい距離を隔てていた。
p044.02: >-
  間隔は、見積もりでは50秒であった。
p044.03: >-
  西にも星が一つあり、木星から4分離れていた。
p044.04: >-
  東のうち木星にもっとも近い星はすべてのうちでもっとも小さく、残りはいくらか大きく、互いにほぼ等しかった。
p045.01: >-
  22日、第2時には、星の配置は似ていた。
p045.02: >-
  東の星から木星までの間隔は5分、木星からもっとも西の星までは7分であった。
p045.03: >-
  西の中間にある二つの星は互いに40秒離れており、木星に近いほうは木星から1分離れていた。
p045.04: >-
  中間のこれらの小さな星は両端の星より小さかった。それらは獣帯に沿って同じ直線上に伸びていたが、西の三つのうち中間の星だけは、わずかに南へそれていた。
p045.05: >-
  しかし、夜の第6時には、星は次の配置で見えた。
p045.06: >-
  東の星はごく小さく、前と同じく木星から5分離れていた。
p045.07: >-
  西の三つの星は、木星からも互いにも等しい距離で隔てられ、どの間隔もおよそ1分20秒であった。
p045.08: >-
  木星に近い星は、それに続く二つの星より小さく見えた。すべては正確に同じ直線上に並んでいるように見えた。
p046.01: >-
  23日、日没後第0時40分には、星の配置はおよそ次のようであった。
p046.02: >-
  三つの星が木星とともに、いつもそうであったように、獣帯に沿った直線上にあった。東に二つ、西に一つであった。
p046.03: >-
  もっとも東の星は次の星から7分、この星は木星から2分40秒、木星は西の星から3分20秒離れていた。星はみなほぼ同じ大きさであった。
p046.04: >-
  しかし第5時には、それまで木星にもっとも近かった二つの星は、もう見えなくなっていた。私の考えでは、木星の陰に隠れたのである。様子は次のようであった。
p047.01: >-
  24日には、三つの星が見え、すべて東にあって、木星とほぼ同じ直線上にあった。
p047.02: >-
  中間の星がわずかに南へそれていたからである。
p047.03: >-
  木星に近い星は木星から2分、次の星はこの星から30秒、もっとも東の星はこの星から9分離れていた。星はみなたいへん輝いていた。
p047.04: >-
  しかし第6時には、星は二つしか現れず、配置は次のようであった。\footnote{本文によれば、この時には二つの星があり、近いほうが木星から3分、もう一つがそれからさらに8分離れている。ところが初版の図には星が一つしか印刷されておらず、本文と合わない。本版は初版どおりに図を組んだ。}すなわち、木星と寸分違わず同じ直線上にあり、近いほうは木星から3分、もう一つはこの星から8分離れていた。私の思い違いでなければ、先に観測した中間の二つの小さな星が、一つに合わさったのである。
p048.01: >-
  25日、第1時40分には、配置は次のようであった。
p048.02: >-
  東の側にあるのは二つの星だけで、かなり大きかった。もっとも東の星は中間の星から5分、中間の星は木星から6分離れていた。
p049.01: >-
  26日、第0時40分には、星の配列は次のようであった。
p049.02: >-
  三つの星が見えた。うち二つは東、三つ目は木星の西にあった。西の星は木星から5分離れ、東の中間の星は木星から5分20秒、もっとも東の星は中間の星から6分離れていた。それらは同じ直線上にあり、同じ大きさであった。
p049.03: >-
  その後、第5時には、配置はほとんど同じであった。ただ一つ違うのは、木星の近くの東に、第四の小さな星が現れたことで、残りの星より小さく、そのとき木星から30分離れていたが、\footnote{原文は「30分」（\textit{min.\ 30}）。図ではこの星は木星のすぐそばにあり、30秒の誤りと思われる。}直線からわずかに北へ持ち上がっていた。添えた図に示すとおりである。
p050.01: >-
  27日、日没後第1時には、小さな星がただ一つだけ見え、それは東にあって、次の配置であった。
p050.02: >-
  それはごく小さく、木星から7分離れていた。
p051.01: >-
  28日と29日は、雲にさえぎられて、何も観測できなかった。
p052.01: >-
  30日、夜の第1時には、星は次のような配置で見えた。
p052.02: >-
  東に一つあり、木星から2分30秒離れていた。西には二つあり、木星に近いほうは木星から3分、もう一つはこの星から1分離れていた。両端の星と木星は同じ直線上にあったが、中間の星はわずかに北へ持ち上がっていた。もっとも西の星は、ほかの星より小さかった。
p053.01: >-
  末日、第2時には、東の星が二つ、西の星が一つ見えた。
p053.02: >-
  東の星のうち中間の星は木星から2分20秒、もっとも東の星はこの中間の星から30秒離れていた。西の星は木星から10分離れていた。ほぼ同じ直線上にあったが、木星に近い東の星だけは、わずかに北へ持ち上がっていた。
p053.03: >-
  第4時には、東の二つの星は、互いにいっそう近づいていた。離れているのはわずか20秒であった。
p053.04: >-
  これらの観測で、西の星はかなり小さく見えた。
p054.01: >-
  2月1日、夜の第2時には、配置は似ていた。
p054.02: >-
  もっとも東の星は木星から6分、西の星は8分離れていた。東の側には、ごく小さな星がもう一つあり、木星から20秒離れていた。これらは寸分違わず一直線をなしていた。
p055.01: >-
  2日には、星は次の順に見えた。
p055.02: >-
  東にはただ一つの星があり、木星から6分離れていた。木星は西の近いほうの星から4分、この星はさらに西の星から8分離れていた。それらは寸分違わず同じ直線上にあり、ほぼ同じ大きさであった。
p055.03: >-
  しかし、第7時には、四つの星があった。
p055.04: >-
  その中で、木星は中央の位置を占めていた。
p055.05: >-
  これらの星のうち、もっとも東の星は次の星から4分、この星は木星から1分40秒離れていた。木星は西の近いほうの星から6分、この星はさらに西の星から8分離れていた。それらも同じく、獣帯に沿って伸びる同じ直線上にすべてあった。
