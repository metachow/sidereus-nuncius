p015.01: >-
  合から四日目か五日目、月が輝く角をわれわれに見せるとき、暗い部分と明るい部分とを分ける境界は、完全な球体の上でならそうなるはずの、\ruby{楕円}{だえん}の線に沿った一様なものではない。それは不均等でごつごつした、きわめて曲がりくねった線で示されており、添えた図もそれを表している。明るい突起のようなものがいくつも、光と闇の境を越えて暗い部分へ伸び出し、逆に、暗いごく小さな部分が明るい部分の中へ入り込んでいるのである。
p015.02: >-
  それどころか、暗色の小さな斑点がおびただしくあって、⟦8r⟧暗い部分からはまったく切り離されたまま、すでに太陽の光を浴びている領域のほぼ全面にまんべんなく散らばっている。ただし、大きな古くからの斑点のある部分だけは例外である。
p015.03: >-
  ところでわれわれは、いま述べた小さな斑点がどれもみな、つねに次の点で一致していることに気づいた。どれも、黒ずんだ側を太陽のある方向に向けており、太陽と反対の側は、白く輝く\ruby{稜線}{りょうせん}のような、より明るい縁に縁取られているのである。
p015.04: >-
  これとまったく同じ眺めは、地球でも日の出のころに得られる。谷はまだ光を浴びていないのに、谷を太陽と反対の側から取り巻く山々はすでに\ruby{燦然}{さんぜん}と輝いているのが見える。そして、太陽が高く昇るにつれて地上のくぼ地の影が小さくなるように、月のこれらの斑点も、明るい部分が増すにつれて暗さを失っていく。
p016.01: >-
  ところが月では、闇と光の境界が不均等で曲がりくねって見えるだけではない。さらに驚くべきことに、月の暗い部分の内側に、明るい\ruby{尖}{とが}りが非常に数多く現れる。それらは照らされた領域からまったく切り離され、かなりの間隔を隔てて離れている。しばらく時間がたつと、それらは少しずつ大きさと明るさを増し、二時間か三時間後には、そのときすでに広がっている残りの明るい部分と結びつく。その間にも、次から次へとほかの尖りが、あちらこちらで芽ばえるように暗い部分の内側に輝き出し、大きくなり、ついにはいっそう広がった同じ明るい面とつながるのである。
p016.02: >-
  この例も同じ図が示している。
p016.03: >-
  地上でも、日の出の前、影がまだ平地をおおっているときに、もっとも高い山々の頂が太陽の光に照らされているではないか？
p016.04: >-
  しばらくすると、同じ山々の中ほどの、より広い部分が照らされて光は広がり、ついに太陽が昇ると、平地と丘の照らされた部分がつながるではないか？
p016.05: >-
  しかし、このような高まりとくぼみの違いは、月ではあらゆる点で地球の凹凸をはるかに上回るように見える。これは後に示すとおりである。
p016.06: >-
  ここで、月が上弦に向かって急いでいたときに私が観測した、注目に値する事柄を黙って通り過ぎるわけにはいかない。そのときの月の姿も、上に掲げた同じ図が描いている。大きな暗い湾入が明るい部分に切れ込んでおり、下の角の側にあった。私はこの湾入をかなり長く観測し、すっかり暗いのを見ていたが、ほぼ二時間後、くぼみの中央よりやや下に、ある明るい頂が現れ始めた。それは少しずつ大きくなって三角形の形をとったが、なおも明るい面からまったく切り離されていた。やがてその周囲に、ほかの三つの小さな尖りが輝き始めた。⟦9r⟧そうするうちに月は沈む方へ傾き、三角形の部分は広がって大きくなり、残りの明るい部分とつながった。それは、すでに述べた三つの明るい頂になおも取り囲まれたまま、巨大な岬のように暗い湾入へ突き出したのである。
p016.07: >-
  上の角にも下の角にも、その先端に、輝く点がいくつか現れ、残りの光とはまったく離れていた。同じ図に描かれているとおりである。
p016.08: >-
  どちらの角にも暗い斑点が多数あり、とくに下の角に多かった。それらのうち、光と闇の境界に近いものは大きくて暗く見え、離れたものはそれほど暗くなく、いっそう淡く見える。
p016.09: >-
  しかし、先に述べたとおり、斑点の黒ずんだ側はつねに太陽の光が来る方向を向いており、より明るい縁が、太陽と反対の側、月の暗い領域に面した側で黒ずんだ斑点を取り巻いている。
p016.10: >-
  月の表面は、こうして\ruby{孔雀}{くじゃく}の尾の青い目のような斑点で彩られ、あの小さなガラスの器によく似たものになっている。その器は、熱いうちに冷たい水に浸すと、表面にひびが入って波打つようになり、そのため俗に「氷のさかずき」と呼ばれる。\footnote{原語は \textit{glaciales cyathi}、字義どおりには「氷のさかずき」。熱したガラス器を冷水に浸して表面一面にひび模様を生じさせるのは、16世紀のヴェネツィアのガラス職人の技法（氷ガラス）であった。}
p016.11: >-
  しかし、同じ月の大きな斑点は、これと同じように途切れているようには見えず、くぼみや高まりがぎっしり詰まってもいない。むしろいっそう平らで一様であり、ところどころに、より明るい小さな区画が散らばっているだけである。したがって、月はいわばもう一つの地球であるというピュタゴラス派の古い説を復活させたい人がいれば、月のより明るい部分は陸の表面を、より暗い部分は水の表面を、いっそうよく表していると言えよう。私自身は、遠くから眺めて太陽の光を浴びた地球を見れば、陸の表面は明るく、水の表面は暗く見えるにちがいないと、⟦9v⟧一度も疑ったことがない。
p016.12: >-
  そのうえ、月の大きな斑点は、より明るい領域よりも低いところにあるのが見える。というのも、月が満ちていくときも欠けていくときも、光と闇の境では、大きな斑点のまわりのあちらこちらで、それに接する明るい部分が突き出ているからである。これは、図を描くときにわれわれが気づいたことである。しかも、これらの斑点の縁は、より低いだけでなく、より平らで、しわや凹凸に途切れることがない。
p016.13: >-
  これに対して明るい部分は、斑点の近くでとくに高く盛り上がる。そのため、上弦の前にも、ほぼ下弦のころにも、月の上方すなわち北の領域を占めるある斑点のまわりでは、その上にも下にも、巨大な隆起がいくつも高くそびえ立つ。添えた図が示すとおりである。
p017.01: >-
  この同じ斑点は、下弦の前に、ひときわ黒い縁にぐるりと囲まれて見える。この縁は、きわめて高い山脈の稜線のように、太陽と反対の側では暗く見え、太陽に向いた側ではより明るく際立つ。くぼ地ではこの反対のことが起こる。くぼ地の太陽と反対の側が輝いて見え、太陽の側にある部分は暗く影になっているのである。
p017.02: >-
  その後、明るい面が小さくなり、この斑点のほぼ全体が闇におおわれるようになるやいなや、山々のより明るい背は高くそびえて闇の中へ登っていく。
p017.03: >-
  この二通りの現れ方を、次の図が示している。
p018.01: >-
  もう一つ、少なからぬ驚きをもって気づいたことも、決して忘れずに記しておく。月のほとんど中央の位置に、ほかのどれよりも大きく、完全な円形をしたくぼ地がある。私はこれを上弦と下弦のどちらのころにも見て、上に掲げた第二組の図に、できるかぎり似せて写し取った。\footnote{「第二組の図」とは、[9v]と[10r]の二枚の月の図を指すと考えられる（第一の図は[8r]の一枚）。二枚はそれぞれ上弦のころと下弦のころの月を描き、この大きな円形のくぼ地は、どちらでも光の境界のそばにある。[10v]の下の図にも見える。}影と光のありさまについていえば、これは、ボヘミアのような地方が地上で、ごく高い山々に周囲をぐるりと完全な円周の形に取り囲まれ、四方をふさがれていたとしたら呈するであろう眺めを、そのまま見せる。\footnote{ボヘミア：現在のチェコ西部。周囲を山脈に囲まれた盆地である。}月ではそれを取り巻く山並みがあまりに高いので、光と影の境界がこの形の直径の中ほどに達するより前に、月の暗い部分に接するもっとも外側の縁が、すでに太陽の光を浴びているのが見える。
p018.02: >-
  ほかの斑点と同じく、その影の部分は太陽に向き、明るい部分は月の闇のほうに位置している。私はこれを三度目として喜んで指摘しておく。月のより明るい領域の全体に散らばる凹凸と起伏について、これがきわめて確かな論拠だからである。これらの斑点のうち、光と闇の境界に接するものはつねにより黒く、離れたものは小さくなり、暗さも薄れて見える。そのため、ついに満月となって月が円盤全体を満たすときには、くぼみの暗さと高まりの白さとは、ごくわずかな、きわめて細い違いで隔てられるにすぎなくなる。
p019.01: >-
  以上に述べたことは、月のより明るい領域で観測される。しかし大きな斑点では、より明るい部分でわれわれが必然的に認めざるをえないような、くぼみと高まりの違いは見られない。明るい部分では、太陽の光線の当たり方が次々に変わり、太陽が月を見る位置も多様であるために、形が変化するからである。大きな斑点にも、⟦11v⟧図に記したとおり、いくらか暗めの小さな区画はたしかにある。だが、それらはつねに同じ姿を見せ、暗さが強まったり弱まったりすることはなく、太陽の光線がより斜めに当たるか、それほど斜めでなく当たるかに応じて、ごくわずかな差で、少し暗く見えたり少し明るく見えたりするだけである。そのうえ、それらは斑点の隣り合う部分と穏やかにつながり、境界は混じり合って溶け込んでいる。月のより輝く表面を占める斑点では事情が異なる。それらは、ごつごつした角ばった岩に覆われた切り立つ断崖のようで、影と光のはっきりした対比によって、線を引いたように区切られている。
p019.02: >-
  なお、これらの大きな斑点の内側には、ほかより明るい小区画が見え、中にはきわめて明るいものもある。しかし、これらも暗い区画も、その見え方はつねに同じで、形にも明るさにも暗さにも変化がない。したがって、それらが現れるのは各部分が実際に異なっているからであって、同じ部分の形に凹凸があるために、太陽の照らし方が変わるたびに影が違って動く、というだけのことではないのは、疑いなく明らかである。月のより明るい部分を占めるほかの小さな斑点では、まさにそのとおりのことが起こる。それらは日ごとに変わり、増し、減り、消える。高まりの影だけから生じるからである。
p020.01: >-
  だが私は、ここで多くの人が大きな疑いにとらわれ、重い困難に陥って、すでに説明し、これほど多くの現象によって確かめられた結論を、疑わざるをえなくなることを感じている。
p020.02: >-
  というのは、月の表面のうち太陽の光をいっそう明るく返す部分が、曲折、すなわち数えきれない隆起とくぼみに満ちているのなら、なぜ、満ちていく月では西に向いたもっとも外側の円周が、欠けていく月ではもう一方の東の半円周が、⟦12r⟧そして満月ではその全周が、不均等でごつごつした曲がりくねったものとしてではなく、正確に丸く、コンパスで描いたようで、隆起にもくぼみにも侵食されていないものとして見えるのか？とくにそれが疑問となるのは、縁の全体が月のより明るい物質から成り、その物質は全体が\ruby{瘤}{こぶ}だらけで穴だらけだとわれわれが述べたからである。大きな斑点はどれももっとも外側の周縁まで伸びておらず、すべて縁から遠いところに集まっているのが見える。
p020.03: >-
  これほど重い疑いを生む契機となっているこの現象について、私は二つの原因を、したがってこの疑いに対する二通りの解決を示す。
p020.04: >-
  第一に、もし月の本体の隆起とくぼみが、われわれに見える半球を限る円周という、ただ一つの円周に沿ってのみ広がっているなら、月は歯車のような姿でわれわれに現れうるし、実際そうならざるをえないだろう。つまり、瘤だらけで曲がりくねった輪郭に縁取られるはずである。だが、高まりの列がただ一つだけ、一つの円周にのみ沿って並んでいるのではなく、くぼみや曲折をともなう多数の山脈の列が月のもっとも外側の縁のまわりに並び、しかもそれらが見える半球だけでなく、裏側の半球にも（ただし両半球の境の近くに）ある場合には、遠くから眺める目は、高まりとくぼみの違いをまったく見分けることができない。同じ円周すなわち同じ列に並ぶ山々の間隙は、別の列にある別の高まりが前に立ちふさがるために隠されるからである。観察者の目が、これらの高まりの頂と同じ一直線上にあるときは、とりわけそうなる。
p020.05: >-
  地上でも、多くの密集した山々の稜線は、眺める人が遠く離れ、同じ高さに立っていれば、一つの平らな面に沿って並んでいるように見える。
p020.06: >-
  同様に、荒れ狂う海では、高い波頭が一つの同じ平面に沿って広がっているように見える。⟦12v⟧波の間には巨大な渦やくぼみが数多くあり、それがあまりに深くて、高い船の竜骨ばかりか、船尾も帆柱も帆も、その間に隠れてしまうのにもかかわらずである。
p020.07: >-
  したがって、月そのものにおいてもその周縁のあたりには、高まりとくぼみが幾重にも配列されており、遠くから眺める目はそれらの頂とほぼ同じ平面に置かれているのだから、それらの頂をかすめて通る視線に対して、それらが均等で少しも曲がりくねらない線として現れるとしても、誰も不思議に思うべきではない。
p020.08: >-
  この理由にもう一つを付け加えることができる。すなわち、月の本体のまわりには、地球のまわりと同じく、残りのアイテールより密な物質から成る球層があり、これは太陽の光を受けて反射することができるが、視線の通過を妨げるほど（とくに照らされていないときには）不透明ではない。\footnote{アイテール（\textit{aether}）：アリストテレス以来の自然学で、月より上の天界を満たすとされた第五の元素。}
p020.09: >-
  この球層は太陽の光線に照らされると、月の本体をより大きな球の姿で見せる。もしその厚みがもっと深ければ、われわれの視線を阻んで、月の固い本体まで届かないようにすることもできるだろう。そして実際、月の周縁のあたりではそれはより深い。ここで深いというのは、絶対的な意味ではなく、それを斜めに横切るわれわれの視線に対して、という意味である。したがってこの球層は、とくに光を帯びているときには、われわれの視線を阻み、太陽にさらされた月の周縁をおおい隠すことができる。
p020.10: >-
  このことは添えた図でいっそうはっきりわかる。図では月の本体ABCが、⟦13r⟧蒸気の球層DEGに取り巻かれている。Fにある目は、月の中間の部分、たとえばAには、さほど深くない蒸気DAを通して届く。だがもっとも外側の縁に向かっては、より深い蒸気の厚みEBが、その境でわれわれの視線をさえぎる。
p020.11: >-
  その証拠は、月の光を浴びた部分が、暗い球の残りの部分よりも大きな円周を持つように見えることである。これと同じ原因を、月の大きな斑点がどこでももっとも外側の縁まで伸びているのが見えない理由として、道理にかなうと考える人もいるだろう。縁の近くにもいくつかあるだろうと推測するのは自然だが、それらがより深く、より明るい蒸気の層の下に隠れているために見えないのだと考えるのは、もっともらしく思える。
p021.01: >-
  こうして、月のより明るい表面が、至るところ隆起とくぼみに覆われていることは、これまでに説明した現象から、十分に明らかだと私は思う。
p021.02: >-
  残るは、それらの大きさについて述べることである。地球の凹凸が月の凹凸よりはるかに小さいことを、これから示す。小さいというのは、絶対的に言ってもそうなのであって、それぞれの球の大きさに対する比においてだけではない。これは次のように明白に示される。
p022.01: >-
  私は、月と太陽のさまざまな位置関係のもとで、月の暗い部分の内側にある頂が、光の境界からかなり離れているにもかかわらず、光を浴びて見えることを、何度も観測した。そこでその距離を月の直径全体と比べて、この間隔が直径の二十分の一を超えることもあるとわかった。
p022.02: >-
  これを前提として、月の球を考える。その大円をCAF、中心をE、直径をCFとし、CFは地球の直径に対して二対七であるとする。地球の直径は、より正確な観測によればイタリア・マイルで7000であるから、CFは2000、⟦13v⟧CEは1000となり、CF全体の二十分の一は100マイルである。\footnote{イタリア・マイル：ガリレオの時代、1マイルの長さはイタリアの国ごとに異なり、おおよそ1.5〜1.7 kmであった。月と地球の直径比は現代の値ではおよそ三対十一で、ガリレオの二対七はこれにかなり近い。}
p022.03: >-
  次に、CFを、月の明るい部分と暗い部分を分ける大円の直径とする（太陽は月から非常に遠く離れているので、この円は大円と知覚できるほどには違わない）。そしてAは、点Cからその二十分の一だけ離れているとし、半径EAを引いて延長し、照らす光線を表す接線GCDと点Dで交わらせる。
p022.04: >-
  すると、CEを1000としたとき、弧CAすなわち直線CDは100であり、DCとCEの平方の和は1010000で、これはDEの平方に等しい。したがって、ED全体は1004より大きく、ADは、CEを1000としたときの4より大きい。\footnote{すなわち、ピュタゴラスの定理により $\mathrm{DE}=\sqrt{1000^2+100^2}\approx 1004.99$、よって $\mathrm{AD}=\mathrm{DE}-\mathrm{EA}\approx 4.99$ である。ガリレオはその下限「4より大きい」だけを採っている。}
p022.05: >-
  したがって、月における高さADは、太陽の光線GCDに達するまで高くそびえ、境界の点Cから距離CDだけ隔たったある頂を表しており、⟦14r⟧4イタリア・マイルを超える高さである。
p022.06: >-
  ところが地球には、垂直の高さが1マイルに近づく山さえ一つもない。したがって、月の高まりが地球の山々より高いことは明らかである。
